, the first part of the body to heat up is the ___  ↔  Recording evidence: When this happens, there is a rapid rise in the heartbeat and circulation is affected. The area around the heart warms more quickly than the rest of the animal.","options":[],"type":"Note Completion","pair":null}},"answers":{"1":"80","2":"garage","3":"kitchen","4":"heater","5":"toaster","6":"Friday evening","7":"supermarket","8":"petrol","9":"1 June","10":"exam","11":"8:55","12":"hot meal","13":"15 minutes","14":"sports","15":"poster","16":"month","17":"clubs","18":"E","19":"A","20":"F","21":"B","22":"A","23":"B","24":"A","25":"B","26":"E","27":"A","28":"D","29":"C","30":"E","31":"resources","32":"stressful","33":"competition","34":"light","35":"reduction","36":"mud","37":"starvation","38":"evaporation","39":"nest","40":"heart"},"alternatives":{"1":["80","eighty"],"2":["garage"],"3":["kitchen"],"4":["heater"],"5":["toaster"],"6":["Friday evening"],"7":["supermarket"],"8":["petrol"],"9":["1 June","1st June","1st of June","1st of june","June 1","June 1st","the 1st of June"],"10":["exam"],"11":["8:55","8.55","8.55 a.m.","8.55am","8:55 a.m.","8:55am"],"12":["hot meal"],"13":["15 minutes","15 min","fifteen min","fifteen minutes"],"14":["sports","sport"],"15":["poster"],"16":["month"],"17":["clubs"],"18":["E"],"19":["A"],"20":["F"],"21":["B"],"22":["A"],"23":["B"],"24":["A"],"25":["B"],"26":["E"],"27":["A"],"28":["D"],"29":["C"],"30":["E"],"31":["resources"],"32":["stressful"],"33":["competition"],"34":["light"],"35":["reduction"],"36":["mud"],"37":["starvation"],"38":["evaporation"],"39":["nest"],"40":["heart"]},"part_audio_boundaries":{"1":{"start":0.0,"end":365.64},"2":{"start":365.64,"end":792.12},"3":{"start":792.12,"end":1187.05},"4":{"start":1187.05,"end":1645.05}},"transcript":{"1":"Recordings, and you will have to answer questions on what you hear. There will be time for you to read the instructions and questions, and you will have a chance to check your work. All the recordings will be played once only.\n\nThe test is in four sections. Write all your answers in the listening question booklet. At the end of the test, you will be given 10 minutes to transfer your answers to an answer sheet.\n\nNow turn to section 1 on page 2 of your question booklet. Section 1. You will hear two students called Peter and Jim talking about sharing a house together. First you have some time to look at questions 1 to 5 on page 2. You will see that there is an example that has been done for you.\n\nOn this occasion only, the conversation relating to this will be played first. Hi, I'm Jim. I'm here about the room. Hi, I'm Peter. We talked on the phone, didn't we? Come on in. Great. I just need to find out a few things before I make up my mind. Jim is here to find out about a room, so room has been written in the space. Now we shall begin.\n\nYou should answer the questions as you listen, because you will not hear the recording a second time. Listen carefully and answer questions 1 to 5. Hi, I'm Jim. I'm here about the room. Hi, I'm Peter. We talked on the phone, didn't we? Come on in. Great. I just need to find out a few things before I make up my mind. OK. Well, first of all, I wasn't quite clear about the rent.\n\nIt depends on the room you have. I have the large bedroom, so I pay $110 a week. Yours is $80, because it's a bit smaller. That's not too bad. The last place I was in was $100 a week, and it was much smaller. And it seems like a good location.\n\nYeah, and the shops are pretty close. The only thing is, it's not very good for public transport. The nearest bus stop is quite a walk. That's not a problem. I've got a car. By the way, is there anywhere I can park? Well, you're lucky, because this house has a garage.\n\nAt the moment, there are some empty boxes in there, but there's still plenty of room for your car. You can't park in the street, it's zoned no parking, and the back lane is too narrow. Fine. Now, what about phone calls? I didn't see a phone in the hall when I came in. I've got a mobile which my friends usually call me on, but a phone in the house is useful. Yeah, it's in the kitchen.\n\nIt was in the living room, but it was hard to hear over the television. Oh, and we pay for our own calls. That's fair enough. And what about my room? Yes, we'll go up and look in a minute. It's at the front of the house. It's a nice room, and there's a cupboard and desk in there already.\n\nBut it does get quite cold at night in that room, and it doesn't have a heater. No problem. My friend has just given me one, so I'll bring that. He's gone travelling and has left me with a big box of things to mind. Anything else I can bring? Well, we've just got a microwave, and my mother bought me a rice cooker, but it would be great if you had a toaster. Mine's just broken. I'll have a look in the box.\n\nBefore you hear the rest of the conversation, you have some time to look at questions 6 to 10 on page 2. Now listen and answer questions 6 to 10. One thing. I'm a keen sports fan, and I usually watch the game on TV on Friday evening. Would that be OK? Me too, so that's good. And I work at the supermarket on Tuesday and Thursday nights.\n\nGreat. You can do the shopping then. Do you have most of your lectures in the morning or afternoon? In the afternoons. Why? Mine are in the afternoons too. You could give me a lift. We can share the petrol.\n\nGood idea. When do you think I could move in? Well, if you're interested, and the rent is OK, I need someone by the 1st of June when the new rent period starts. Yes, that should be fine. The house seems big enough. The rent's reasonable. I've got an exam next week, so I'll move in after that if that's OK. Yeah, that sounds fine.\n\nThat is the end of section 1. You now have half a minute to check your answers.","2":"Now turn to section 2 on page 3. Section 2. You will hear a teacher giving a talk about a junior school to a group of parents. First you have some time to look at questions 11 to 17 on page 3. Now listen carefully and answer questions 11 to 17.\n\nOkay, can everybody hear me? Good, well I'd like to welcome all the new parents to Springdown Junior School. My name is Anne Rawson and I'm the assistant head teacher. What I'd like to do is tell you about the school day and show you round the school and perhaps you can ask me any questions you may have at the end. Right, first of all let me start by telling you a little bit about what happens here and what's on offer.\n\nChildren are expected to arrive at school between 8.45 and 8.50 and the bell is rung for everybody to go to their classrooms at 8.55 so that we can take the register. We then have assembly at 9.00 when the whole school meets in the hall for the head to talk to the children. He may discuss what's happened in the news or something that is important for the school.\n\nLessons run until 4.00pm with an hour for lunch. Lunch is served in the canteen and children can bring their own packed lunch or a hot meal is available. They also play outside and get some fresh air.\n\nIn the middle of the morning and the middle of the afternoon there are two breaks of 15 minutes when the children also generally go outside unless it's wet. Now we encourage the children to do as much as they can and we offer several ways of achieving this. For example on Thursday afternoons rather than continuing with lessons we expect the whole school to do sports.\n\nWe vary these between summer and winter and everything is supervised by the teachers. Also we like the children to work on something artistic over a long period of time so for each of the three terms they are expected to produce a poster. This will normally be on something particular that they have studied that term such as the environment.\n\nWe also make sure we keep a close eye on how each child is doing in their schoolwork and every month rather than the teacher giving the children a report as I know some schools do they have to do tests and we record their performance over the year. We are very proud of our school and of the very good results we achieve.\n\nOur teachers are all very committed to the school and at the end of the school day many of them have set up clubs that the children go to for an extra hour to learn a new skill such as music.\n\nBefore you hear the rest of the talk you have some time to look at questions 18 to 20 on page 4. Now listen and answer questions 18 to 20.\n\nOK, I'll quickly show you where everything is. We're here at the main entrance and on the right where you would normally expect to find reception you'll see the head's office. He likes to see visitors personally and his door is always open. Opposite this are two of the classrooms but most of the classrooms are down the long corridor. The library then is situated between those two classrooms and we are hoping that we will be able to create a computer room within that so that the children can have somewhere quiet to work on their own.\n\nOn the left of the classrooms we have converted one of the old cloak rooms to create a music room and children can go in there at lunchtime if they want to. Now if you come with me through the main hall here. OK, now as you can probably see this main hall is a new addition this year and we are very pleased with it.\n\nWe used to be squashed into the old assembly hall next door which as you can see has now been turned into a gym for the children and we have weekly lessons here. Do feel free to go and look round the classrooms and I'll be waiting here to answer your questions.\n\nThat is the end of section 2. You now have half a minute to check your answers.","3":"Part 3. You will hear two students called Jen and Rob discussing a project they are about to start working on. First you have some time to look at questions 21 to 24. Now listen carefully and answer questions 21 to 24.\n\nHi Jen. Hi Rob. We need to look at this project we're doing together in Forensic Linguistics. Sure. The first thing we have to do is define Forensic Linguistics. I thought we could say something like, linguistics involves the analysis of language, and forensic refers to using scientific techniques to solve crimes.\n\nSo Forensic Linguistics involves analysing people's use of language to find out whether they've committed a crime. What do you think of that as a definition? Sounds OK. I looked it up in my dictionary and I got something similar.\n\nThen we can add something about what forensic linguists actually do to back it up. You know, like analysing documents to find out who wrote them. Good point. Let's do that. What about the actual project? I'm glad we chose voice identification as the topic. Yeah.\n\nWe've been given a voice recording of a possible suspect. Not a real suspect of course. So we've got to listen to the recording and analyse their voice. Should be OK? Well, I've already listened to the recording and I can't even tell if it's a man or a woman. But I guess that doesn't matter. The accent's a local one, though I'm not sure how that will affect anything.\n\nWhere we're really going to get in trouble is that the recording is very unclear. I'm sure they've done that to test us. Well, they weren't going to make it easy. We have to analyse the voice sample with that spectrograph instrument, don't we? Learning what to do with it is the only thing that really concerns me about this project. It'll be fine. I guess so.\n\nAnd then we have to interview the suspect and make our own recording face to face and decide if it's the same person as on the original recording, right? Yes. It's not an exact science but it's usually pretty accurate. You can often tell even when they've got a cold it's the same person but they might do something like speaking with another accent because the tutor suggests they do that just to test us.\n\nSo let's get on with it then. Oh, and don't start your usual self-doubt about whether you can do the work or not. You usually do OK in the end. I reckon that as long as we focus on the main points of the assignment we can think about the finer details later. My problem is creating things to worry about before I've even started.\n\nBefore you hear the rest of the discussion you have some time to look at questions 25 to 30. Now listen and answer questions 25 to 30.\n\nWe'll have to do some background reading first. I'll go to the library later and get what we need. OK. I've already looked at Forensics Today and it didn't say much about voice identification so we needn't bother with that one. Language and Crime looks a bit more promising, doesn't it? I've got that out of the library already so we don't need to worry about borrowing that.\n\nResearch Methods in Forensic Linguistics. I guess we ought to borrow that. And Voice Identification will be a useful one. I'll borrow that from our classmate George. He won't need it for his project. But we should get out Modern Forensic Techniques. We need all the help we can get on that subject. OK. That's that sorted out.\n\nNow on to the practical stuff. I'm not sure about how we're going to record the voices. I'm not too good on the technical side of things. Me neither. We'd better work out what we're doing. At least we get more than one opportunity to speak to the person playing the suspect.\n\nI just hope whoever it is won't make the task too tricky. I'm sure they won't be too hard on us. And as long as we do our research properly it shouldn't be too hard to do the rest of it. I'm more worried about fitting in the writing up. I know. We've got loads of other assignments to finish as well.\n\nNow, Rob, let's decide how we're going to split the writing between us. Are you any good at introductions? They always seem to let me down. OK. Leave that to me. Are you OK to do the literature review then? Maybe we should split that part. I don't mind writing the methodology section if you feel comfortable doing the discussion and conclusions. OK. And we can do the analysis between us as well. Great. Let's get started.\n\nThat is the end of Part 3. You now have 30 seconds to check your answers to Part 3.","4":"Now turn to section 4 on page 7. Section 4. You will hear a biology lecture on how living things deal with changes in their environment by entering a state called dormancy. First you have some time to look at questions 31 to 40 on page 7. Now listen carefully and answer questions 31 to 40.\n\nWe've been talking about some ways in which plants and animals deal with changes in their environment, and today we'll continue that discussion by looking at dormancy. First we'll cover what dormancy is and why organisms become dormant.\n\nDormancy is a state of inactivity that organisms or living things enter when they need to conserve the resources available to them and reduce their demands on their environment. Most major groups of plants and animals have some representatives that can become dormant.\n\nSo what is the value of dormancy? To start with, animals that have the ability to become dormant can survive conditions which are stressful in environmental terms. For instance, when lakes, ponds or rivers dry up, aquatic organisms that have the ability to enter dormancy can survive the drought, while others that cannot do this will die.\n\nAnother advantage is that creatures that can become dormant in very inhospitable conditions, such as extreme cold, can live in a larger range of places than other organisms. And because of this, because they can live in places where other animals can't survive, when they are actually active and looking for food, the amount of competition they have to deal with from other creatures is greatly reduced.\n\nLet's move on to look at what causes dormancy. There are a number of variables, but the ones that are the most significant are changes in temperature and the amount of light organisms get. Availability of food, water and oxygen is also very important.\n\nNow we'll explore some specific examples. Let us first look at dormancy in insects. Insects can experience a reduction in their metabolism, which is a form of dormancy called diapause. In insects, diapause is either a reaction to difficult environmental conditions or a necessary part of the life cycle, such as with butterflies or certain moths. In terms of environment, it's interesting to note that through dormancy insects can survive when it's very cold.\n\nAnother creature we'll look at is fish. Fish share the same main environmental causes for dormancy as other creatures, but as one might imagine, they are particularly sensitive to drought. Let's take the African lungfish as an example. When the water supply is low, the African lungfish burrows deep into the mud. It surrounds itself with a cocoon of slime and remains inactive. While dormant, it faces two dangers.\n\nOne is the possibility of starvation, and to overcome this it relies on fat it has stored up in its body. The other is desiccation, or drying up, which is addressed through a reduction in the production of urine.\n\nSnails are also known to become dormant. Some snails seal off their shell with a membrane of dried mucus after settling at their place of dormancy. Other snails do not have this possibility. They trust the protection of their shell. Snails that remain outside during their dormancy can usually be recognized by a rather brightly colored shell reflecting the sunlight and so minimizing evaporation. That is why in open habitats, banded snails usually have a yellow shell.\n\nProbably the most well-known type of dormancy is hibernation, which occurs in warm-blooded creatures during the winter. We know that warm-blooded animals maintain a regular body temperature. So what's really interesting about hibernators, true hibernators that is, is they can actually adapt to extreme conditions by turning off their internal thermostat, so to speak, and hibernating until conditions improve.\n\nLet's examine the behavior of a true hibernator, the Arctic ground squirrel. This squirrel digs underground and builds a nest that is insulated. Once in its nest, it curls up into a ball and tucks in its arms, legs, and tail. Its body temperature mirrors the cold of its surroundings.\n\nAt this point, the squirrel barely breathes and doesn't react to stimulus in a normal way. During this period of hibernation, the squirrel loses nearly 40% of its weight. The process of awakening for the Arctic ground squirrel takes about three hours.\n\nWhen this happens, there is a rapid rise in the heartbeat and circulation is affected. The area around the heart warms more quickly than the rest of the animal. And despite the strain of hibernation, within 24 hours of coming out of it, the squirrel's body processes are basically normal.\n\nThat is the end of section 4. You now have half a minute to check your answers. That is the end of the listening test. You now have 10 minutes to transfer your answers to the listening answer sheet."},"transcript_source":"Full Part 1-4 transcript recovered from matching public transcriptions for the supplied listening source and checked against the source question/evidence anchors.","transcript_is_full":true,"timestamps_source":"source package review/evidence timestamps","script_completion":[{"q":101,"part":1,"n":1,"match":"not very good for public transport","answer":"not very good for public transport","lexical_type":"adjective + prepositional chunk"},{"q":102,"part":1,"n":2,"match":"still plenty of room for your car","answer":"still plenty of room for your car","lexical_type":"noun phrase + prepositional chunk"},{"q":103,"part":1,"n":3,"match":"hard to hear over the television","answer":"hard to hear over the television","lexical_type":"verb phrase"},{"q":104,"part":1,"n":4,"match":"get quite cold at night","answer":"get quite cold at night","lexical_type":"collocation"},{"q":105,"part":1,"n":5,"match":"keen sports fan","answer":"keen sports fan","lexical_type":"noun collocation"},{"q":106,"part":1,"n":6,"match":"give me a lif  to.</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q23\" type=\"radio\" value=\"C\"/> because they feel uncomfortable about their accent.</label></div></div><div class=\"mcq-item q-block\" data-q=\"24\"><p><strong>24.</strong> What does Rob think about Jen’s approach to study?</p><div class=\"options\" style=\"margin-left:20px\"><label class=\"multi-choice-option\"><strong>A)</strong> <input name=\"q24\" type=\"radio\" value=\"A\"/> She worries too much about her ability.</label><label class=\"multi-choice-option\"><strong>B)</strong> <input name=\"q24\" type=\"radio\" value=\"B\"/> She often ignores the most important issues.</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q24\" type=\"radio\" value=\"C\"/> She has trouble getting started.</label></div></div></div><div class=\"task-card\"><div class=\"question-prompt instructions-block\"><p><strong>Questions 25-26</strong></p><p>Choose <strong>TWO</strong> correct answers.</p></div><div class=\"choose-two-options\"><div><b>A</b> Voice Identification</div><div><b>B</b> Modern Forensic Techniques</div><div><b>C</b> Language and Crime</div><div><b>D</b> Forensics Today</div><div><b>E</b> Research Methods in Forensic Linguistics</div></div><div class=\"choose-two-selects\"><label><b>25</b> <select class=\"answer-select\" id=\"q25\" data-q=\"25\" data-qnum=\"25\"><option value=\"\">Select</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option></select></label><label><b>26</b> <select class=\"answer-select\" id=\"q26\" data-q=\"26\" data-qnum=\"26\"><option value=\"\">Select</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option></select></label></div></div><div class=\"task-card\"><div class=\"question-prompt instructions-block\"><p><strong>Questions 27-28</strong></p><p>Choose <strong>TWO</strong> correct answers.</p></div><div class=\"choose-two-options\"><div><b>A</b> how much time they have for writing up the project</div><div><b>B</b> being able to do enough research</div><div><b>C</b> only speaking to the ‘suspect’ once</div><div><b>D</b> using recording equipment</div><div><b>E</b> how easy it will be to contact the ‘suspect’</div></div><div class=\"choose-two-selects\"><label><b>27</b> <select class=\"answer-select\" id=\"q27\" data-q=\"27\" data-qnum=\"27\"><option value=\"\">Select</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option></select></label><label><b>28</b> <select class=\"answer-select\" id=\"q28\" data-q=\"28\" data-qnum=\"28\"><option value=\"\">Select</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option></select></label></div></div><div class=\"task-card\"><div class=\"question-prompt instructions-block\"><p><strong>Questions 29-30</strong></p><p>Choose <strong>TWO</strong> correct answers.</p></div><div class=\"choose-two-options\"><div><b>A</b> Methodology</div><div><b>B</b> Literature review</div><div><b>C</b> Introduction</div><div><b>D</b> Analysis</div><div><b>E</b> Discussion and conclusions</div></div><div class=\"choose-two-selects\"><label><b>29</b> <select class=\"answer-select\" id=\"q29\" data-q=\"29\" data-qnum=\"29\"><option value=\"\">Select</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option></select></label><label><b>30</b> <select class=\"answer-select\" id=\"q30\" data-q=\"30\" data-qnum=\"30\"><option value=\"\">Select</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option></select></label></div></div>","4":"<div class=\"task-card\"><h2>PART 4</h2><div class=\"question-prompt instructions-block\"><p><strong>Questions 31-40</strong></p><p>Complete the notes below.</p><p>Write <strong>ONE WORD ONLY</strong> for each answer.</p></div><div style=\"margin-top:20px\"><h3 class=\"centered-title\"><strong>Dormancy</strong></h3><div class=\"summary-section dormancy-notes\">\n<p><strong>Organisms enter a state of dormancy, or inactivity, to:</strong></p><p>• save available <span class=\"q-input-wrap\" data-q=\"31\" data-qnum=\"31\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q31\" type=\"text\"/></span><br>• reduce demands on their environment</p><p><strong>Value of dormancy</strong></p><p>• can live in conditions which are environmentally <span class=\"q-input-wrap\" data-q=\"32\" data-qnum=\"32\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q32\" type=\"text\"/></span><br>• can live in a wider range of places<br>• have less <span class=\"q-input-wrap\" data-q=\"33\" data-qnum=\"33\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q33\" type=\"text\"/></span> from other animals</p><p><strong>Causes of dormancy</strong></p><p>• changes in temperature and <span class=\"q-input-wrap\" data-q=\"34\" data-qnum=\"34\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q34\" type=\"text\"/></span><br>• availability of food, water, oxygen</p><p><strong>Dormancy in insects</strong></p><p>• There may be a <span class=\"q-input-wrap\" data-q=\"35\" data-qnum=\"35\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q35\" type=\"text\"/></span> in their metabolism (diapause)</p><p><strong>The African lungfish</strong></p><p>• It buries itself in the <span class=\"q-input-wrap\" data-q=\"36\" data-qnum=\"36\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q36\" type=\"text\"/></span> and creates a slimy cocoon<br>• Two dangers: <span class=\"q-input-wrap\" data-q=\"37\" data-qnum=\"37\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q37\" type=\"text\"/></span> and desiccation</p><p><strong>Snails</strong></p><p>• Light-coloured shells reflect sunlight and limit <span class=\"q-input-wrap\" data-q=\"38\" data-qnum=\"38\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q38\" type=\"text\"/></span></p><p><strong>The Arctic ground squirrel</strong></p><p>• It hibernates in an insulated, underground <span class=\"q-input-wrap\" data-q=\"39\" data-qnum=\"39\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q39\" type=\"text\"/></span><br>• When it wakes up, the first part of the body to heat up is the <span class=\"q-input-wrap\" data-q=\"40\" data-qnum=\"40\"><input autocomplete=\"off\" class=\"answer-input inline\" id=\"q40\" type=\"text\"/></span></p></div></div></div>"};
const TRANSCRIPTS={"1": "\n<strong>SECTION 1<\/strong><br/><br/>\n            Questions 1-10<br/><br/>\n            You will hear a telephone conversation between a man who wants to rent an apartment and an agent at a property rental service.<br/><br/>\n            Good morning, AA Property. Can I help you? Yes, good morning.<br/>\n            I'm looking for an apartment to rent. OK. Is that here in Birmingham? That's right.<br/>\n            Right. I'll just take some personal details if I may. So, if I can just take your name? Kevin Walker.<br/>\n            Right. And can I have your present address, please? Well, we're staying with friends at present, so the address is <span class=\"highlight\">354 Forest<\/span> Road. Is that Forest with one R? That's right.<br/>\n            And that's in West Bromwich. I'm afraid I don't know the postcode. That's OK.<br/>\n            And a contact phone number? <span class=\"highlight\">07817983602<\/span>. Lovely. And if I could just ask your occupation? Certainly.<br/>\n            I'm a <span class=\"highlight\">dentist<\/span> and my wife's a teacher, but she's at home at present looking after the children. OK. So, I'll just put your occupation.<br/>\n            Right. Well, now I'll take some details about the kind of property you're looking for. You said you're looking for an apartment, is that right? Yeah.<br/>\n            OK. So, how many bedrooms do you want? Two. And did you want it furnished? No, <span class=\"highlight\">unfurnished<\/span>.<br/>\n            Right. Well, that gives you quite a bit more choice, so that's good. And what's the maximum rent you'd be prepared to pay? Well, we'd like to stay under £600 if possible, but we could go up to £650 for the right place.<br/>\n            Right. So, do you have any other definite requirements? Well, coming back to the bedrooms, they have to be <span class=\"highlight\">doubles<\/span>, both of them. OK.<br/>\n            I'll make a note of that. So, are you looking for something straight away? I assume you are if you're staying with friends. Well, as soon as possible, yes. Well, it's October 17th today, so we're probably looking at <span class=\"highlight\">November 1st<\/span> at the earliest.<br/>\n            Would that be OK? Well, I'd have preferred something in October, but OK, let's put that date down for now. Fine. Now, is there anything else you'd like? Well, our last flat had a garage, but actually, we never used it, so I'm not really worried about that.<br/>\n            But we'd like a <span class=\"highlight\">balcony<\/span> if possible. It's nice not to be too shut in. Yes.<br/>\n            You'll find most modern apartments do have one. It's only the converted properties that don't. But of course, if you're in an older property, you might have use of a <span class=\"highlight\">garden<\/span>.<br/>\n            Would that be a possible alternative? Oh yes, either of those would be good. What about transport? Would you want off-street parking? No, parking doesn't matter, but it'd be good to have somewhere not too far from a <span class=\"highlight\">station<\/span> if possible. But it's not essential.<br/>\n            I've got a bike. Right. And what else? You'll want a lounge, and will you want a separate dining room? Well, not really.<br/>\n            We tend to eat in the kitchen, so it'd be good if that was large enough for us to do that. That might be difficult, but I'll make a note of it anyway. Right, well, let's have a look at what...\n        ", "2": "\n<strong>SECTION 2<\/strong><br/><br/>\n            Questions 11-20<br/><br/>\n            You will hear a local councillor giving advice on the radio about cleaning up after recent bad weather.<br/><br/>\n            Welcome to Radio OK, your community radio station. After our recent bad storm, we have Councillor Phil Evans joining us to tell us about the clean-up effort.<br/>\n            Welcome, Phil. Hello. Thanks for having me.<br/>\n            Well, we had some pretty severe weather at the weekend. Thankfully, it wasn't quite as bad as last year's storm. Although there was some damage to trees, it was definitely not on the same scale as last year, and we were expecting the river level to rise higher than it did.<br/>\n            But having said that, a <span class=\"highlight\">much larger number of homes have been damaged this year<\/span> due to flash flooding near the creek. Those of you who have experienced flooding, we ask you to be especially careful. I know it's upsetting to see your home full of water, but please be patient, as there's nothing you can do until the river level drops, hopefully in two or three days.<br/>\n            You won't have any electricity at the moment, but we are working as fast as we can to get it reconnected. When it comes to cleaning up your garden, you might be tempted to just throw dead branches and so on into your normal garbage bin. Please don't.<br/>\n            We're asking people to simply <span class=\"highlight\">stack them outside on the footpath<\/span> ready for Council collection. We plan to cut them up and use them for composting. For those of you who don't have cooking facilities at the moment, I'm afraid we won't be able to deliver hot meals to your home like the community centre did last year.<br/>\n            Instead, we'll be <span class=\"highlight\">issuing vouchers that you can use to get food from any of the nominated restaurants<\/span>. Just come to the Council office to collect them. We've had an overwhelming number of people offering to help out.<br/>\n            Anyone who would like to volunteer, please don't call the Council office directly. Instead, if you're available to help clean up, just <span class=\"highlight\">turn up at the community centre by 8am tomorrow<\/span> and you'll be given the necessary tools and assigned a task by the Council Work Supervisor. As the water level goes down, we may discover more problems.<br/>\n            We'll be assessing the drinking water regularly so that there's no risk of contamination. Just be aware that <span class=\"highlight\">local wildlife can be forced out of their natural habitat<\/span> in this weather. Let the Council know of any unusual sightings so we can safely relocate them.<br/>\n            It may seem that mosquitoes are around in abundance right now, but the actual population is usual for this time of year. Now we'll give you some information about key areas in the town.<br/>\n            The school escaped any real problems and we'll be using its car park and some of the classrooms to coordinate the clean up. Because of that, the Principal is asking for <span class=\"highlight\">volunteers to assist in getting the classrooms set back up again with the desks back in their proper places<\/span> before the new term begins after the holidays. The hospital is still fully functional and the only damage there was to the canteen where a tree branch <span class=\"highlight\">broke a window<\/span>.<br/>\n            You can still access the area as normal, we just ask that you park at the rear of the hospital until the repair work has been completed. If you need to get to the shops, the High Street is still a little flooded so I'm afraid <span class=\"highlight\">you'll have to collect your shopping on foot<\/span> for a little while. Hopefully, it won't be long before you'll be able to drive there again.<br/>\n            Before the storm, we had hoped to begin work on modernising the bikeway that runs along the river. We were particularly looking forward to having bike storage facilities installed. While the bikeway itself is okay, unfortunately the area around it is covered in water.<br/>\n            So we've <span class=\"highlight\">postponed our work there indefinitely<\/span> and I'm afraid it's now unlikely that this will ever go ahead. Well, that's everything for now. I'll be back with a further update tomorrow.\n        ", "3": "\n<strong>SECTION 3<\/strong><br/><br/>\n            Questions 21-30<br/><br/>\n            You will hear a student talking to a tutor at her college about the possibility of changing her course.<br/><br/>\n            Ah, hello. Do come in. Thanks.<br/>\n            I understand you wanted to see me about changing courses? Yes, that's right. Well, that's fine. Do sit down.<br/>\n            Oh, thank you. Now, you're Sally Lehman? That's it. Right then, Sally.<br/>\n            And what course are you doing at the present? It's <span class=\"highlight\">Economic History<\/span>. Uh-huh. And when did you start? <span class=\"highlight\">Last September<\/span>.<br/>\n            Right, good. Now, of course, we'll have the chance to talk through any problems you've been having in a moment, but let me just make a note of what courses you might be interested in changing to. Well, there are several that I've thought about, but what I'd like to do most is <span class=\"highlight\">Politics<\/span>.<br/>\n            Well, that is a very popular course. I know, and there might not be places, but… Sure, I'll certainly take a note of that. But what about another option? Well, I had thought of changing course completely and trying business studies, but then I realised it wasn't really me, so I thought of <span class=\"highlight\">Philosophy<\/span>.<br/>\n            Right, well, that's useful to know, but if at all possible, it is good to talk through the problems you are having at the moment and see if there's any way we can help or that you can help yourself. After all, with all the effort that you've put in already, it would be a pity to have to start all over again.<br/>\n            Oh no, I realise that. And actually, I would like to have a go at staying with Economic History. Good.<br/>\n            Yeah, well, let's see. Let's talk through some of the problems you've been having. What would you say was your major difficulty on the course? I think I'd have to say the worst thing is that I find the lectures <span class=\"highlight\">difficult<\/span>.<br/>\n            Aha. And how have you tried to overcome this? Well, I did try recording lectures, you know. Yes, that's a good idea.<br/>\n            And did you find it helped? To a certain extent, but... Well, I would certainly continue with that strategy, but you might also like to try getting together with other fellow students to discuss lectures in what we call a <span class=\"highlight\">discussion group<\/span>. Yeah, I've heard of some of my course mates doing that. I could certainly ask if I could join.<br/>\n            Good. I'm sure you'd find it a help. And any other problems? Well, this really worried me at the beginning.<br/>\n            The fact that there are <span class=\"highlight\">not enough tutorials<\/span>. Not enough tutorials. Did you talk to your tutor about it? Yeah, that was what I thought was the best strategy.<br/>\n            It's what all the student handbooks say. Yeah, and what was the outcome? Well, really, just that she's very busy and I have to fit in tutorials when she's available, which is really difficult. I agree.<br/>\n            It must seem that way. Why don't you try arranging meetings in advance? Well, I can certainly give it a go. Yeah.<br/>\n            But I suppose the thing that's been really upsetting me recently is my bad assignment grade. How many have you had back? Just the one. Well, you could say it was early days yet.<br/>\n            Well, for the last assignment, which we've just handed in, I did more background reading. And did you feel that helped? Oh, yes, I think so. Well, another strategy might be <span class=\"highlight\">visiting student services<\/span>.<br/>\n            They offer a lot of advice on assignment preparation. Well, I didn't want to bother them. That's their job.<br/>\n            It'd be well worth trying. OK, I'll certainly look into that. Now, what I've done here is to keep a record of our discussions and suggested strategies.<br/>\n            And what we normally do is to ask you to try out our suggestions for a while and then come back to discuss the situation, see whether it's improved. And if not, then we can start thinking seriously about those alternative courses. So you'd like me to come back? Yes.<br/>\n            Let's say in a month's time. OK. That'd be on <span class=\"highlight\">17th of February<\/span> at 3.30. Is that all right? Yeah, sure.<br/>\n            And will I meet with you? I'm afraid I'll be on leave at that time. But I'll leave this record on file and you'll be meeting our <span class=\"highlight\">senior advisor<\/span>. Senior advisor.<br/>\n            OK, fine. Lovely. Well, I do hope things improve, Sally, and that the change won't be necessary.<br/>\n            And if it is, well, we can think about that later. OK? OK. Thanks very much.\n        ", "4": "\n<strong>SECTION 4<\/strong><br/><br/>\n            Questions 31-40<br/><br/>\n            You will hear a museum curator giving a presentation about her museum's collection of perfume containers, also known as perfume ornaments.<br/><br/>\n            Good morning and welcome to the Walden Gallery. In today's open lecture, I'm going to be talking about our collection of perfume ornaments, or containers. These beautiful objects now form a significant part of the museum's collection and are very popular with the public. But this has not always been the case.<br/>\n            Up until relatively recently, the large collection of perfume ornaments held in store, donated by Lady Walden at the beginning of the last century, was not considered to be of much interest and was not on show to the general public. Then, as late as 1989, a <span class=\"highlight\">visiting professor from the Victoria and Albert Museum commented that some of the objects were worth a great deal<\/span>, and so the display was created, much as you see it here today. Now before I say anything more about the perfume containers, I thought I'd briefly touch on the background to the development of perfumes themselves.<br/>\n            In the West, perfumery really began as late as the 11th century. <span class=\"highlight\">Bathing and laundering were considered hazardous undertakings<\/span> because even though there were ample supplies of water, it was often dirty or even infected. As a consequence, as you can imagine, the air was heavy with unpleasant smells, which had to be countered or covered up.<br/>\n            In those early days, perfumes were in solid form and mainly made from spices, leaves, and animal fixatives in paste form, for example, musk and ambergris. Wealthy people, the only people who could afford them, carried small globular vessels known as pomanders. I've brought out one ornament from the collection, the oldest one, in fact, from the 14th century, which I'll pass around for you to sample.<br/>\n            These pomanders are solid paste balls made of ambergris impregnated with fragrance. The name was derived from <span class=\"highlight\">the French for apple of ambergris<\/span>. They must have had a powerful aroma in those days because even now you can smell the fragrance.<br/>\n            Now, during the mediaeval period, basically up until the 16th century, perfumes not only made your surroundings smell sweeter, they were believed to have other special properties. Researchers in the 19th century revealed that in mediaeval times, people thought perfumes could help overcome all kinds of bodily ills. But only recently, researchers at our museum have found that they were also believed to <span class=\"highlight\">significantly raise the spirits of the wearer<\/span>.<br/>\n            Turning now to some more technical details, with the advent of liquid perfume from the mid-18th century, craftsmen had to use precision techniques to ensure there was an airtight seal on the container. It is clear that however beautiful these seemingly fragile objects were, they were essentially utilitarian, designed to stop the extremely valuable substances inside them from <span class=\"highlight\">evaporating<\/span>. Let's turn now to have a look at some of the key developments in perfume containers in the last 200 years or so.<br/>\n            From the late 18th century onwards, the vinaigrette came into vogue. The vinaigrette was a miniature box which opened on a hinge, containing a tiny sponge <span class=\"highlight\">soaked with perfume<\/span>. This was placed under a grill through which you could smell the fragrance.<br/>\n            It was widely used to carry the highly corrosive scent known as vinegar water, hence the name. The outer box could be made of any material, but <span class=\"highlight\">the lining was gold<\/span> because the perfume tended to corrode other substances. From the mid-19th century, vinaigrettes were replaced by more conventional bottles.<br/>\n            They were often made of glass, of course, but metal was another common material used, and very occasionally they were made of more unusual materials like horn. By now these beautiful objects were <span class=\"highlight\">more affordable<\/span>. This was the age of the Industrial Revolution in Western Europe, and the bottles were mass-produced and thus available not just to the very wealthy.<br/>\n            In the last quarter of the 19th century, one company above all became associated with the design and production of perfume bottles, the Tiffany Company. They developed a wide range of designs, most notably based on those of the furniture of the period. Their particular achievement was their <span class=\"highlight\">stylish and clever working of crystal<\/span>.<br/>\n            Although these perfume ornaments were very expensive, Tiffany & Co. were able to use catalogues to reach a wider clientele. Many innovative designs were used in perfume ornaments produced in the 1920s and 30s.<br/>\n            The most notable was probably the vanity. This was an ingeniously designed case used not only for holding perfume, but also makeup, in a whole maze of tiny additional compartments. It was made in the first instance of ivory, but later bakelite was used, the resinous plastic which was so popular with all kinds of designers of the period.<br/>\n            Now, I've brought along a selection of the items in the collection which I've set out here. If you'd like to come and gather...\n        "};

function clearCurrentNote(){$('#noteTextarea').value='';saveCurrentNote()}

/* Retry */
function renderRetry(){if(!state.results.length){const o=getStored();state.results=o.lastResults||[];state.attemptStatus=o.attemptStatus||'none'}if(!state.results.length){$('#retryHost').innerHTML='<div class="panel"><b>No attempt data yet.</b><p>Start the Full IELTS Test. If you submit it or leave it early, unanswered and incorrect questions will appear here.</p></div>';return}const wrong=state.results.filter(r=>!r.ok);if(!wrong.length){$('#retryHost').innerHTML='<div class="panel"><b>No weak questions in the latest attempt.</b><p>Your latest attempt was 40/40.</p></div>';return}const status=state.attemptStatus==='exited'?'Latest attempt was exited early. Unanswered and incorrect questions are included.':'Missed and unanswered questions from your latest submitted attempt.';$('#retryHost').innerHTML=`<div class="panel"><b>${wrong.length} question(s) to retry</b><p class="muted">${status}</p>${wrong.map(r=>{const d=DATA.questions[String(r.q)];return `<div class="retry-item"><span><b>Q${r.q}</b> ${escapeHtml(d.prompt)}</span><button class="btn" data-retryq="${r.q}">Retry</button></div>`}).join('')}</div><div id="retryPractice"></div>`;$$('[data-retryq]').forEach(b=>b.onclick=()=>retryQuestion(Number(b.dataset.retryq)))}
function retryQuestion(q){stopActiveClip();const d=DATA.questions[String(q)],opts=d.options||[];let body=`<div class="practice-card"><h2>Q${q}. ${escapeHtml(d.prompt)}</h2><button class="btn" onclick="playWindow(${d.timeStart},${d.timeEnd},this)">▶ Listen</button>`;if(opts.length)body+=`<div class="practice-options">${opts.map(o=>`<button class="practice-option" data-rchoice="${o.code}">${escapeHtml(o.text)}</button>`).join('')}</div>`;else body+=`<div style="margin:12px 0"><input id="retryInput" style="padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn primary" id="retryCheck">Check</button></div>`;body+='<div id="retryFeedback"></div></div>';$('#retryPractice').innerHTML=body;if(opts.length)$$('[data-rchoice]').forEach(b=>b.onclick=()=>showRetryFeedback(q,b.dataset.rchoice));else $('#retryCheck').onclick=()=>showRetryFeedback(q,$('#retryInput').value)}
function showRetryFeedback(q,v){const d=DATA.questions[String(q)],ok=answerOk(q,v);$('#retryFeedback').innerHTML=`<div class="feedback"><b class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</b><br><b>Correct:</b> ${escapeHtml(d.answer)}<br><b>Evidence:</b> ${escapeHtml(d.evidence)}</div>`}
/* Event wiring */
loadStored();buildActivities();renderHub();
$('#startTestBtn').onclick=startExam;$('#volumeSlider').oninput=e=>$('#sharedAudio').volume=Number(e.target.value);$('#flagBtn').onclick=toggleFlag;$('#notesBtn').onclick=openNotes;$('#closeNotesBtn').onclick=closeNotes;$('#doneNotesBtn').onclick=closeNotes;$('#clearNoteBtn').onclick=clearCurrentNote;$('#noteTextarea').oninput=saveCurrentNote;$('#noteModal').addEventListener('click',e=>{if(e.target.id==='noteModal')closeNotes()});$('#fullscreenBtn').onclick=()=>{const p=document.fullscreenElement?document.exitFullscreen():$('#examRoot').requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Fullscreen is not available'))};$('#optionsBtn').onclick=openOptions;$('#submitTest').onclick=()=>submitExam(false);$('#highlightBtn').onclick=highlightSelection;$('#removeHighlightBtn').onclick=removeHighlights;window.addEventListener('pagehide',()=>{stopAllAudio();try{sessionStorage.removeItem(NOTES_KEY)}catch(e){}});
// Support direct activity links in ZIP wrappers/hash
const hash=location.hash.replace('#','');if(ACTIVITIES.some(a=>a[0]===hash))setTimeout(()=>openActivity(hash),50);
</script></body></html>
