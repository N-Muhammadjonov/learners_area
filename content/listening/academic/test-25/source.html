orget a towel. But we do provide soap and shampoo.","timeStart":277,"timeEnd":305,"timeCenter":291.0,"why":"The speaker gives the required answer as \"towel\".","trap":"Keep within the stated IELTS word/number limit and use the form actually heard.","paraphrase":"Remember to bring bedding and a ___. -> towel","mistakeType":"Exact-word recognition / word limit","type":"Completion"},"8":{"q":8,"part":1,"prompt":"A ticket for ___ is provided for all volunteers.","answer":"meals","evidence":"Jack: Yep, that's right. Because our experienced volunteers wait on tables, you can eat in the canteen yourself, or you'll have time to visit the food vendors for meals, you'll be given a ticket, so you don't have to pay.","timeStart":305,"timeEnd":330,"timeCenter":317.5,"why":"The speaker gives the required answer as \"meals\".","trap":"Keep within the stated IELTS word/number limit and use the form actually heard.","paraphrase":"A ticket for ___ is provided for all volunteers. -> meals","mistakeType":"Exact-word recognition / word limit","type":"Completion"},"9":{"q":9,"part":1,"prompt":"Hand in the form with information about your ___ in case there is a problem.","answer":"contact","evidence":"Jack: One more thing, there's a document that needs to be signed by all our volunteers. We need the name of who your contact is in the case of an emergency.","timeStart":330,"timeEnd":356,"timeCenter":343.0,"why":"The speaker gives the required answer as \"contact\".","trap":"Keep within the stated IELTS word/number limit and use the form actually heard.","paraphrase":"Hand in the form with information about your ___ in case there is a problem. -> contact","mistakeType":"Exact-word recognition / word limit","type":"Completion"},"10":{"q":10,"part":1,"prompt":"The First Aid area helps with minor problems and ___ is also provided if needed.","answer":"water","evidence":"Jack: If you run into any minor health problems over the weekend, there's a first aid area open 24 hours. They'll help if they can. They'll have a lot of water on hand because it's going to be so hot.","timeStart":356,"timeEnd":386,"timeCenter":371.0,"why":"The speaker gives the required answer as \"water\".","trap":"Keep within the stated IELTS word/number limit and use the form actually heard.","paraphrase":"The First Aid area helps with minor problems and ___ is also provided if needed. -> water","mistakeType":"Exact-word recognition / word limit","type":"Completion"},"11":{"q":11,"part":2,"prompt":"How does Bay Life differ from other similar companies?","answer":"A","evidence":"In terms of popularity, Bay Life is the number one boat tour company in the area. Bay Life trips are different than other trips organized to observe marine life. There are other companies which run more boats. We just run two, but ours are the only ones which are accompanied by marine biologists who have the knowledge to run quality trips.","timeStart":505,"timeEnd":535,"timeCenter":520.0,"why":"The transcript evidence supports option A: It has scientists on board.","trap":"Compare the meaning of all options with the speaker's exact statement; nearby details are distractors.","paraphrase":"How does Bay Life differ from other similar companies? -> It has scientists on board.","mistakeType":"Distractor discrimination","type":"MCQ","options":[{"code":"A","text":"It has scientists on board."},{"code":"B","text":"It was established only recently."},{"code":"C","text":"It owns a large number of boats."}]},"12":{"q":12,"part":2,"prompt":"How does Bay Life maximise opportunities for observing marine life?","answer":"B","evidence":"We want to give you as much opportunity for viewing marine life as possible, so all our trips are at least three hours in length, while some even last up to five hours. However, we do not guarantee that you will see all the species that frequent the bay in just one trip. We explore only limited parts of the bay, and we are careful not to disturb the animals by tracking them too aggressively. :["F"],"19":["A"],"20":["E"],"21":["C"],"22":["A"],"23":["B"],"24":["A"],"25":["B"],"26":["B"],"27":["D"],"28":["A"],"29":["B"],"30":["E"],"31":["plastic"],"32":["processing"],"33":["seasoned"],"34":["polished"],"35":["cost","the cost"],"36":["grain patterns"],"37":["words"],"38":["0.8",".8","nought point eight","point eight"],"39":["0.1",".1","nought point one","point one"],"40":["black velvet"]},"part_audio_boundaries":{"1":{"start":92.272,"end":386.369},"2":{"start":498.1,"end":793.025},"3":{"start":886.613,"end":1235.879},"4":{"start":1329.645,"end":1524.01}},"audio_available":true,"audio_status":"Source audio re-encoded once to approximately 80 kbps MP3 for offline delivery; no up-transcoding.","audio_duration_seconds":1559.458,"transcript":{"1":"SECTION 1 — Volunteering at Mountain Festival\nJack: Good afternoon, Mountain Festival.\nAngie: Hi, my name is Angie, and I'm helping out this weekend at the festival. May I speak with the team leader?\nJack: That's me. I'm Jack.\nAngie: Jack, I'm looking for some general information. It's my first time volunteering at the festival, and I'm not sure what to expect.\nJack: No need to be worried. We've been doing this for over 30 years.\nAngie: So the festival doesn't start until Friday afternoon. I was thinking I'd come in the morning. Is that okay?\nJack: Oh yeah, we definitely need you then. Didn't the volunteer letter tell you that?\nAngie: Oh, I forgot. Okay, and are there any specific things I need to bring for the weekend?\nJack: Well, let's see. It's going to be hot. We suggest you bring a hat for sure because the open area doesn't have much shade. I remember last year everyone needed their umbrellas, but I don't think we'll have any rain this time.\nAngie: Okay. Anything else?\nJack: There are lots of craft vendors and food booths too. You may want to have some cash handy because most of them don't take credit cards.\nAngie: Thanks for the tip. By the way, what are the parking arrangements for volunteers? I don't have a car. I'll be riding my bike to the festival. Is there a special place to leave it?\nJack: Sure, we do. There's parking for volunteers at the south end of the site, and there's no need to worry about security. It'll be very safe there.\nAngie: Sounds like a lot of people get there that way.\nJack: They do, but if you don't want to get there that way, we have a bus that picks people up at certain points in the city. There's no charge for that.\nAngie: Sounds like the organizers have thought of everything.\nJack: I hope so. But remember to go to Gate A when you get here. They'll give you a pass that you must carry at all times. This lets everyone know that you're a volunteer.\nJack: So, Angie, are you helping out all weekend?\nAngie: Yes, I am.\nJack: So, are you going to sleep here? We have accommodation here for volunteers because the local hotels are all booked up early. We set up tents. They fit eight to 10 people.\nAngie: That sounds great.\nJack: You just have to bring your own bedding. Oh yes, we've really good facilities for a hot shower, so don't forget a towel. But we do provide soap and shampoo.\nAngie: Okay, and now about my duties. My confirmation letter says I'm helping in the canteen with some other volunteers who don't have much experience. Does that mean I'm washing dishes all weekend?\nJack: Yep, that's right. Because our experienced volunteers wait on tables, you can eat in the canteen yourself, or you'll have time to visit the food vendors for meals, you'll be given a ticket, so you don't have to pay.\nAngie: Wow, lots to remember!\nJack: One more thing, there's a document that needs to be signed by all our volunteers. We need the name of who your contact is in the case of an emergency.\nAngie: Okay, I'll do that.\nJack: If you run into any minor health problems over the weekend, there's a first aid area open 24 hours. They'll help if they can. They'll have a lot of water on hand because it's going to be so hot.\nAngie: Right. Thanks for all your help.","2":"SECTION 2 — Bay Life Sea Trips\nIn terms of popularity, Bay Life is the number one boat tour company in the area. Bay Life trips are different than other trips organized to observe marine life. There are other companies which run more boats. We just run two, but ours are the only ones which are accompanied by marine biologists who have the knowledge to run quality trips.\nWe want to give you as much opportunity for viewing marine life as possible, so all our trips are at least three hours in length, while some even last up to five hours. However, we do not guarantee that you will see all the species that frequent the bay in just one trip. We explore only limited parts of the bay, and we are careful not to disturb the animals by tracking them too aggressively.\nBay Life special dolphin trips are extremely popular. Unlike whales, which pass through the bay only at certain times of the year, dolphins are sighted year-round. Six species are regularly visible, sometimes in schools numbering over 1000 individuals, and due to the varying sea depths, we can find deep water species of dolphin too.\nTo cancel a trip, you need to call us at least 24 hours beforehand if you want to avoid the full charge. Bay Life may cancel a trip at any time, either due to adverse weather conditions or insufficient passenger numbers. Trips will depart if it rains, but not if there's a strong wind. In the event that one of our regular crew is sick, we have a reserve list, so we can always rely on a full complement of staff.\nWe can organize private group tours for conferences, corporate events, company rewards, or school and youth groups. These tours can be customized to meet your group's needs, and rates are negotiable. Passengers of all ages are welcome on trips.\nDuring the month of May, a local weekly newspaper, the Baytown Gazette, is holding a competition to win a free boat trip for four people. The competition will be announced in the paper on the second of May, so if you're interested in taking part, get a copy of the newspaper and go over the terms and conditions of entry.\nIf, after reading these, you think you're eligible to take part, you need to cut out the application form, which will appear in the same issue, and complete it. The next thing you need to do is find a picture of wildlife. This can be either a plant or animal or insect that you particularly like.\nMake up a suitable heading for the picture and write it on the back. Then, on a separate piece of paper, explain in a few sentences why you find this particular picture interesting. Your account should be just one paragraph, not more than 150 words in total.\nFinally, staple or clip your papers firmly together, put them in an envelope and send in your entry to the address given in the newspaper. The closing date for receipt of entries is the 31st of May. Good luck.","3":"SECTION 3 — Dissertation on learners' vocabulary notebooks\nJeff: Well, at the school where I'm teaching part time, I know my pupils always find learning new words quite a challenge.\nMarta: So, the participants, the pupils whose vocabulary books you looked at, were all of them your students?\nJeff: A lot of the participants were, but I wanted to focus on intermediate level, and I didn't have enough students at that level, so I had to borrow a group from another school where a friend teaches.\nMarta: Made life easier.\nJeff: Yes. Well, I did have some problems. Getting the kids to take part wasn't as hard as I thought, and I managed to make a connection between what I found in the notebooks and what theorists were saying. But I looked at over 100 notebooks. I think I underestimated the quantity of stuff to go through, especially as I was teaching at the same time.\nMarta: I know you looked into the reasons that pupils chose to note down a particular word. Didn't they just write a word if their teacher told them to?\nJeff: That's exactly what I'd anticipated. But according to several of the kids I interviewed, it was more often either they thought, \"that word looks familiar, but I don't really know it,\" or even more common was that they were encountering a word for the very first time.\nMarta: Do you think the students made wise choices?\nJeff: They obviously considered them to be, but I found that they often chose words that are so rare and complicated that they would really struggle to use them, given their level.\nMarta: Right, I was reading an article about this by James Morgan.\nJeff: He did a similar study with university students in Japan. But I did wonder about his methods.\nMarta: Yeah, just basing everything on quantitative research rather than sitting down with any participants and hearing what they had to say.\nJeff: Morgan's point was that learners need training about recording vocabulary. They think of the vocabulary as just being a word like \"event,\" so they write that on its own, not in a phrase.\nMarta: Lots of nouns, you mean?\nJeff: No, I mean why do they just write that and not, for example, major event or organize an event? Much more useful.\nMarta: Let's start with the introduction. I reckon you've devoted more space than you needed to it.\nJeff: You're probably right. What about the methodology?\nMarta: Well, I think you could have brought in more things you'd read, like comparing Morgan's methodology to your own. You could mention some other writers too.\nJeff: Okay, I'll do that.\nMarta: Then the discussion. There's no shortage of references, but I thought maybe you showed a tendency to take things at face value without really scrutinizing and questioning other people's findings.\nJeff: Right, and comparing their ideas with my own. I'll do something about it.\nMarta: And the conclusion, you cover quite a lot of topics, but it might be clearer if they were dealt with separately. You know, order them like 5.1, 5.2, and so on.\nJeff: Fair enough. Well, that's a great help, Marta.","4":"SECTION 4 — Construction Materials\nToday I'm going to be talking about construction materials, where they come from and what their properties are.\nFirst of all, what are the sources of the materials we use in construction? Many of them are manufactured. Plastic is one example. Others are natural, but even naturally occurring materials usually require processing before they can be used.\nWood, for instance, is rarely used directly from trees. Instead, this natural material is first cut into required lengths, and then seasoned to remove the excess moisture. The result is what we call timber, and then timber itself is often treated with preservatives before use.\nIn a similar way, stone needs to be cut to shape and may also be polished before being used for building. Of course, the more processing that's required, the more expensive the material becomes.\nWhat about selection? When we're deciding which kind of material to use, cost is not the only consideration. It's important to consider the effect on the environment too. Large amounts of energy are used — it takes huge amounts of energy to produce aluminium, and materials like timber need a lot of energy to transport because of their weight.\nLet's move on to material properties, and let's first consider appearance. Even for any single building material, appearance may vary greatly. Brick and stone come in a very wide range of colours and can be smooth or very rough, and timber is especially interesting because the grain patterns on each piece, even from the same tree, are unique.\nBut properties have to be described very accurately, and that usually involves the use of mathematical formulae. It isn't enough to say that a particular material is rough or strong or heavy. Words are subjective, and they can be ambiguous.\nReflectance is a good example of this. Precise values for a range of building materials are available. Reflectance is a measure of the ability of a surface to reflect light, and a perfect reflector has a reflectance of one. A polished mirror-like silver surface has a reflectance of very nearly one. A plaster surface painted brilliant white has a reflectance of around 0.8. Quarry tiles have a reflectance of about 0.1. And black velvet has a reflectance of nearly zero."},"transcript_source":"Exact source-provided spoken-content transcripts for Parts 1-4. Source answer markers were removed; wording was otherwise preserved.","timestamps_source":"Part and question evidence windows were derived from the supplied recording structure and long-silence boundaries; they are evidence windows, not word-level forced alignment.","script_completion":[{"q":101,"part":1,"n":1,"match":"not sure what to expect","answer":"not sure what to expect","lexical_type":"lexical chunk"},{"q":102,"part":1,"n":2,"match":"doesn't have much shade","answer":"doesn't have much shade","lexical_type":"verb phrase"},{"q":103,"part":1,"n":3,"match":"cash handy","answer":"cash handy","lexical_type":"collocation"},{"q":104,"part":1,"n":4,"match":"no need to worry about security","answer":"no need to worry about security","lexical_type":"lexical chunk"},{"q":105,"part":1,"n":5,"match":"picks people up at certain points in the city","answer":"picks people up at certain points in the city","lexical_type":"phrasal-verb chunk"},{"q":106,"part":1,"n":6,"match":"a pass that you must carry at all times","answer":"a pass that you must carry at all times","lexical_type":"noun phrase"},{"q":107,"part":1,"n":7,"match":"bring your own bedding","answer":"bring your own bedding","lexical_type":"verb phrase"},{"q":108,"part":1,"n":8,"match":"in the case of an emergency","answer":"in the case of an emergency","lexical_type":"prepositional phrase"},{"q":109,"part":2,"n":1,"match":"accompanied by marine biologists","answer":"accompanied by marine biologists","lexical_type":"passive verb phrase"},{"q":110,"part":2,"n":2,"match":"varying sea depths","answer":"varying sea depths","lexical_type":"noun phrase"},{"q":111,"part":2,"n":3,"match":"adverse weather conditions","an const PARTS={"1":"<div class=\"task-card\"><h2>PART 1</h2>\n<div class=\"question-prompt instructions-block\">\n<p><strong>Questions 1-10</strong></p>\n<p>Complete the notes below.</p>\n<p>Write <strong>ONE WORD ONLY</strong> for each answer.</p>\n</div>\n<div style=\"margin-top:20px;\"><div class=\"framed-notes\">\n<h3>Volunteering at Mountain Festival</h3>\n<p class=\"group-head\">Festival information</p>\n<ul>\n<li>Volunteers should arrive on Friday <span class=\"q-block inline-question\" data-q=\"1\" id=\"qblock1\"><strong>1</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q1\" type=\"text\"/></span>.</li>\n<li>A <span class=\"q-block inline-question\" data-q=\"2\" id=\"qblock2\"><strong>2</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q2\" type=\"text\"/></span> is recommended for outdoors.</li>\n<li>Bring <span class=\"q-block inline-question\" data-q=\"3\" id=\"qblock3\"><strong>3</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q3\" type=\"text\"/></span> for purchases.</li>\n<li>The bicycle parking area has good <span class=\"q-block inline-question\" data-q=\"4\" id=\"qblock4\"><strong>4</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q4\" type=\"text\"/></span>.</li>\n<li>A free <span class=\"q-block inline-question\" data-q=\"5\" id=\"qblock5\"><strong>5</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q5\" type=\"text\"/></span> will operate during the festival.</li>\n<li>Volunteers should collect a <span class=\"q-block inline-question\" data-q=\"6\" id=\"qblock6\"><strong>6</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q6\" type=\"text\"/></span> at the entrance.</li>\n</ul>\n<p class=\"group-head\">Accommodation</p>\n<ul>\n<li>Volunteers can be accommodated in tents.</li>\n<li>Remember to bring bedding and a <span class=\"q-block inline-question\" data-q=\"7\" id=\"qblock7\"><strong>7</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q7\" type=\"text\"/></span>.</li>\n</ul>\n<p class=\"group-head\">Volunteer information</p>\n<ul>\n<li>In the canteen, less experienced volunteers will be washing dishes.</li>\n<li>A ticket for <span class=\"q-block inline-question\" data-q=\"8\" id=\"qblock8\"><strong>8</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q8\" type=\"text\"/></span> is provided for all volunteers.</li>\n<li>Hand in the form with information about your <span class=\"q-block inline-question\" data-q=\"9\" id=\"qblock9\"><strong>9</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q9\" type=\"text\"/></span> in case there is a problem.</li>\n<li>The First Aid area helps with minor problems and <span class=\"q-block inline-question\" data-q=\"10\" id=\"qblock10\"><strong>10</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q10\" type=\"text\"/></span> is also provided if needed.</li>\n</ul>\n</div></div></div>","2":"<div class=\"task-card\"><h2>PART 2</h2><div class=\"question-prompt instructions-block\">\n<p><strong>Questions 11-15</strong></p>\n<p>Choose the correct letter, <strong>A</strong>, <strong>B</strong> or <strong>C</strong>.</p>\n</div>\n<h3 class=\"centered-title\">Bay Life Sea Trips</h3><div class=\"mcq-item q-block\" data-q=\"11\" style=\"margin-bottom:20px;\">\n<p><strong>11.</strong> How does Bay Life differ from other similar companies?</p>\n<div class=\"options\" style=\"margin-left:20px;\">\n<label class=\"multi-choice-option\"><strong>A)</strong> <input name=\"q11\" type=\"radio\" value=\"A\"/> It has scientists on board.</label><label class=\"multi-choice-option\"><strong>B)</strong> <input name=\"q11\" type=\"radio\" value=\"B\"/> It was established only recently.</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q11\" type=\"radio\" value=\"C\"/> It owns a large number of boats.</label>\n</div></div><div class=\"mcq-item q-block\" data-q=\"12\" style=\"margin-bottom:20px;\">\n<p><strong>12.</strong> How does Bay Life maximise opportunities for observing marine life?</p>\n<div class=\"options\" style=\"margin-left:20px;\">\n<label class=\"multi-choice-option\"><strong>A)</strong> <input name=\"q12\" type=\"radio\" value=\"A\"/> It searches in a very wide area.</label><label class=\"multi-choice-option\"><strong>B)</strong> <input name=\"q12\" type=\"radio\" value=\"B\"/> It allows plenty of time for its trips.</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q12\" type=\"radio\" value=\"C\"/> It follows the creatures closely.</label>\n</div></div><div class=\"mcq-item q-block\" data-q=\"13\" style=\"margin-bottom:20px;\">\n<p><strong>13.</strong> What does the speaker say about observing dolphins on Bay Life trips?</p>\n<div class=\"options\" style=\"margin-left:20px;\">\n<label class=\"multi-choice-option\"><strong>A)</strong> <input name=\"q13\" type=\"radio\" value=\"A\"/> They can only be seen in certain seasons.</label><label class=\"multi-choice-option\"><strong>B)</strong> <input name=\"q13\" type=\"radio\" value=\"B\"/> Only shallow-water species can be seen.</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q13\" type=\"radio\" value=\"C\"/> They can occasionally be seen in very large groups.</label>\n</div></div><div class=\"mcq-item q-block\" data-q=\"14\" style=\"margin-bottom:20px;\">\n<p><strong>14.</strong> Under what circumstances might Bay Life cancel a boat trip?</p>\n<div class=\"options\" style=\"margin-left:20px;\">\n<label class=\"multi-choice-option\"><strong>A)</strong> <input name=\"q14\" type=\"radio\" value=\"A\"/> if it rains</label><label class=\"multi-choice-option\"><strong>B)</strong> <input name=\"q14\" type=\"radio\" value=\"B\"/> if there are too few bookings</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q14\" type=\"radio\" value=\"C\"/> if a crew member is sick</la " value=\"B\"/> They had never seen it before.</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q23\" type=\"radio\" value=\"C\"/> They recognised it, but couldn't use it.</label>\n</div></div><div class=\"mcq-item q-block\" data-q=\"24\" style=\"margin-bottom:20px;\">\n<p><strong>24.</strong> Jeff feels that the students need to make better choices when</p>\n<div class=\"options\" style=\"margin-left:20px;\">\n<label class=\"multi-choice-option\"><strong>A)</strong> <input name=\"q24\" type=\"radio\" value=\"A\"/> assessing the usefulness of new words.</label><label class=\"multi-choice-option\"><strong>B)</strong> <input name=\"q24\" type=\"radio\" value=\"B\"/> identifying examples of new words in texts.</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q24\" type=\"radio\" value=\"C\"/> writing definitions of new words.</label>\n</div></div><div class=\"mcq-item q-block\" data-q=\"25\" style=\"margin-bottom:20px;\">\n<p><strong>25.</strong> What is the main difference between Jeff's research and James Morgan's?</p>\n<div class=\"options\" style=\"margin-left:20px;\">\n<label class=\"multi-choice-option\"><strong>A)</strong> <input name=\"q25\" type=\"radio\" value=\"A\"/> Morgan avoided statistics.</label><label class=\"multi-choice-option\"><strong>B)</strong> <input name=\"q25\" type=\"radio\" value=\"B\"/> Morgan did not interview his participants.</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q25\" type=\"radio\" value=\"C\"/> Morgan reached very different conclusions.</label>\n</div></div><div class=\"mcq-item q-block\" data-q=\"26\" style=\"margin-bottom:20px;\">\n<p><strong>26.</strong> Jeff agrees with James Morgan's view that learners should record more</p>\n<div class=\"options\" style=\"margin-left:20px;\">\n<label class=\"multi-choice-option\"><strong>A)</strong> <input name=\"q26\" type=\"radio\" value=\"A\"/> nouns.</label><label class=\"multi-choice-option\"><strong>B)</strong> <input name=\"q26\" type=\"radio\" value=\"B\"/> phrases.</label><label class=\"multi-choice-option\"><strong>C)</strong> <input name=\"q26\" type=\"radio\" value=\"C\"/> translations.</label>\n</div></div></div><div class=\"task-card\"><div class=\"question-prompt instructions-block\">\n<p><strong>Questions 27-30</strong></p>\n<p>What action will Jeff take next with each of the following parts of his dissertation?</p>\n<p><em>Choose FOUR answers from the box and write the correct letter, A-F, next to questions 27-30.</em></p>\n</div>\n<div class=\"ldm-wrap\" data-ldm-group=\"dissertation\"><div class=\"ldm-left\"><div class=\"ldm-row question-row\" data-q=\"27\"><div class=\"ldm-qtext\"><strong class=\"qbadge\">27</strong> Introduction</div><div class=\"ldm-slot\" data-group=\"dissertation\" data-placeholder=\"Drop A–F here\" data-question=\"27\">Drop A–F here</div></div><div class=\"ldm-row question-row\" data-q=\"28\"><div class=\"ldm-qtext\"><strong class=\"qbadge\">28</strong> Methodology</div><div class=\"ldm-slot\" data-group=\"dissertation\" data-placeholder=\"Drop A–F here\" data-question=\"28\">Drop A–F here</div></div><div class=\"ldm-row question-row\" data-q=\"29\"><div class=\"ldm-qtext\"><strong class=\"qbadge\">29</strong> Discussion</div><div class=\"ldm-slot\" data-group=\"dissertation\" data-placeholder=\"Drop A–F here\" data-question=\"29\">Drop A–F here</div></div><div class=\"ldm-row question-row\" data-q=\"30\"><div class=\"ldm-qtext\"><strong class=\"qbadge\">30</strong> Conclusion</div><div class=\"ldm-slot\" data-group=\"dissertation\" data-placeholder=\"Drop A–F here\" data-question=\"30\">Drop A–F here</div></div></div><div class=\"ldm-right\"><div class=\"option-bank-title\">Actions A–F</div><div class=\"ldm-option\" data-code=\"A\" data-group=\"dissertation\" data-label=\"A) add information from other sources\" draggable=\"true\"><span class=\"ldm-code\">A</span><span class=\"ldm-text\">add information from other sour function renderCompletion(){const q=COMPLETION_Q[completionIndex%COMPLETION_Q.length],d=DATA.questions[String(q)];$('#completionHost').innerHTML=`<div class="practice-card"><div class="muted">Completion ${completionIndex+1}/${COMPLETION_Q.length}</div><h2>Q${q}. ${escapeHtml(d.prompt)}</h2><p><b>1. Predict:</b> This gap needs ${expectedType(q)}.</p><p><b>2. Word limit:</b> ${completionLimit(q)}.</p><button class="btn" onclick="playWindow(${d.timeStart},${d.timeEnd},this)">▶ Evidence audio ${fmt(d.timeStart)}-${fmt(d.timeEnd)}</button><div style="margin:12px 0"><input id="completionAnswer" style="width:min(420px,100%);padding:10px;border:1px solid #cfd4dd;border-radius:8px" placeholder="Type your answer"><button class="btn primary" id="completionCheck">Check</button></div><div id="completionFeedback"></div><div style="display:flex;justify-content:space-between"><button class="btn" id="compPrev">← Previous</button><button class="btn" id="compNext">Next →</button></div></div>`;$('#completionCheck').onclick=()=>{const v=$('#completionAnswer').value,ok=answerOk(q,v);$('#completionFeedback').innerHTML=`<div class="feedback"><b class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</b><br><b>Correct:</b> ${escapeHtml(d.answer)}<br><b>Evidence:</b> ${escapeHtml(d.evidence)}<br><b>Why:</b> ${escapeHtml(d.why)}</div>`};$('#compPrev').onclick=()=>{completionIndex=(completionIndex-1+COMPLETION_Q.length)%COMPLETION_Q.length;renderCompletion()};$('#compNext').onclick=()=>{completionIndex=(completionIndex+1)%COMPLETION_Q.length;renderCompletion()}}
/* Vocabulary */
function renderVocab(){renderVocabStudy();$('#vStudyBtn').onclick=()=>{$('#vStudyBtn').classList.add('active');$('#vPracticeBtn').classList.remove('active');renderVocabStudy()};$('#vPracticeBtn').onclick=()=>{$('#vPracticeBtn').classList.add('active');$('#vStudyBtn').classList.remove('active');renderVocabPractice()}}
function renderVocabStudy(){const saved=new Set((getStored().vocab||[]));$('#vocabHost').innerHTML=`<div class="vocab-grid">${DATA.vocabulary.map(v=>`<article class="vocab-card"><div class="vocab-word">${escapeHtml(v.headword)}</div><div class="vocab-meta">${escapeHtml(v.type)}</div><p>${escapeHtml(v.definition)}</p><p><b>UZ:</b> ${escapeHtml(v.uzbek)}</p><div class="vocab-context"><b>Listening context:</b> ${escapeHtml(v.context)}</div><p><b>Collocations:</b> ${v.collocations.map(escapeHtml).join(', ')}</p><p><b>Paraphrases:</b> ${v.paraphrases.map(escapeHtml).join(', ')}</p><button class="btn" onclick="pronounce('${v.headword.replaceAll("'","\\'")}')">🔊 Pronounce</button> <button class="btn" onclick="saveWord('${v.headword.replaceAll("'","\\'")}')">${saved.has(v.headword)?'Saved':'＋ Vocabulary'}</button></article>`).join('')}</div>`}
function pronounce(w){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-GB';speechSynthesis.speak(u)}}
function saveWord(w){const o=getStored();o.vocab=o.vocab||[];if(!o.vocab.includes(w))o.vocab.push(w);try{localStorage.setItem(STORAGE_KEY,JSON.stringify(o))}catch(e){}toast('Saved to Vocabulary');renderVocabStudy()}
function renderVocabPractice(){let score=0,idx=0;const items=[...DATA.vocabulary].sort(()=>.5-Math.random()).slice(0,10);function one(){if(idx>=items.length){$('#vocabHost').innerHTML=`<div class="panel"><h2>Vocabulary Practice</h2><p>Score: <b>${score}/${items.length}</b></p><button class="btn primary" id="againV">Practice again</button></div>`;$('#againV').onclick=renderVocabPractice;return}const v=items[idx],wrong=DATA.vocabulary.filter(x=>x.headword!==v.headword).sort(()=>.5-Math.random()).slice(0,3),opts=[v,...wrong].sort(()=>.5-Math.random());$('#vocabHost').innerHTML=`<div class="practice-card"><div class="muted">${idx+1}/${items.length}</div><h2>${escapeHtml(v.definition)}</h2><p>Which word matches this definition?</p><div class="practice-options">${opts.map(o=>`<button class="practice-option" data-vopt="${escapeHtml(o.headword)}">${escapeHtml(o.headword)}</button>`).join('')}</div></div>`;$$('[data-vopt]').forEach(b=>b.onclick=()=>{if(b.dataset.vopt===v.headword)score++;idx++;one()})}one()}
function getNotes(){try{return JSON.parse(sessionStorage.getItem(NOTES_KEY)||'{}')}catch{return {}}}
function setNotes(notes){try{sessionStorage.setItem(NOTES_KEY,JSON.stringify(notes))}catch(e){}}
function syncNotePanel(){const notes=getNotes(),q=String(state.currentQ);$('#noteQuestionLabel').textContent=`Question ${q}`;$('#noteTextarea').value=notes[q]||'';$('#noteSaved').textContent=notes[q]?'Saved for this session':''}
function openNotes(){syncNotePanel();$('#noteModal').classList.remove('hidden');setTimeout(()=>$('#noteTextarea').focus(),20)}
function saveCurrentNote(){const notes=getNotes(),q=String(state.currentQ),v=$('#noteTextarea').value.trim();if(v)notes[q]=v;else delete notes[q];setNotes(notes);$('#noteSaved').textContent=v?'Saved for this session':'Note cleared';updateNav()}
function closeNotes(){const m=$('#noteModal');if(!m||m.classList.contains('hidden'))return;saveCurrentNote();m.classList.add('hidden')}
function clearCurrentNote(){$('#noteTextarea').value='';saveCurrentNote()}

/* Retry */
function renderRetry(){if(!state.results.length){const o=getStored();state.results=o.lastResults||[];state.attemptStatus=o.attemptStatus||'none'}if(!state.results.length){$('#retryHost').innerHTML='<div class="panel"><b>No attempt data yet.</b><p>Start the Full IELTS Test. If you submit it or leave it early, unanswered and incorrect questions will appear here.</p></div>';return}const wrong=state.results.filter(r=>!r.ok);if(!wrong.length){$('#retryHost').innerHTML='<div class="panel"><b>No weak questions in the latest attempt.</b><p>Your latest attempt was 40/40.</p></div>';return}const status=state.attemptStatus==='exited'?'Latest attempt was exited early. Unanswered and incorrect questions are included.':'Missed and unanswered questions from your latest submitted attempt.';$('#retryHost').innerHTML=`<div class="panel"><b>${wrong.length} question(s) to retry</b><p class="muted">${status}</p>${wrong.map(r=>{const d=DATA.questions[String(r.q)];return `<div class="retry-item"><span><b>Q${r.q}</b> ${escapeHtml(d.prompt)}</span><button class="btn" data-retryq="${r.q}">Retry</button></div>`}).join('')}</div><div id="retryPractice"></div>`;$$('[data-retryq]').forEach(b=>b.onclick=()=>retryQuestion(Number(b.dataset.retryq)))}
function retryQuestion(q){stopActiveClip();const d=DATA.questions[String(q)],opts=d.options||[],mapBlock=(q>=15&&q<=20)?raceMapHtml():'';let body=`<div class="practice-card"><h2>Q${q}. ${escapeHtml(d.prompt)}</h2>${mapBlock}<button class="btn" onclick="playWindow(${d.timeStart},${d.timeEnd},this)">▶ Listen ${fmt(d.timeStart)}-${fmt(d.timeEnd)}</button>`;if(opts.length)body+=`<div class="practice-options">${opts.map(o=>`<button class="practice-option" data-rchoice="${o.code}">${escapeHtml(o.text)}</button>`).join('')}</div>`;else body+=`<div style="margin:12px 0"><input id="retryInput" style="padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn primary" id="retryCheck">Check</button></div>`;body+='<div id="retryFeedback"></div></div>';$('#retryPractice').innerHTML=body;if(opts.length)$$('[data-rchoice]').forEach(b=>b.onclick=()=>showRetryFeedback(q,b.dataset.rchoice));else $('#retryCheck').onclick=()=>showRetryFeedback(q,$('#retryInput').value)}
function showRetryFeedback(q,v){const d=DATA.questions[String(q)],ok=answerOk(q,v);$('#retryFeedback').innerHTML=`<div class="feedback"><b class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</b><br><b>Correct:</b> ${escapeHtml(d.answer)}<br><b>Evidence:</b> ${escapeHtml(d.evidence)}<br><b>Why:</b> ${escapeHtml(d.why)}<br><b>Trap:</b> ${escapeHtml(d.trap)}</div>`}
/* Event wiring */
loadStored();buildActivities();renderHub();
$('#startTestBtn').onclick=startExam;$('#volumeSlider').oninput=e=>$('#sharedAudio').volume=Number(e.target.value);$('#flagBtn').onclick=toggleFlag;$('#notesBtn').onclick=openNotes;$('#closeNotesBtn').onclick=closeNotes;$('#doneNotesBtn').onclick=closeNotes;$('#clearNoteBtn').onclick=clearCurrentNote;$('#noteTextarea').oninput=saveCurrentNote;$('#noteModal').addEventListener('click',e=>{if(e.target.id==='noteModal')closeNotes()});$('#fullscreenBtn').onclick=()=>{const p=document.fullscreenElement?document.exitFullscreen():$('#examRoot').requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Fullscreen is not available'))};$('#optionsBtn').onclick=openOptions;$('#submitTest').onclick=()=>submitExam(false);$('#highlightBtn').onclick=highlightSelection;$('#removeHighlightBtn').onclick=removeHighlights;window.addEventListener('pagehide',()=>{stopAllAudio();try{sessionStorage.removeItem(NOTES_KEY)}catch(e){}});
// Support direct activity links in ZIP wrappers/hash
const hash=location.hash.replace('#','');if(ACTIVITIES.some(a=>a[0]===hash))setTimeout(()=>openActivity(hash),50);
</script></body></html>
