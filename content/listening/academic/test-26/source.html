":"General","7":"museum","8":"1 hour","9":"5:30","10":"zoom","11":"B","12":"A","13":"C","14":"B","15":"A","16":"G","17":"A","18":"I","19":"E","20":"C","21":"C","22":"A","23":"B","24":"A","25":"C","26":"A","27":"B","28":"D","29":"A","30":"C","31":"typing","32":"desks","33":"screens","34":"share","35":"privacy","36":"security","37":"health","38":"energy","39":"training","40":"noise"},"alternatives":{"1":["month"],"2":["orange"],"3":["east"],"4":["trousers","trouser"],"5":["state"],"6":["General","general"],"7":["museum"],"8":["1 hour","one hour","1 hr","one hr"],"9":["5:30","5.30","5 30","05:30","05.30"],"10":["zoom"],"11":["B"],"12":["A"],"13":["C"],"14":["B"],"15":["A"],"16":["G"],"17":["A"],"18":["I"],"19":["E"],"20":["C"],"21":["C"],"22":["A"],"23":["B"],"24":["A"],"25":["C"],"26":["A"],"27":["B"],"28":["D"],"29":["A"],"30":["C"],"31":["typing"],"32":["desks","desk"],"33":["screens","screen"],"34":["share"],"35":["privacy"],"36":["security"],"37":["health"],"38":["energy"],"39":["training"],"40":["noise"]},"part_audio_boundaries":{"1":{"start":0.0,"end":434.532},"2":{"start":434.532,"end":897.85},"3":{"start":897.85,"end":1304.828},"4":{"start":1304.828,"end":1740.278}},"audio_available":true,"audio_status":"Source audio downsampled once from 128 kbps to approximately 80 kbps MP3 for offline delivery; long post-test transfer silence removed.","audio_duration_seconds":1740.278,"transcript":{"1":"PART 1 - Poppy Reserve in Sandcastle\n\nNARRATOR: You will hear a number of different recordings, and you will have to answer questions on what you hear. There will be time for you to read the instructions and questions, and you will have a chance to check your work. All the recordings will be played once only. The test is in four parts. Write all your answers in the Listening question booklet. At the end of the test, you will be given ten minutes to transfer your answers to an answer sheet. Now turn to Part 1. You will hear a telephone conversation between a woman and a park ranger. First you have some time to look at questions 1 to 5.\n\nNARRATOR: Now listen carefully and answer questions 1 to 5.\n\nPARK RANGER: Almond Valley Poppy Reserve, may I help you?\nWOMAN: Is the nature reserve open now?\nPARK RANGER: Yes. We are actually open all year, although this is the best time of year to see the wildflowers.\nWOMAN: Are the poppies blooming yet?\nPARK RANGER: Absolutely. They started to bloom last week and are already beautiful, but they should peak and be in full bloom at the end of the month.\nWOMAN: Oh, I was planning on coming at the end of this week. Is that too early?\nPARK RANGER: No, not at all. The hills are already covered with orange poppies.\nWOMAN: I thought poppies were red.\nPARK RANGER: Not in California. I've never seen a red poppy here.\nWOMAN: The Poppy Reserve is in Ocean County, right?\nPARK RANGER: Right. From Lakeside, you'll need to drive about an hour east.\nWOMAN: What time does the reserve open?\nPARK RANGER: The reserve is open from sunrise to sunset. It's best to come early in the morning to beat the crowds, but for the best photography, you might want to consider a mid-afternoon visit on a weekday.\nWOMAN: I heard that there are a lot of rattlesnakes in the desert. Is it dangerous to walk about?\nPARK RANGER: Most wildlife is quite safe. There are very few people bitten by rattlesnakes, so we do recommend wearing trousers just to be on the safe side.\nWOMAN: All right. I was hoping that I might have the chance to see some wildlife too. Oh, how much is the admission to the reserve?\nPARK RANGER: It's five dollars.\nWOMAN: Can I use my National Park pass to enter the reserve?\nPARK RANGER: Unfortunately not, since it is a state park, not a National Park.\nWOMAN: All right. I heard from a friend that there is a nature tour available. Can you tell me about it?\nPARK RANGER: Certainly, but can you excuse me just a second? I'll be right back.\nWOMAN: Okay.\n\nNARRATOR: Before you hear the rest of the conversation, you have some time to look at questions 6 to 10.\nNARRATOR: Now listen and answer questions 6 to 10.\n\nPARK RANGER: Hello?\nWOMAN: Yes, I'm still here.\nPARK RANGER: Now, you are interested in the nature tours, right?\nWOMAN: Oh, there's more than one?\nPARK RANGER: Yes. We have the General Tour, which is the one your friend may have taken, but we also have two more specialised tours. Starting at 7:30 a.m. is our General Tour. That's early for some people, I know. It's offered every hour too, but it's a great time and it only lasts thirty minutes.\nWOMAN: Is that the tour that takes you to the vista points?\nPARK RANGER: Yes, that is one of the highlights, along with a film introducing the park and the museum. You're welcome to tour the museum at your leisure. It's a great tour for those who just want to take panoramic pictures with automatic cameras.\nWOMAN: Well, if I come all that way, I'd like to have a more detailed tour.\nPARK RANGER: Then you are in luck, because we have a wonderful Wildflower Tour every two hours from 8:00 a.m. It lasts one hour, and the volunteer will give you information about many of the flowers on the reserve.\nWOMAN: Besides the poppies, will cream cups be in bloom?\nPARK RANGER: Yes, and you will see lots of sage too. We have a volunteer who is really good at giving tips on close-up photography.\nWOMAN: You mentioned another tour.\nPARK RANGER: Yes, the last one is the Wildlife Tour, but it is offered at very limited times.\nWOMAN: Is that because most of the wildlife is nocturnal?\nPARK RANGER: Yes, so we offer this tour only two times, 5:30 a.m. or 7:00 p.m.\nWOMAN: Wow, that early? But don't the snakes and lizards like the sun?\nPARK RANGER: Right. First, let me say it takes about an hour and a half, but you will have the opportunity to see other animals like coyotes, quail and roadrunners. You have to get here before the crowds arrive or after most of them leave.\nWOMAN: Well, that makes sense. Does it require a lot of walking?\nPARK RANGER: More like a lot of standing, but most of the time you will be at one or two locations. So we recommend bringing a tripod and zoom lens if you want to take pictures.\nWOMAN: Well, thank you very much. You've been extremely helpful and informative.\nPARK RANGER: You're welcome. Glad I could be of service. Goodbye.\nWOMAN: Goodbye.\n\nNARRATOR: That is the end of Part 1. You now have one minute to check your answers to Part 1.","2":"PART 2 - Re-creating Life in an Iron Age Village\n\nNARRATOR: Part 2. You will hear a talk by a volunteer who has been taking part in a project to find out what everyday life was like 2,500 years ago in Britain during the time known as the Iron Age. First you have some time to look at questions 11 to 15.\n\nNARRATOR: Now listen carefully and answer questions 11 to 15.\n\nPRESENTER: Jim Stevens has been taking part in an experiment to find out what everyday life was like in Britain over 2,500 years ago, in the period of history we call the Iron Age. He is one of a group of volunteers who have been living for the last six months in the sort of village that people inhabited in those days, and following the sort of daily routine that ordinary people followed then. So, Jim, tell us what you do on a typical day.\nJIM: A typical day in the Iron Age village begins with rising at first light. I occasionally did that when I was at home because I loved having time to myself before the family got up. But here I do it every day because it's so light. Others also get up early because they find the straw beds rather cold. We start work immediately, usually tending to our fires which have died down in the night. I feed the cattle before starting to get breakfast ready, usually porridge that's been soaked the night before. It sounds horrid, doesn't it? But it's not so bad. As it takes such a long time to cook anything, we end up eating only twice a day. We have a late breakfast after a morning's work, and then in the evening we gather together as a community. Although the evening meal provides a chance for us to chat about the day, it can be quite chilly, so we go to bed pretty early. I think we're always hungry because we use much more energy than usual. It's all the physical exertion. A lot of time is spent just trying to get enough to eat, looking for berries and fruit and things like that. There are lots of other jobs to be done, like cooking, finding wood and keeping the fires going. The biggest priority for the blacksmiths working the forge is to tend the fire and to get it nice and hot so they can carry out their tasks. They've got various things to make, tools, cooking implements and so on. So life here is about looking after the animals and looking after ourselves. Everybody's always doing something around the fire as well. It's not as if we're just sitting there chatting. Just living, surviving takes up most of our time. And actually, it's quite difficult to fit in other things around it. For example, you might be breaking hazelnuts, spinning some wool or just doing things like straining milk. Here you're finding out how to do different things every day, which keeps you on your toes and keeps you interested.\n\nNARRATOR: Before you hear the rest of the talk, you have some time to look at questions 16 to 20.\nNARRATOR: Now listen and answer questions 16 to 20.\n\nPRESENTER: And I understand that you even built your own houses to live in.\nJIM: Round houses built in just the same way that archaeologists think that Iron Age people constructed them.\nPRESENTER: So tell us exactly how you build an Iron Age round house.\nJIM: It's a bit like putting up a tent at first, but without the benefit of ready-made metal poles. You mark the centre of your house with a wooden peg. What you do then is loop a length of rope around it and mark out the circle to give you the outer boundary of your building. Once you've got this, you then have to dig out the ground ready for the wall. And in Iron Age times, people didn't have shovels or diggers like we do today, but used tools which they fashioned from animal bone. It must have been quite hard work. Next, you have to start on the wall. Although there were several native trees around, like the ash and the elm, the ancients preferred oak for the wall posts, which they knocked into the circle they had dug. Don't forget to leave room for the entrance, otherwise you won't be able to get into the house. Now you can begin to see the wall of the house developing. To create the framework for the final wall, the stakes were not nailed or glued onto each other as they might be today. Instead, ones with holes cut into each end are slotted over the upright posts, making what to us looks like a fence. This procedure creates a very firm structure. To support the large roof, first you need to put up a good-sized centre post, which is secured with ropes and pegs. But it's not only this which is relied upon to hold up the roof, so the next thing you have to do is build around the post a timber scaffold tower, similar to the metal ones used in Britain today. This temporary structure of wooden poles enables you to put up the main supporting beams, which are then tied together with rope and fixed to the wall plate at the bottom of the fence. The top part of this tent-like construction is strengthened with two ring beams. Now the framework for the roof has to be completed. Rather like weaving a basket using rods from the willow tree, hazel wood rods are linked to the beams in parallel hoops. Now you can see the house in skeletal form. The tricky bit is thatching the roof because it requires great skill. I find this very difficult. First you take reed bundles and cut them so that each is of equal length. Then you must fix them firmly so they won't blow away in heavy winds. The final part of the process is the daubing, which in effect is like modern-day plastering. Whereas today we use plaster and paint or wallpaper, the Iron Age people had a mixture of clay, cow dung and straw, which they daubed all over the inside and outside to give the house a smooth finish.\n\nNARRATOR: That is the end of Part 2. You now have thirty seconds to check your answers to Part 2.","3":"PART 3 - Organising a Debate\n\nNARRATOR: Part 3. You will hear two students, Daniel and Fiona, discussing plans for a formal debate with their tutor. First you have some time to look at questions 21 to 26.\nNARRATOR: Now listen carefully and answer questions 21 to 26.\n\nTUTOR: Right, now you wanted to organise a formal discussion of some sort in the class. Is that right, Daniel?\nDANIEL: Yes, we thought it would be really good to end our psychology course with a formal debate. You know, where there's a statement and people argue for or against it.\nTUTOR: Good idea. Where did the enthusiasm come from? Have either of you organised debates before? Fiona?\nFIONA: No, but one of my friends did in his last year at secondary school and he says he got a lot out of doing it. And I know they have debates in lots of other departments here at the university.\nTUTOR: I see. So what do you think the students, you and the others, would get out of this?\nFIONA: Well, a debate will encourage people to study all sides of the subject matter. And I also think listening to other people's ideas can have a focusing effect on your own. Sometimes you kind of don't know what you truly believe until you hear something you disagree with.\nTUTOR: OK, what about the topic for the debate?\nDANIEL: We've got three to choose from. We'll show you in a minute to check they're OK. At first, we thought we'd ask the other students to suggest something, but we were afraid we'd get thirty different topics. So instead, we brainstormed some, just the two of us, then made a shortlist and we'll get them to vote for the one they like best.\nTUTOR: Right.\nDANIEL: But the thing is, if people don't know how debates work, they could feel at a disadvantage. I mean, it wouldn't affect their grades or anything, but it could put them off.\nFIONA: So we thought we should have a meeting beforehand to make sure everyone's clear about what's involved in a debate and how to prepare for it.\nTUTOR: I think that's a good idea.\nFIONA: And we thought we could establish some key points of a successful debate there, like that debates are effective methods for considering an issue and that you need to understand both sides of an argument in order to support one side effectively. We think it'll be best if we can use an issue that the students already have strong opinions about.\nDANIEL: Then some people will be happy to speak in support of it and others to oppose it.\nTUTOR: Right. What else do you want to do at the meeting?\nDANIEL: Well, we've got to think about how people will do the background research for the debate. We could organise everyone into two teams. That should save time for the main speakers. They won't have to do it on their own. And we'll need to decide on some rules, like how long each person speaks for, and to select a chair for the debate, someone who's really confident.\nTUTOR: Fine. Now, I think you should have some sort of follow-up to the debate. After it's over, I'd like you to get everyone to write a short essay, focusing on what they gained from participating in it. And in turn, that can feed into the work we've been doing on learning and motivation.\nFIONA: But would you be willing to read them and report back? I mean, give some feedback on them?\nTUTOR: I wouldn't have made the suggestion if I wasn't.\nFIONA: Thanks.\n\nNARRATOR: Before you hear the rest of the discussion, you have some time to look at questions 27 to 30.\nNARRATOR: Now listen and answer questions 27 to 30.\n\nTUTOR: OK, now let's think a bit more about the meeting. You need to decide exactly how you'll introduce the students to different features of a debate.\nDANIEL: Well, first of all, we need to inform everyone about what actually happens at a debate, the procedures and so on. We could talk about that and write the main information on the board.\nFIONA: Or instead of that, we could make a summary of the main stages and hand that out.\nDANIEL: Then talk it through. Yes. OK, that's better.\nFIONA: OK, but we do need to talk about body language as well.\nTUTOR: Yes, that's a very important tool. I've got an interesting article on that with some good diagrams of techniques for things like eye contact. I'll make some copies for you to give out.\nFIONA: Great.\nDANIEL: Then we need to think about where people will find the information on the debate topic. So they'll need to know where to look for the information. We could compile a list of sources, textbooks and articles and so on.\nFIONA: We could, but couldn't people offer their own suggestions and advice on that at the meeting instead?\nTUTOR: Yes, get everyone involved.\nDANIEL: Right.\nFIONA: What about preparation for asking and answering questions? We could try to demonstrate that, but I'm not sure how.\nDANIEL: Maybe we could put up a list of points on the board, then discuss them.\nFIONA: Yes, that sounds better. Thanks.\nTUTOR: OK, well, let's meet up again.\n\nNARRATOR: That is the end of Part 3. You now have thirty seconds to check your answers to Part 3.","4":"PART 4 - Office Design\n\nNARRATOR: Part 4. You will hear part of a talk about recent research into the design of workplaces. First you have some time to look at questions 31 to 40.\nNARRATOR: Now listen carefully and answer questions 31 to 40.\n\nLECTURER: Hello, everyone. I recently completed some important research into the way office space is designed and its impact on employees. The open-plan office had been the norm for offices around the world. I'm sure you can picture one, a big room with maybe fifty or a hundred workers sitting at their workstations. You might think open-plan designs are a recent phenomenon, but they actually came about in the early twentieth century, when businesses needed large numbers of people to do typing. These employees, usually women, used to have to sit in rows working away at their typewriters under the watchful eye of their supervisor. Over the years, designers have come up with several variations on the open theme. In particular, this has been achieved through furnishings. The early designs featured separate desks. A subsequent design introduced the concept of the cubicle. These can have either high screens that workers can't see over or a screen just low enough to keep a lookout for the manager. And nowadays, with the increase in large call centres, a phenomenon known as hot-desking is common. In this system, employees working on different shifts are asked to share the same workstation. As you can imagine, this is not very popular with staff, as there is little opportunity to personalise your workspace.\n\nLECTURER: In fact, my research shows that employees in general dislike the open-plan design. As part of my research, I conducted a survey of the staff in several large companies with open-plan offices. The employees all voiced similar concerns about the design. Firstly, they felt that the open plan took away their privacy, but many also felt the need to carry their valuables with them at all times. So, to some extent, they also felt there was less security with these designs. Another common complaint may be something for employers to consider when choosing this type of design, and this was that these types of office space are bad for the health. I was intrigued by this possibility, but looking at staff records, it does seem to be borne out.\n\nLECTURER: So, if this design is so unpopular, why is it so commonplace? Well, the answer to that is in the benefits that employers feel this type of design has. Of course, there is the obvious benefit that this design significantly reduces costs, both in terms of rent and energy use. Employers also argue that an open-plan design leads to better teamwork and communication. They also feel that new staff can learn from observing other workers, so this design can actually help in training staff. However, the complaints voiced by employees seem to suggest that the disadvantages far outweigh the advantages. The reality is that unhappy workers are unlikely to work well together, and there is plenty of evidence to suggest workers are frequently distracted from their work by the noise that is all around them. What is clear is that as designers, we need to think carefully about the impact that our design has both on the staff involved and the work that they do.\n\nNARRATOR: That is the end of Part 4. You now have one minute to check your answers to Part 4."},"transcript_source":"Full Part 1-4 transcript reconstructed from the supplied audio and cross-checked against the same published test scripts; includes spoken section instructions and transitions retained in the delivery audio.","timestamps_source":"Part boundaries and evidence windows derived from the supplied audio using its long instruction/checking silences and the aligned script timing.","script_completion":[{"q":101,"part":1,"n":1,"match":"full bloom","answer":"full bloom","lexical_type":"collocation"},{"q":102,"part":1,"n":2,"match":"beat the crowds","answer":"beat the crowds","lexical_type":"idiom"},{"q":103,"part":1,"n":3,"match":"just to be on the safe side","answer":"just to be on the safe side","lexical_type":"fixed phrase"},{"q":104,"part":1,"n":4,"match":"at your leisure","answer":"at your leisure","lexical_type":"fixed phrase"},{"q":105,"part":1,"n":5,"match":"panoramic pictures","answer":"panoramic pictures","lexical_type":"noun phrase"},{"q":106,"part":1,"n":6,"match":"more detailed tour","answer":"more detailed tour","lexical_type":"noun phrase"},{"q":107,"part":1,"n":7,"match":"very limited times","answer":"very limited times","lexical_type":"adjective phrase"},{"q":108,"part":1,"n":8,"match":"extremely helpful and informative","answer":"extremely helpful and informative","lexical_type":"adjec =\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div><div class=\"question-row\"><span style=\"min-width:260px;display:inline-block\">Asking and answering questions</span> <span class=\"q-block inline-question\" data-q=\"30\" id=\"qblock30\"><strong>30</strong> <select class=\"answer-input\" id=\"q30\" style=\"width:110px\"><option value=\"\" selected>Select</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option><option value=\"D\">D</option><option value=\"E\">E</option><option value=\"F\">F</option></select></span></div></div>","4":"<div class=\"task-card exam-content\"><h2>PART 4</h2><div class=\"instructions-block\"><p><strong>Questions 31-40</strong></p><p>Complete the notes below.</p><p>Write <strong>ONE WORD ONLY</strong> for each answer.</p></div><div class=\"framed-notes\"><h3>Office Design</h3><p class=\"group-head\">Early 20th Century</p><ul><li>workers employed to do <span class=\"q-block inline-question\" data-q=\"31\" id=\"qblock31\"><strong>31</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q31\" type=\"text\" style=\"width:160px\"/></span> were arranged in rows</li></ul><p class=\"group-head\">1960s to present</p><p><b>Variations in design of open-plan offices:</b></p><ul><li>first, workers had individual <span class=\"q-block inline-question\" data-q=\"32\" id=\"qblock32\"><strong>32</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q32\" type=\"text\" style=\"width:160px\"/></span></li><li>later, they had cubicles with high or low <span class=\"q-block inline-question\" data-q=\"33\" id=\"qblock33\"><strong>33</strong> <input autocomplete=\"off\" class=\"answer-input inline\" id=\"q33\" type=\"text\" style=\"width:160px\"/></span></li><li>nowadays, workers may have to <span class=\"q-block inline-question\" data-q=\"34\" id=\"qblock34\"><strong>34</strong> function prepareExam(){if(state.examStarted)return;$('#loadingScreen').classList.remove('hidden');$('#startScreen').classList.add('hidden');$('#examInterface').classList.add('hidden');setTimeout(()=>{$('#loadingScreen').classList.add('hidden');$('#startScreen').classList.remove('hidden')},600)}

function renderExamPart(p){state.currentPart=p;if(state.currentQ<(p-1)*10+1||state.currentQ>p*10)state.currentQ=(p-1)*10+1;const host=$('#examQuestionHost');host.innerHTML=PARTS[String(p)];$('#examPartTitle').textContent='SECTION '+p;$('#examPartDesc').textContent=`Questions ${(p-1)*10+1}-${p*10} · ${DATA.sections[p-1]}`;bindExamInputs();bindMatching();updateNav();setTimeout(()=>restoreExamInputs(),0)}
function bindExamInputs(){$$('#examQuestionHost input[type=text]').forEach(el=>{const q=el.id.replace('q','');el.value=state.answers[q]||'';el.addEventListener('input',()=>{state.answers[q]=el.value;saveStored();updateNav()})});$$('#examQuestionHost select.answer-input').forEach(el=>{const q=el.id.replace('q','');el.value=state.answers[q]||'';el.addEventListener('change',()=>{state.answers[q]=el.value;saveStored();updateNav()})});$$('#examQuestionHost .multi-group-select').forEach(el=>el.addEventListener('change',()=>{const qs=el.dataset.group.split(',');const val=el.value;for(const oq of qs){if(oq!==el.id.replace('q','')&&state.answers[oq]===val){delete state.answers[el.id.replace('q','')];el.value='';break}}saveStored();updateNav()}));$$('#examQuestionHost input[type=radio]').forEach(el=>{const q=el.name.replace('q','');el.checked=state.answers[q]===el.value;el.addEventListener('change',()=>{state.answers[q]=el.value;saveStored();updateNav()})});$$('#examQuestionHost .special-multi38').forEach(ch=>{const vals=String(state.answers['38']||'').split(',').filter(Boolean);ch.checked=vals.includes(ch.value);ch.addEventListener('change',()=>{const all=[...document.querySelectorAll('#examQuestionHost .special-multi38')];let sel=all.filter(x=>x.checked);if(sel.length>2){ch.checked=false;sel=all.filter(x=>x.checked)}state.answers['38']=sel.map(x=>x.value).sort().join(',');saveStored();updateNav()})});$$('#examQuestionHost .pair-choice-exam').forEach(ch=>{const qs=ch.dataset.pairQs.split(',').map(Number);const current=qs.map(q=>state.answers[q]).filter(Boolean);ch.checked=current.includes(ch.value);ch.addEventListener('change',()=>{const group=[...document.querySelectorAll(`.pair-choice-exam[data-pair-group="${ch.dataset.pairGroup}"]`)];let selected=group.filter(x=>x.checked);if(selected.length>qs.length){ch.checked=false;selected=group.filter(x=>x.checked)}const picked=selected.map(x=>x.value).sort();qs.forEach((q,i)=>{if(picked[i])state.answers[q]=picked[i];else delete state.answers[q]});state.currentQ=qs[Math.max(0,Math.min(picked.length,qs.length)-1)]||qs[0];saveStored();updateNav()})});$$('#examQuestionHost [data-q]').forEach(el=>el.addEventListener('click',()=>{const q=Number(el.dataset.q);if(q)state.currentQ=q;updateNav()}));}
function restoreExamInputs(){for(const [q,v] of Object.entries(state.answers)){const t=$(`#examQuestionHost #q${q}`);if(t&&(t.type==='text'||t.tagName==='SELECT'))t.value=v;$$(`#examQuestionHost input[name=q${q}]`).forEach(r=>r.checked=r.value===v);const slot=$(`#examQuestionHost .ldm-slot[data-question="${q}"]`);if(slot&&v){slot.dataset.answer=v;const group=slot.dataset.group;const opt=$(`#examQuestionHost .ldm-option[data-group="${group}"][data-code="${v}"]`);slot.textContent=opt?opt.dataset.label:v;slot.classList.add('filled')}}$$('#examQuestionHost .pair-choice-exam').forEach(ch=>{const qs=ch.dataset.pairQs.split(',').map(Number);ch.checked=qs.map(q=>state.answers[q]).includes(ch.value)});$$('#examQuestionHost .special-multi38').forEach(ch=>{ch.checked=String(state.answers['38']||'').split(',').includes(ch.value)});updateMatchingUsed();updateNav()}

function bindMatching(){let dragged=null;$$('#examQuestionHost .ldm-option').forEach(o=>{o.onclick=()=>{state.matchArmed=o.dataset.code;$$('#examQuestionHost .ldm-option').forEach(x=>x.classList.toggle('selected',x===o))};o.addEventListener('dragstart',e=>{dragged=o.dataset.code;e.dataTransfer.setData('text/plain',dragged)})});$$('#examQuestionHost .ldm-slot').forEach(slot=>{slot.addEventListener('dragover',e=>e.preventDefault());slot.addEventListener('drop',e=>{e.preventDefault();placeMatch(slot,dragged||e.dataTransfer.getData('text/plain'))});slot.onclick=()=>{if(state.matchArmed)placeMatch(slot,state.matchArmed)}})}

$('#startTestBtn').onclick=startExam;$('#volumeSlider').oninput=e=>$('#sharedAudio').volume=Number(e.target.value);$('#flagBtn').onclick=toggleFlag;$('#notesBtn').onclick=openNotes;$('#closeNotesBtn').onclick=closeNotes;$('#doneNotesBtn').onclick=closeNotes;$('#clearNoteBtn').onclick=clearCurrentNote;$('#noteTextarea').oninput=saveCurrentNote;$('#noteModal').addEventListener('click',e=>{if(e.target.id==='noteModal')closeNotes()});$('#fullscreenBtn').onclick=()=>{const p=document.fullscreenElement?document.exitFullscreen():$('#examRoot').requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Fullscreen is not available'))};$('#optionsBtn').onclick=openOptions;$('#submitTest').onclick=()=>submitExam(false);$('#highlightBtn').onclick=highlightSelection;$('#removeHighlightBtn').onclick=removeHighlights;window.addEventListener('pagehide',()=>{stopAllAudio();try{sessionStorage.removeItem(NOTES_KEY)}catch(e){}});

const hash=location.hash.replace('#','');if(ACTIVITIES.some(a=>a[0]===hash))setTimeout(()=>openActivity(hash),50);
