nscript":{"1":"Part 1. You will hear a teacher who is organizing a school trip phoning a woman who works at an adventure camp. First, you have some time to look at questions 1 to 7. Now listen carefully and answer questions 1 to 7. Hello, Adventure Camp. Hello, I want to take my Year 11 class on an activity holiday for a couple of days, and I've been looking at your website. I'm interested in the two-day Adventure Camp. What sort of accommodation would we be staying in? Tents. They'd already be set up for you. OK, so how many people do you have at any one time? Well, at peak time we might have up to 44. That's the maximum we can accommodate, but it's usually more like 30. That's students and teachers. Right. We'd be about 20 students and 5 adults. And can you tell me how much it costs? I couldn't find any information about prices on your website. No, we've been reviewing them. It used to be £160 per student for the two-day programme, but we've just gone up to £180, so that's still only £90 a day. Hmm, that sounds reasonable. And is that for everything except transport? That's right, but it covers all activities as well as food. Oh, and the students also take home a T-shirt as a souvenir. OK, and can you tell me a bit about the programme? Sure. On the morning of day one, the students get the chance to be shown how to ride a horse. They just ride for about half an hour each, but it's something not many of them have ever tried, and they love it. I can imagine they would. And then in the afternoon, everyone goes out on a canoe and paddles down the river. Yes, I read about that. It sounds fun. Yes, it's always popular. Would your class enjoy looking around some caves? Yes, I heard there's one nearby that they can go inside. Is that the same day? Yes, that's actually the next activity. It's quite extensive, so they find it very exciting finding out how far they can go. And we're hoping that we'll soon be able to add an underground tour of an old mine. Next year, perhaps. Is there anything special that they should wear? A helmet's essential, but we supply these free of charge. However, the students should all wear strong shoes for this, not sandals, as the floor can be slippery. OK, that's good to know. That activity takes a couple of hours, so everyone will have a little while to relax before dinner in the evening. And what do the group usually get to eat? Well, sometimes we have a barbecue with burgers and sausages, and at other times we might have pasta. That's really popular. Or we have pizza. Now listen and answer questions 8 to 10. Well, day one sounds exciting. How about day two? We like to get the kids to cycle. It's so much fun, and a lot of them don't have bikes of their own. And where would they cycle to? There's a route that goes from the camp over the river as far as a village on the other side, and then back. Great! After that, we let them relax. Then after lunch, we organise a game of basketball. It's usually great fun. They play a lot of football at school, so that'd be a nice change. Good. That's followed by a practical activity. We always like our guests to learn how to make something. We taught everyone to make bread last year. This time, we'll show the students how butter is produced. Oh, right. And that would take them up to dinner time. OK. Well, I have to give this info... That is the end of Part 1.","2":"Part 2. You will hear a man from a job agency talking to people interested in temporary work in a restaurant. First you have some time to look at questions 11 to 15. Now listen carefully and answer questions 11 to 15. Thank you for coming along today. I hope that many of you will be interested in applying for temporary work in one of the restaurants in our area that currently need extra employees. You might imagine that now the summer's nearly over there would be less demand for staff in places like hotels and restaurants but that's not actually the case this year. It seems that the food festival that took place here a couple of months ago has boosted interest in the many excellent eating places in our region and our restaurants are experiencing a remarkable increase in customers. There's a need for all sorts of people including receptionists and other admin staff as well as more exclusively catering type positions. The main demand is for people to prepare vegetables and the like as well as to deal with washing up but waiters and other serving staff are also in short supply. Working hours in a restaurant can of course be antisocial as they usually involve a fair amount of evening and weekend work and most places will also require you to do some early morning shifts. However the hours can work well for people who want to combine work with a college course. You may well feel it's not for you if you have small children though some parents do manage to make it work for them. So what sort of skills are restaurants particularly looking for? To some extent it depends on the type of job. Being able to work with other people is crucial for staff based in the kitchen. Then waiters clearly need to be good at talking to customers and listening to them and receptionists have to be able to check bills for accuracy. Now people often forget to include essential information when they're sending in their CV. You'd be surprised how many people fail to check their phone numbers etc are correct so make sure you do this. If you want to send a photo that's fine but not something we require and we're more interested in relevant experience than details of school exam results. Before you hear the rest of the talk you have some time to look at questions 16 to 20. I'd like now to tell you about some specific restaurants that currently need to take on extra staff. You may be familiar with the tower that's between the railway station and the bus station so is very easy to get to. It also offers some hotel accommodation which is mainly used by people on business trips. It has a range of vacancies. Beachside as the name suggests is next to the sea. You need your own transport to get there but it would be a good place to work if you're thinking of making a career in the restaurant business as it has plans for expansion and expects to have a variety of permanent jobs to offer soon. There are a range of temporary jobs available at Marco's, the Italian restaurant on the market square. Its clientele has grown considerably since it got lots of positive reviews on an online restaurant guide last year. Its menus are simple but of very high quality. Another place with vacancies is Silver Lee. This is nothing to do with the Silver Low chain of steakhouses. In fact it's a vegetarian restaurant which has been very successful in the capital because of its innovative style of cooking and beautiful presentation. Currently they mainly attract younger customers but plan to diversify in future. The final place I want to mention is the Lion. This is unusual in that it is actually offering a flat for the use of four new members of staff over the next couple of months. It's hoping that this will help it to attract high quality applications. That is the end of part two.","3":"Part 3. You will hear a discussion between Simon and Anna, two Bachelor of Communications students in New Zealand. First you have time to look at questions 21 to 24. Now listen carefully and answer questions 21 to 24. Excuse me, are you Anna Jenkins? Yes. My name's Simon. I'm on the Bachelor of Communications course, year one, and I really need some advice from someone who's ahead of me. I was told you were in year three. That's right. How's it going? I'm not convinced I chose the right major. At present, I'm doing public relations. That's why I want to talk to you. You're doing the global communications major, right? Yes. Are you going to change to that? Possibly. If it helps my career. Won't the public relations course do that? If I just wanted to work in New Zealand, yes. I mean, I've heard of graduates finding work here almost immediately, and with good salaries. But I'd like to go abroad, and I imagine the global major would give me the skills so I could go off and work anywhere. I know it'll be hard work starting again, but I would be motivated. I see. But I'm still not sure you need to change majors to achieve your goal. Aren't some of the courses the same for both majors? Some of the same, yes. But I'm not sure I'm cut out for the business aspects of public relations. Economic principles, for example. I understand what it's all about. I did economics at high school. But I just found it dull. I want to study something creative, something that connects you to people. Well, the global major certainly does that. Is it right you have to learn a language? Well, it was compulsory when I started, but it's up to you now. Do you think it's necessary to learn one? Well, so much of the major is looking at ways that culture and language influence communication, and if you learn a second language yourself, you definitely get more of an insight into what the theory is all about. But I'm no good at languages. Which one is the easiest? I'm not sure that's the best rationale for a choice. In my first year, we could go for Chinese, Japanese or Maori. I went for Chinese because New Zealand has so many trade deals with China now. But Japanese would be good if you think you might end up in tourism. I did Maori at high school, and it was fascinating, but it would restrict you to doing business within New Zealand. Before you hear the rest of the discussion, you have some time to look at questions 25 to 30. Thank you. Now listen and answer questions 25 to 30. What did you think of your lecturers? Oh, I have to say they're great. And when we were working on our individual proposals for the internships, they pushed us to keep working on producing the best work possible, and even though I kept having to adapt it, I actually felt proud of mine eventually. Yes, ours push us too, which is good. Sometimes you don't know what you're capable of, and it makes you a lot more enthusiastic. Sometimes, if the lecturer sits down with you for a chat, it's more motivating than a written report. I completely agree. And I suppose one thing I really like is the way they encourage us to challenge their opinions, as long as we can come up with a sound argument to support our case. I think that's helped me develop some useful critical thinking skills. That's good. I think whatever major you do, all the lecturers want to encourage that. At least, that's my experience. What did you enjoy most about the Global Communications major? Well, Communication 1 was really useful. I was never very confident at speaking in front of large groups, but that showed us how to use different voice techniques and how to give interactive presentations. I had to give a presentation to some executives during my internship, and I did quite well after that. Sounds interesting. Psychology was absolutely fascinating. You get to look at what motivates people and how people operate within a big team. That's really essential when you're trying to get all the people to cooperate on a project that has the pressure of a deadline. In the brochure, interpersonal skills looks good. I didn't do that course. It says it's about how to listen properly, how to manage conflict in relationships, you know. When colleagues are arguing, the first step to improve things is better communication. That's pretty logical. And this one, Communication 3, what kinds of behaviour are likely to cause offence or misunderstanding between nationalities in the global business world. Yes, I enjoyed that. That is the end of Part 3.","4":"Part 4. You will hear a lecture on trade in spices between Asia and Europe during the 14th and 15th centuries. Now listen carefully and answer questions 31 to 40. By the 12th century, spices from Asia were the most profitable element in trade in Europe. And for the next 500 years, they played a major role in the European economies, particularly in Italy. Before we examine the trade in spices during the 14th and 15th centuries, it's important to point out that for at least 2,000 years, the term spice has been applied in Europe to various imported foodstuffs. The ancient Greeks and Romans used a variety of spices to flavor foods and to prepare perfumes. Exotic imports from Asia were particularly appealing to them, and they spent vast fortunes on trade with Arabia, the center of the spice trade at that time. Rare spices were used in Roman cooking as a sign of wealth, and the privileged developed an exaggerated taste for spicy foods. The search for spices to sell in Europe was a major factor in the vast amount of exploration that took place in the 14th and 15th centuries. When merchants reached the New World, which had previously been unknown in Europe, spices were so valuable because they were not only used to improve the taste of food, they were also used medicinally, which I'll come back to in a moment, and they were also thought to have both positive and negative influences on one's mood. People were advised to eat certain spices in moderation for this reason. As regards health, different qualities were ascribed to different spices in the Middle Ages. For instance, nutmeg was added to hot drinks to help with colds. Cloves were used to relieve a toothache, a remedy that's still well known today. Hot pungent spices were used more liberally in winter diets, and it was believed that the appropriate therapy for rheumatism was pepper. Incidentally, a fascinating indication of the value of spices, such as peppercorns, was that in parts of Europe, in medieval times, they were accepted as a substitute for money. So some landlords would be paid a peppercorn rent. Another way in which spices were used was that rich people burnt them in an effort to counteract the smells that were prevalent in homes lacking sanitation, and where the risks of leaving rotting food lying around were not understood. I've mentioned the high cost of imported spices more than once, and the reasons for this are easy to identify. Although production costs, including labor costs, were low, which meant European merchants were able to buy spices cheaply, transport costs were their major expense. Trade between China or India and Europe was mostly conducted by sea, as overland travel was even more expensive and much more dangerous. As a result, one of the most important European industries of the Middle Ages was shipbuilding, and this continued to be the case for several hundred years. However, there was another reason why customers paid so much for their spices. Major cities were able to generate a considerable income from merchants by imposing taxes on trade. These increased so much in the course of the 15th century that the price of Indian pepper in Europe rose 30-fold, at a time when the desire for exotic spices was at its height. Changes in pepper prices had a significant effect on national economies, comparable with the effects of the price of oil today. That is the end of Part 4."},"script_completion":[{"q":101,"part":1,"n":1,"match":"adventure camp","answer":"adventure camp","lexical_type":"contextual expression"},{"q":102,"part":1,"n":2,"match":"maximum","answer":"maximum","lexical_type":"contextual expression"},{"q":103,"part":1,"n":3,"match":"£180","answer":"£180","lexical_type":"contextual expression"},{"q":104,"part":1,"n":4,"match":"horse","answer":"horse","lexical_type":"contextual expression"},{"q":105,"part":1,"n":5,"match":"canoe","answer":"canoe","lexical_type":"contextual expression"},{"q":106,"part":1,"n":6,"match":"caves","answer":"caves","lexical_type":"contextual expression"},{"q":107,"part":1,"n":7,"match":"helmet","answer":"helmet","lexical_type":"contextual expression"},{"q":108,"part":1,"n":8,"match":"butter","answer":"butter","lexical_type":"contextual expression"},{"q":201,"part":2,"n":1,"match":"food festival","answer":"food festival"," od","context":"opportunities for longer term employment","collocations":["secure employment","employment opportunity"],"paraphrases":["ongoing work"]},{"word":"freedom of thought","lexical_type":"noun phrase","pos":"noun phrase","uz":"fikrlash erkinligi","def":"the ability to form and express independent ideas","context":"They encourage freedom of thought.","collocations":["encourage freedom of thought","intellectual freedom"],"paraphrases":["independent thinking"]},{"word":"adapt courses","lexical_type":"verb phrase","pos":"verb phrase","uz":"kurslarni moslashtirmoq","def":"modify courses to suit circumstances or needs","context":"They are willing to adapt courses.","collocations":["adapt a course","adapt teaching materials"],"paraphrases":["modify courses"]},{"word":"enthusiastic about","lexical_type":"adjective phrase","pos":"adjective phrase","uz":"...ga ishtiyoqli","def":"showing strong interest or excitement","context":"They are enthusiastic about their subject.","collocations":["highly enthusiastic about","remain enthusiastic about"],"paraphrases":["passionate about"]},{"word":"global communications","lexical_type":"noun phrase","pos":"noun phrase","uz":"global kommunikatsiyalar","def":"communication across countries and cultures","context":"Global Communications major","collocations":["global communication skills","global communications major"],"paraphrases":["international communication"]},{"word":"economic principles","lexical_type":"noun phrase","pos":"noun phrase","uz":"iqtisodiy tamoyillar","def":"fundamental ideas explaining economic behaviour","context":"Economic Principles course","collocations":["basic economic principles","apply economic principles"],"paraphrases":["economics fundamentals"]},{"word":"understanding cultural differences","lexical_type":"noun phrase","pos":"noun phrase","uz":"madaniy farqlarni tushunish","def":"recognising how cultures differ in norms and behaviour","context":"understanding cultural differences","collocations":["cultural differences","cross-cultural understanding"],"paraphrases":["intercultural awareness"]},{"word":"reduce problems between co-workers","lexical_type":"verb phrase","pos":"verb phrase","uz":"hamkasblar orasidagi muammolarni kamaytirmoq","def":"lessen conflict or difficulty between colleagues","context":"reducing problems between co-workers","collocations":["reduce workplace conflict","resolve co-worker problems"],"paraphrases":["manage workplace conflict"]},{"word":"working in large groups","lexical_type":"verb phrase","pos":"verb phrase","uz":"katta guruhlarda ishlash","def":"collaborating effectively with many people","context":"working in large groups","collocations":["work in large groups","large-group collaboration"],"paraphrases":["team collaboration"]},{"word":"preparation of perfumes","lexical_type":"noun phrase","pos":"noun phrase","uz":"atirlar tayyorlash","def":"the process of making perfumes","context":"the preparation of perfumes","collocations":["perfume preparation","prepare perfumes"],"paraphrases":["perfume making"]},{"word":"display their wealth","lexical_type":"verb phrase","pos":"verb phrase","uz":"boyligini namoyish etmoq","def":"show wealth publicly as a sign of status","context":"used certain spices to display their wealth","collocations":["display wealth","symbol of wealth"],"paraphrases":["show status"]},{"word":"contributed to the exploration","lexical_type":"verb phrase","pos":"verb phrase","uz":"kashfiyotlarga hissa qo‘shmoq","def":"help cause or support exploration","context":"contributed to the exploration of the New World","collocations":["contribute to exploration","drive exploration"],"paraphrases":["helped spur exploration"]},{"word":"take the place of","lexical_type":"fixed expression","pos":"verb phrase","uz":"o‘rnini egallamoq","def":"replace something","context":"to take the place of money","collocations":["take the place of","replace money"],"paraphrases":["substitute for"]},{"word":"domestic smells","lexical_type":"noun phrase","pos":"noun phrase","uz":"uy-ro‘zg‘or hidlari","def":"odours occurring in homes","context":"to hide domestic smells","collocations":["mask domestic smells","unpleasant smells"],"paraphrases":["household odours"]},{"word":"transport costs","lexical_type":"noun phrase","pos":"noun phrase","uz":"transport xarajatlari","def":"expenses involved in transporting goods","context":"greatest expense: transport costs","collocations":["high transport costs","reduce transport costs"],"paraphrases":["shipping expenses"]},{"word":"shipbuilding industry","lexical_type":"noun phrase","pos":"noun phrase","uz":"kema qurish sanoati","def":"the industry concerned with constructing ships","context":"development of the European shipbuilding industry","collocations":["shipbuilding industry","shipbuilding sector"],"paraphrases":["ship construction sector"]},{"word":"valuable income","lexical_type":"noun phrase","pos":"noun phrase","uz":"muhim daromad","def":"financial revenue of significant value","context":"cities received valuable income from merchants","collocations":["generate income","valuable source of income"],"paraphrases":["revenue"]}],"part_audio_boundaries":{"1":{"start":0,"end":9999},"2":{"start":0,"end":9999},"3":{"start":0,"end":9999},"4":{"start":0,"end":9999}},"audio_sources":["[embedded:audio/part-1.mp3]","[embedded:audio/part-2.mp3]","[embedded:audio/part-3.mp3]","[embedded:audio/part-4.mp3]"],"audioDuration":1572.44,"transcript_status":"Speech-recognition transcription recovered from the actual four Cloudflare R2 audio files; word-level errors may remain pending editorial verification.","audio_embedded":true,"audio_encoding":"mp3 80 kbps mono 44.1 kHz","audio_source_note":"Four local Part segments derived from the uploaded full MP3; cut points identified from source silence, final trailing silence excluded."};
const PARTS={"1":"<div class=\"task-card exam-content\"><div class=\"instructions-block\"><p><b>Questions 1–10</b></p><p>Complete the notes below. Write <b>ONE WORD AND/OR A NUMBER</b> for each answer.</p></div><div class=\"centered-title\">Adventure Camp</div><div class=\"summary-section\"><p><b>Accommodation</b></p><p>• Tents are provided.</p><p>• The camp can take up to <span class=\"q-block\" data-q=\"1\"><input class=\"answer-input\" id=\"q1\" aria-label=\"Question 1\"></span> people.</p><p><b>Cost</b></p><p>• £<span class=\"q-block\" data-q=\"2\"><input class=\"answer-input\" id=\"q2\" aria-label=\"Question 2\"></span> for two days</p><p>• Transport is not included.</p><p><b>DAY ONE</b></p><p>Morning: A lesson in riding a <span class=\"q-block\" data-q=\"3\"><input class=\"answer-input\" id=\"q3\" aria-label=\"Question 3\"></span></p><p>Afternoon: Go down the river by <span class=\"q-block\" data-q=\"4\"><input class=\"answer-input\" id=\"q4\" aria-label=\"Question 4\"></span>; explore one of the <span class=\"q-block\" data-q=\"5\"><input class=\"answer-input\" id=\"q5\" aria-label=\"Question 5\"></span>; a <span class=\"q-block\" data-q=\"6\"><input class=\"answer-input\" id=\"q6\" aria-label=\"Question 6\"></span> is provided.</p><p>Evening: Dinner — either a barbecue, <span class=\"q-block\" data-q=\"7\"><input class=\"answer-input\" id=\"q7\" aria-label=\"Question 7\"></span> or pizza.</p><p><b>DAY TWO</b></p><p>Morning: Cycle to a <span class=\"q-block\" data-q=\"8\"><input class=\"answer-input\" id=\"q8\" aria-label=\"Question 8\"></span> and back; free time.</p><p>Afternoon: Play <span class=\"q-block\" data-q=\"9\"><input class=\"answer-input\" id=\"q9\" aria-label=\"Question 9\"></span>; learn how to make <span class=\"q-block\" data-q=\"10\"><input class=\"answer-input\" id=\"q10\" aria-label=\"Question 10\"></span>.</p></div></div>","2":"<div class=\"task-card exam-content\"><div class=\"instructions-block\"><p><b>Questions 11–15</b></p><p>Choose the correct letter, <b>A, B or C</b>.</p></div><div class=\"centered-title\">Temporary restaurant work</div><div class=\"q-block\" data-q=\"11\"><p><b>11</b> Why are restaurants currently looking for more staff?</p><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q11\" value=\"A\"><b>A</b> Additional staff will be required for the food festival.</label><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q11\" value=\"B\"><b>B</b> They always need extra staff during the summer.</label><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q11\" value=\"C\"><b>C</b> Greater numbers of people are using restaurants in the area.</label></div><div class=\"q-block\" data-q=\"12\"><p><b>12</b> What kind of work are staff most needed for?</p><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q12\" value=\"A\"><b>A</b> kitchen duties</label><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q12\" value=\"B\"><b>B</b> serving customers</label><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q12\" value=\"C\"><b>C</b> administration</label></div><div class=\"q-block\" data-q=\"13\"><p><b>13</b> The speaker says that the working hours will particularly suit people</p><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q13\" value=\"A\"><b>A</b> who are also studying.</label><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q13\" value=\"B\"><b>B</b> who have young families.</label><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q13\" value=\"C\"><b>C</b> who dislike getting up early.</label></div><div class=\"q-block\" data-q=\"14\"><p><b>14</b> What skill is particularly important for kitchen staff?</p><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q14\" value=\"A\"><b>A</b> communication with customers</label><label class=\"multi-choice-option\"><input type=\"radio\" name=\"q14\" value=\"B\"><b>B</b> teamwork</label><label c function normalize(v){return String(v||'').trim().toLowerCase().replace(/[.,]/g,'').replace(/\s+/g,' ')}

function playWindow(start,end,button){if(!EVIDENCE_TIMING_VERIFIED){toast('Precise evidence timing is unavailable for this source. Use the full Part audio in Review.');return}const p=Math.floor(start/1000)+1,localStart=start%1000,localEnd=end%1000;setAudioPart(p,false);const a=$('#sharedAudio');if(button&&!button.dataset.idleLabel)button.dataset.idleLabel=button.textContent;const same=activeClip&&activeClip.start===start&&activeClip.end===end&&activeClip.button===button;if(same&&!a.paused){a.pause();return}if(!same){stopActiveClip();a.pause();try{a.currentTime=localStart}catch(e){}const ctl={start,end,button,onTime:null,onEnd:null,onPause:null};ctl.onTime=()=>{if(localEnd>localStart&&a.currentTime>=localEnd){a.pause();stopActiveClip()}};ctl.onEnd=()=>stopActiveClip();ctl.onPause=()=>{if(activeClip===ctl&&button){button.textContent=button.dataset.idleLabel;button.classList.remove('clip-playing')}};activeClip=ctl;a.addEventListener('timeupdate',ctl.onTime);a.addEventListener('ended',ctl.onEnd);a.addEventListener('pause',ctl.onPause)}if(button){button.textContent='⏸ Pause';button.classList.add('clip-playing')}const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{resetClipButton(button);toast('Audio could not start')})}

let scriptPart=1;
function buildScriptTranscript(part){
 const source=DATA.transcript[String(part)]||'',gaps=DATA.script_completion.filter(g=>g.part===part);
 let cursor=0,out='';
 for(const g of gaps){
  const at=source.indexOf(g.match,cursor);
  if(at<0)throw Error('Missing Part '+part+' gap '+g.n);
  out+='<span data-script-source-start="'+cursor+'">'+escapeHtml(source.slice(cursor,at))+'</span>';
  out+='<span class="script-gap-wrap"><b class="script-gap-number">'+g.n+'</b><input class="script-gap-input" data-gap="'+g.q+'" autocomplete="off" aria-label="Part '+part+' gap '+g.n+'"><span class="script-gap-answer" data-gapresult="'+g.q+'"></span></span>';
  cursor=at+g.match.length;
 }
 return out+'<span data-script-source-start="'+cursor+'">'+escapeHtml(source.slice(cursor))+'</span>';
}
function renderScript(){
 stopAllAudio();
 const tabs=$('#scriptTabs');
 tabs.innerHTML=[1,2,3,4].map(p=>'<button class="btn '+(p===scriptPart?'active':'')+'" data-spart="'+p+'">Part '+p+'</button>').join('');
 $('[data-spart]').forEach(b=>b.onclick=()=>{scriptPart=Number(b.dataset.spart);renderScript()});
 setAudioPart(scriptPart,true);
 renderTrainer($('#scriptAudio'),0,9999);
 const gaps=DATA.script_completion.filter(g=>g.part===scriptPart);
 $('#scriptHost').innerHTML='<div class="panel"><h2>Part '+scriptPart+' · '+escapeHtml(DATA.sections[scriptPart-1])+'</h2><p>Complete the '+gaps.length+' listening transcript gaps, then check your work.</p><div class="transcript script-transcript">'+buildScriptTranscript(scriptPart)+'</div><div class="script-actions"><button class="btn primary" id="checkScriptPart">Check Part</button><button class="btn" id="retryGaps" disabled>Retry incorrect gaps</button><span id="scriptScore" aria-live="polite"></span></div></div>';
 $('#checkScriptPart').onclick=()=>{
  let correct=0;const wrong=[];
  for(const gap of gaps){
   const input=$('[data-gap="'+gap.q+'"]'),result=$('[data-gapresult="'+gap.q+'"]');
   if(!input||!result)continue;
   const ok=normalize(input.value)===normalize(gap.answer);
   input.dataset.ok=ok?'1':'0';input.classList.toggle('gap-ok',ok);input.classList.toggle('gap-bad',!ok);
   result.textContent=ok?'':'Correct: '+gap.answer;
   if(ok)correct++;else wrong.push(gap.q);
  }
  $('#scriptScore').textContent=correct+'/'+gaps.length+' correct';
  $('#retryGaps').disabled=wrong.length===0;$('#retryGaps').dataset.wrong=wrong.join(',');
 };
 $('#retryGaps').onclick=()=>{
  const list=($('#retryGaps').dataset.wrong||'').split(',').filter(Boolean);
  for(const id of list){const input=$('[data-gap="'+id+'"]'),result=$('[data-gapresult="'+id+'"]');if(!input||!result)continue;input.value='';input.dataset.ok='';input.classList.remove('gap-bad');result.textContent='';}
  $('#scriptScore').textContent='';$('#retryGaps').disabled=true;
 };
}

MCQ()}}
