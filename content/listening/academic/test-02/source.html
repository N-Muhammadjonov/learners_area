phy"],"25":["difficult"],"26":["discussion group"],"27":["not enough tutorials"],"28":["visiting student services"],"29":["17th of February","17 February","February 17","17th February"],"30":["senior advisor"],"31":["C"],"32":["A"],"33":["A"],"34":["C"],"35":["B"],"36":["B"],"37":["A"],"38":["B"],"39":["C"],"40":["A"]},"part_audio_boundaries":{"1":{"start":0.0,"end":351.0},"2":{"start":351.0,"end":700.0},"3":{"start":700.0,"end":1108.0},"4":{"start":1108.0,"end":1565.0}},"transcript":{"1":"SECTION 1 Questions 1-10 You will hear a telephone conversation between a man who wants to rent an apartment and an agent at a property rental service. Good morning, AA Property. Can I help you? Yes, good morning. I'm looking for an apartment to rent. OK. Is that here in Birmingham? That's right. Right. I'll just take some personal details if I may. So, if I can just take your name? Kevin Walker. Right. And can I have your present address, please? Well, we're staying with friends at present, so the address is 354 Forest Road. Is that Forest with one R? That's right. And that's in West Bromwich. I'm afraid I don't know the postcode. That's OK. And a contact phone number? 07817983602 . Lovely. And if I could just ask your occupation? Certainly. I'm a dentist and my wife's a teacher, but she's at home at present looking after the children. OK. So, I'll just put your occupation. Right. Well, now I'll take some details about the kind of property you're looking for. You said you're looking for an apartment, is that right? Yeah. OK. So, how many bedrooms do you want? Two. And did you want it furnished? No, unfurnished . Right. Well, that gives you quite a bit more choice, so that's good. And what's the maximum rent you'd be prepared to pay? Well, we'd like to stay under £600 if possible, but we could go up to £650 for the right place. Right. So, do you have any other definite requirements? Well, coming back to the bedrooms, they have to be doubles , both of them. OK. I'll make a note of that. So, are you looking for something straight away? I assume you are if you're staying with friends. Well, as soon as possible, yes. Well, it's October 17th today, so we're probably looking at November 1st at the earliest. Would that be OK? Well, I'd have preferred something in October, but OK, let's put that date down for now. Fine. Now, is there anything else you'd like? Well, our last flat had a garage, but actually, we never used it, so I'm not really worried about that. But we'd like a balcony if possible. It's nice not to be too shut in. Yes. You'll find most modern apartments do have one. It's only the converted properties that don't. But of course, if you're in an older property, you might have use of a garden . Would that be a possible alternative? Oh yes, either of those would be good. What about transport? Would you want off-street parking? No, parking doesn't matter, but it'd be good to have somewhere not too far from a station if possible. But it's not essential. I've got a bike. Right. And what else? You'll want a lounge, and will you want a separate dining room? Well, not really. We tend to eat in the kitchen, so it'd be good if that was large enough for us to do that. That might be difficult, but I'll make a note of it anyway. Right, well, let's have a look at what...","2":"SECTION 2 Questions 11-20 You will hear a local councillor giving advice on the radio about cleaning up after recent bad weather. Welcome to Radio OK, your community radio station. After our recent bad storm, we have Councillor Phil Evans joining us to tell us about the clean-up effort. Welcome, Phil. Hello. Thanks for having me. Well, we had some pretty severe weather at the weekend. Thankfully, it wasn't quite as bad as last year's storm. Although there was some damage to trees, it was definitely not on the same scale as last year, and we were expecting the river level to rise higher than it did. But having said that, a much larger number of homes have been damaged this year due to flash flooding near the creek. Those of you who have experienced flooding, we ask you to be especially careful. I know it's upsetting to see your home full of water, but please be patient, as there's nothing you can do until the river level drops, hopefully in two or three days. You won't have any electricity at the moment, but we are working as fast as we can to get it reconnected. When it comes to cleaning up your garden, you might be tempted to just throw dead branches and so on into your normal garbage bin. Please don't. We're asking people to simply stack them outside on the footpath ready for Council collection. We plan to cut them up and use them for composting. For those of you who don't have cooking facilities at the moment, I'm afraid we won't be able to deliver hot meals to your home like the community centre did last year. Instead, we'll be issuing vouchers that you can use to get food from any of the nominated restaurants . Just come to the Council office to collect them. We've had an overwhelming number of people offering to help out. Anyone who would like to volunteer, please don't call the Council office directly. Instead, if you're available to help clean up, just turn up at the community centre by 8am tomorrow and you'll be given the necessary tools and assigned a task by the Council Work Supervisor. As the water level goes down, we may discover more problems. We'll be assessing the drinking water regularly so that there's no risk of contamination. Just be aware that local wildlife can be forced out of their natural habitat in this weather. Let the Council know of any unusual sightings so we can safely relocate them. It may seem that mosquitoes are around in abundance right now, but the actual population is usual for this time of year. Now we'll give you some information about key areas in the town. The school escaped any real problems and we'll be using its car park and some of the classrooms to coordinate the clean up. Because of that, the Principal is asking for volunteers to assist in getting the classrooms set back up again with the desks back in their proper places before the new term begins after the holidays. The hospital is still fully functional and the only damage there was to the canteen where a tree branch broke a window . You can still access the area as normal, we just ask that you park at the rear of the hospital until the repair work has been completed. If you need to get to the shops, the High Street is still a little flooded so I'm afraid you'll have to collect your shopping on foot for a little while. Hopefully, it won't be long before you'll be able to drive there again. Before the storm, we had hoped to begin work on modernising the bikeway that runs along the river. We were particularly looking forward to having bike storage facilities installed. While the bikeway itself is okay, unfortunately the area around it is covered in water. So we've postponed our work there indefinitely and I'm afraid it's now unlikely that this will ever go ahead. Well, that's everything for now. I'll be back with a further update tomorrow.","3":"SECTION 3 Questions 21-30 You will hear a student talking to a tutor at her college about the possibility of changing her course. Ah, hello. Do come in. Thanks. I understand you wanted to see me about changing courses? Yes, that's right. Well, that's fine. Do sit down. Oh, thank you. Now, you're Sally Lehman? That's it. Right then, Sally. And what course are you doing at the present? It's Economic History . Uh-huh. And when did you start? Last September . Right, good. Now, of course, we'll have the chance to talk through any problems you've been having in a moment, but let me just make a note of what courses you might be interested in changing to. Well, there are several that I've thought about, but what I'd like to do most is Politics . Well, that is a very popular course. I know, and there might not be places, but… Sure, I'll certainly take a note of that. But what about another option? Well, I had thought of changing course completely and trying business studies, but then I realised it wasn't really me, so I thought of Philosophy . Right, well, that's useful to know, but if at all possible, it is good to talk through the problems you are having at the moment and see if there's any way we can help or that you can help yourself. After all, with all the effort that you've put in already, it would be a pity to have to start all over again. Oh no, I realise that. And actually, I would like to have a go at staying with Economic History. Good. Yeah, well, let's see. Let's talk through some of the problems you've been having. What would you say was your major difficulty on the course? I think I'd have to say the worst thing is that I find the lectures difficult . Aha. And how have you tried to overcome this? Well, I did try recording lectures, you know. Yes, that's a good idea. And did you find it helped? To a certain extent, but... Well, I would certainly continue with that strategy, but you might also like to try getting together with other fellow students to discuss lectures in what we call a discussion group . Yeah, I've heard of some of my course mates doing that. I could certainly ask if I could join. Good. I'm sure you'd find it a help. And any other problems? Well, this really worried me at the beginning. The fact that there are not enough tutorials . Not enough tutorials. Did you talk to your tutor about it? Yeah, that was what I thought was the best strategy. It's what all the student handbooks say. Yeah, and what was the outcome? Well, really, just that she's very busy and I have to fit in tutorials when she's available, which is really difficult. I agree. It must seem that way. Why don't you try arranging meetings in advance? Well, I can certainly give it a go. Yeah. But I suppose the thing that's been really upsetting me recently is my bad assignment grade. How many have you had back? Just the one. Well, you could say it was early days yet. Well, for the last assignment, which we've just handed in, I did more background reading. And did you feel that helped? Oh, yes, I think so. Well, another strategy might be visiting student services . They offer a lot of advice on assignment preparation. Well, I didn't want to bother them. That's their job. It'd be well worth trying. OK, I'll certainly look into that. Now, what I've done here is to keep a record of our discussions and suggested strategies. And what we normally do is to ask you to try out our suggestions for a while and then come back to discuss the situation, see whether it's improved. And if not, then we can start thinking seriously about those alternative courses. So you'd like me to come back? Yes. Let's say in a month's time. OK. That'd be on 17th of February at 3.30. Is that all right? Yeah, sure. And will I meet with you? I'm afraid I'll be on leave at that time. But I'll leave this record on file and you'll be meeting our senior advisor . Senior advisor. OK, fine. Lovely. Well, I do hope things improve, Sally, and that the change won't be necessary. And if it is, well, we can think about that later. OK? OK. Thanks very much.","4":"SECTION 4 Questions 31-40 You will hear a museum curator giving a presentation about her museum's collection of perfume containers, also known as perfume ornaments. Good morning and welcome to the Walden Gallery. In today's open lecture, I'm going to be talking about our collection of perfume ornaments, or containers. These beautiful objects now form a significant part of the museum's collection and are very popular with the public. But this has not always been the case. Up until relatively recently, the large collection of perfume ornaments held in store, donated by Lady Walden at the beginning of the last century, was not considered to be of much interest and was not on show to the general public. Then, as late as 1989, a visiting professor from the Victoria and Albert Museum commented that some of the objects were worth a great deal , and so the display was created, much as you see it here today. Now before I say anything more about the perfume containers, I thought I'd briefly touch on the background to the development of perfumes themselves. In the West, perfumery really began as late as the 11th century. Bathing and laundering were considered hazardous undertakings because even though there were ample supplies of water, it was often dirty or even infected. As a consequence, as you can imagine, the air was heavy with unpleasant smells, which had to be countered or covered up. In those early days, perfumes were in solid form and mainly made from spices, leaves, and animal fixatives in paste form, for example, musk and ambergris. Wealthy people, the only people who could afford them, carried small globular vessels known as pomanders. I've brought out one ornament from the collection, the oldest one, in fact, from the 14th century, which I'll pass around for you to sample. These pomanders are solid paste balls made of ambergris impregnated with fragrance. The name was derived from the French for apple of ambergris . They must have had a powerful aroma in those days because even now you can smell the fragrance. Now, during the mediaeval period, basically up until the 16th century, perfumes not only made your surroundings smell sweeter, they were believed to have other special properties. Researchers in the 19th century revealed that in mediaeval times, people thought perfumes could help overcome all kinds of bodily ills. But only recently, researchers at our museum have found that they were also believed to significantly raise the spirits of the wearer . Turning now to some more technical details, with the advent of liquid perfume from the mid-18th century, craftsmen had to use precision techniques to ensure there was an airtight seal on the container. It is clear that however beautiful these seemingly fragile objects were, they were essentially utilitarian, designed to stop the extremely valuable substances inside them from evaporating . Let's turn now to have a look at some of the key developments in perfume containers in the last 200 years or so. From the late 18th century onwards, the vinaigrette came into vogue. The vinaigrette was a miniature box which opened on a hinge, containing a tiny sponge soaked with perfume . This was placed under a grill through which you could smell the fragrance. It was widely used to carry the highly corrosive scent known as vinegar water, hence the name. The outer box could be made of any material, but the lining was gold because the perfume tended to corrode other substances. From the mid-19th century, vinaigrettes were replaced by more conventional bottles. They were often made of glass, of course, but metal was another common material used, and very occasionally they were made of more unusual materials like horn. By now these beautiful objects were more affordable . This was the age of the Industrial Revolution in Western Europe, and the bottles were mass-produced and thus available not just to the very wealthy. In the last quarter of the 19th century, one company above all became associated with the design and production of perfume bottles, the Tiffany Company. They developed a wide range of designs, most notably based on those of the furniture of the period. Their particular achievement was their stylish and clever working of crystal . Although these perfume ornaments were very expensive, Tiffany & Co. were able to use catalogues to reach a wider clientele. Many innovative designs were used in perfume ornaments produced in the 1920s and 30s. The most notable was probably the vanity. This was an ingeniously designed case used not only for holding perfume, but also makeup, in a whole maze of tiny additional compartments. It was made in the first instance of ivory, but later bakelite was used, the resinous plastic which was so popular with all kinds of designers of the period. Now, I've brought along a selection of the items in the collection which I've set out here. If you'd like to come and gather..."},"transcript_source":"source-supplied verbatim transcript from user-owned package","timestamps_source":"source package review evidence windows","script_completion":[{"q":1,"part":1,"n":1,"match":"at present","answer":"at present","lexical_type":"fixed expression"},{"q":2,"part":1,"n":2,"match":"quite a bit more choice","answer":"quite a bit more choice","lexical_type":"lexical chunk"},{"q":3,"part":1,"n":3,"match":"definite requirements","answer":"definite requirements","lexical_type":"collocation"},{"q":4,"part":1,"n":4,"match":"at the earliest","answer":"at the earliest","lexical_type":"fixed expression"},{"q":5,"part":1,"n":5,"match":"off-street parking","answer":"off-street parking","lexical_type":"noun phrase"},{"q":6,"part":1,"n":6,"match":"make a note of it","answer":"make a note of it","lexical_type":"fixed expression"},{"q":7,"part":2,"n":1,"match":"on the same scale","answer":"on the same scale","lexical_type":"fixed expression"},{"q":8,"part":2,"n":2,"match":"flash flooding","answer":"flash flooding","lexical_type":"collocation"},{"q":9,"part":2,"n":3,"match":"get it reconnected","answer":"get it reconnected","lexical_type":"verb phrase"},{"q":10,"part":2,"n":4,"match":"issuing vouchers","answer":"issuing vouchers","lexical_type":"verb-noun collocation"},{"q":11,"part":2,"n":5,"match":"risk of contamination","answer":"risk of contamination","lexical_type":"collocation"},{"q":12,"part":2,"n":6,"match":"fully functional","answer":"fully functional","lexical_type":"adjective phrase"},{"q":13,"part":2,"n":7,"match":"postponed our work there indefinitely","answer":"postponed our work there indefinitely","lexical_type":"verb-adverb collocation"},{"q":14,"part":3,"n":1,"match":"talk through","answer":"talk through","lexical_type":"phrasal verb"},{"q":15,"part":3,"n":2,"match":"start all over again","answer":"start all over again" const TRANSCRIPTS={"1": "\n<strong>SECTION 1<\/strong><br/><br/>\n            Questions 1-10<br/><br/>\n            You will hear a telephone conversation between a man who wants to rent an apartment and an agent at a property rental service.<br/><br/>\n            Good morning, AA Property. Can I help you? Yes, good morning.<br/>\n            I'm looking for an apartment to rent. OK. Is that here in Birmingham? That's right.<br/>\n            Right. I'll just take some personal details if I may. So, if I can just take your name? Kevin Walker.<br/>\n            Right. And can I have your present address, please? Well, we're staying with friends at present, so the address is <span class=\"highlight\">354 Forest<\/span> Road. Is that Forest with one R? That's right.<br/>\n            And that's in West Bromwich. I'm afraid I don't know the postcode. That's OK.<br/>\n            And a contact phone number? <span class=\"highlight\">07817983602<\/span>. Lovely. And if I could just ask your occupation? Certainly.<br/>\n            I'm a <span class=\"highlight\">dentist<\/span> and my wife's a teacher, but she's at home at present looking after the children. OK. So, I'll just put your occupation.<br/>\n            Right. Well, now I'll take some details about the kind of property you're looking for. You said you're looking for an apartment, is that right? Yeah.<br/>\n            OK. So, how many bedrooms do you want? Two. And did you want it furnished? No, <span class=\"highlight\">unfurnished<\/span>.<br/>\n            Right. Well, that gives you quite a bit more choice, so that's good. And what's the maximum rent you'd be prepared to pay? Well, we'd like to stay under £600 if possible, but we could go up to £650 for the right place.<br/>\n            Right. So, do you have any other definite requirements? Well, coming back to the bedrooms, they have to be <span class=\"highlight\">doubles<\/span>, both of them. OK.<br/>\n            I'll make a note of that. So, are you looking for something straight away? I assume you are if you're staying with friends. Well, as soon as possible, yes. Well, it's October 17th today, so we're probably looking at <span class=\"highlight\">November 1st<\/span> at the earliest.<br/>\n            Would that be OK? Well, I'd have preferred something in October, but OK, let's put that date down for now. Fine. Now, is there anything else you'd like? Well, our last flat had a garage, but actually, we never used it, so I'm not really worried about that.<br/>\n            But we'd like a <span class=\"highlight\">balcony<\/span> if possible. It's nice not to be too shut in. Yes.<br/>\n            You'll find most modern apartments do have one. It's only the converted properties that don't. But of course, if you're in an older property, you might have use of a <span class=\"highlight\">garden<\/span>.<br/>\n            Would that be a possible alternative? Oh yes, either of those would be good. What about transport? Would you want off-street parking? No, parking doesn't matter, but it'd be good to have somewhere not too far from a <span class=\"highlight\">station<\/span> if possible. But it's not essential.<br/>\n            I've got a bike. Right. And what else? You'll want a lounge, and will you want a separate dining room? Well, not really.<br/>\n            We tend to eat in the kitchen, so it'd be good if that was large enough for us to do that. That might be difficult, but I'll make a note of it anyway. Right, well, let's have a look at what...\n        ", "2": "\n<strong>SECTION 2<\/strong><br/><br/>\n            Questions 11-20<br/><br/>\n            You will hear a local councillor giving advice on the radio about cleaning up after recent bad weather.<br/><br/>\n            Welcome to Radio OK, your community radio station. After our recent bad storm, we have Councillor Phil Evans joining us to tell us about the clean-up effort.<br/>\n            Welcome, Phil. Hello. Thanks for having me.<br/>\n            Well, we had some pretty severe weather at the weekend. Thankfully, it wasn't quite as bad as last year's storm. Although there was some damage to trees, it was definitely not on the same scale as last year, and we were expecting the river level to rise higher than it did.<br/>\n            But having said that, a <span class=\"highlight\">much larger number of homes have been damaged this year<\/span> due to flash flooding near the creek. Those of you who have experienced flooding, we ask you to be especially careful. I know it's upsetting to see your home full of water, but please be patient, as there's nothing you can do until the river level drops, hopefully in two or three days.<br/>\n            You won't have any electricity at the moment, but we are working as fast as we can to get it reconnected. When it comes to cleaning up your garden, you might be tempted to just throw dead branches and so on into your normal garbage bin. Please don't.<br/>\n            We're asking people to simply <span class=\"highlight\">stack them outside on the footpath<\/span> ready for Council collection. We plan to cut them up and use them for composting. For those of you who don't have cooking facilities at the moment, I'm afraid we won't be able to deliver hot meals to your home like the community centre did last year.<br/>\n            Instead, we'll be <span class=\"highlight\">issuing vouchers that you can use to get food from any of the nominated restaurants<\/span>. Just come to the Council office to collect them. We've had an overwhelming number of people offering to help out.<br/>\n            Anyone who would like to volunteer, please don't call the Council office directly. Instead, if you're available to help clean up, just <span class=\"highlight\">turn up at the community centre by 8am tomorrow<\/span> and you'll be given the necessary tools and assigned a task by the Council Work Supervisor. As the water level goes down, we may discover more problems.<br/>\n            We'll be assessing the drinking water regularly so that there's no risk of contamination. Just be aware that <span class=\"highlight\">local wildlife can be forced out of their natural habitat<\/span> in this weather. Let the Council know of any unusual sightings so we can safely relocate them.<br/>\n            It may seem that mosquitoes are around in abundance right now, but the actual population is usual for this time of year. Now we'll give you some information about key areas in the town.<br/>\n            The school escaped any real problems and we'll be using its car park and some of the classrooms to coordinate the clean up. Because of that, the Principal is asking for <span class=\"highlight\">volunteers to assist in getting the classrooms set back up again with the desks back in their proper places<\/span> before the new term begins after the holidays. The hospital is still fully functional and the only damage there was to the canteen where a tree branch <span class=\"highlight\">broke a window<\/span>.<br/>\n            You can still access the area as normal, we just ask that you park at the rear of the hospital until the repair work has been completed. If you need to get to the shops, the High Street is still a little flooded so I'm afraid <span class=\"highlight\">you'll have to collect your shopping on foot<\/span> for a little while. Hopefully, it won't be long before you'll be able to drive there again.<br/>\n            Before the storm, we had hoped to begin work on modernising the bikeway that runs along the river. We were particularly looking forward to having bike storage facilities installed. While the bikeway itself is okay, unfortunately the area around it is covered in water.<br/>\n            So we've <span class=\"highlight\">postponed our work there indefinitely<\/span> and I'm afraid it's now unlikely that this will ever go ahead. Well, that's everything for now. I'll be back with a further update tomorrow.\n        ", "3": "\n<strong>SECTION 3<\/strong><br/><br/>\n            Questions 21-30<br/><br/>\n            You will hear a student talking to a tutor at her college about the possibility of changing her course.<br/><br/>\n            Ah, hello. Do come in. Thanks.<br/>\n            I understand you wanted to see me about changing courses? Yes, that's right. Well, that's fine. Do sit down.<br/>\n            Oh, thank you. Now, you're Sally Lehman? That's it. Right then, Sally.<br/>\n            And what course are you doing at the present? It's <span class=\"highlight\">Economic History<\/span>. Uh-huh. And when did you start? <span class=\"highlight\">Last September<\/span>.<br/>\n            Right, good. Now, of course, we'll have the chance to talk through any problems you've been having in a moment, but let me just make a note of what courses you might be interested in changing to. Well, there are several that I've thought about, but what I'd like to do most is <span class=\"highlight\">Politics<\/span>.<br/>\n            Well, that is a very popular course. I know, and there might not be places, but… Sure, I'll certainly take a note of that. But what about another option? Well, I had thought of changing course completely and trying business studies, but then I realised it wasn't really me, so I thought of <span class=\"highlight\">Philosophy<\/span>.<br/>\n            Right, well, that's useful to know, but if at all possible, it is good to talk through the problems you are having at the moment and see if there's any way we can help or that you can help yourself. After all, with all the effort that you've put in already, it would be a pity to have to start all over again.<br/>\n            Oh no, I realise that. And actually, I would like to have a go at staying with Economic History. Good.<br/>\n            Yeah, well, let's see. Let's talk through some of the problems you've been having. What would you say was your major difficulty on the course? I think I'd have to say the worst thing is that I find the lectures <span class=\"highlight\">difficult<\/span>.<br/>\n            Aha. And how have you tried to overcome this? Well, I did try recording lectures, you know. Yes, that's a good idea.<br/>\n            And did you find it helped? To a certain extent, but... Well, I would certainly continue with that strategy, but you might also like to try getting together with other fellow students to discuss lectures in what we call a <span class=\"highlight\">discussion group<\/span>. Yeah, I've heard of some of my course mates doing that. I could certainly ask if I could join.<br/>\n            Good. I'm sure you'd find it a help. And any other problems? Well, this really worried me at the beginning.<br/>\n            The fact that there are <span class=\"highlight\">not enough tutorials<\/span>. Not enough tutorials. Did you talk to your tutor about it? Yeah, that was what I thought was the best strategy.<br/>\n            It's what all the student handbooks say. Yeah, and what was the outcome? Well, really, just that she's very busy and I have to fit in tutorials when she's available, which is really difficult. I agree.<br/>\n            It must seem that way. Why don't you try arranging meetings in advance? Well, I can certainly give it a go. Yeah.<br/>\n            But I suppose the thing that's been really upsetting me recently is my bad assignment grade. How many have you had back? Just the one. Well, you could say it was early days yet.<br/>\n            Well, for the last assignment, which we've just handed in, I did more background reading. And did you feel that helped? Oh, yes, I think so. Well, another strategy might be <span class=\"highlight\">visiting student services<\/span>.<br/>\n            They offer a lot of advice on assignment preparation. Well, I didn't want to bother them. That's their job.<br/>\n            It'd be well worth trying. OK, I'll certainly look into that. Now, what I've done here is to keep a record of our discussions and suggested strategies.<br/>\n            And what we normally do is to ask you to try out our suggestions for a while and then come back to discuss the situation, see whether it's improved. And if not, then we can start thinking seriously about those alternative courses. So you'd like me to come back? Yes.<br/>\n            Let's say in a month's time. OK. That'd be on <span class=\"highlight\">17th of February<\/span> at 3.30. Is that all right? Yeah, sure.<br/>\n            And will I meet with you? I'm afraid I'll be on leave at that time. But I'll leave this record on file and you'll be meeting our <span class=\"highlight\">senior advisor<\/span>. Senior advisor.<br/>\n            OK, fine. Lovely. Well, I do hope things improve, Sally, and that the change won't be necessary.<br/>\n            And if it is, well, we can think about that later. OK? OK. Thanks very much.\n        ", "4": "\n<strong>SECTION 4<\/strong><br/><br/>\n            Questions 31-40<br/><br/>\n            You will hear a museum curator giving a presentation about her museum's collection of perfume containers, also known as perfume ornaments.<br/><br/>\n            Good morning and welcome to the Walden Gallery. In today's open lecture, I'm going to be talking about our collection of perfume ornaments, or containers. These beautiful objects now form a significant part of the museum's collection and are very popular with the public. But this has not always been the case.<br/>\n            Up until relatively recently, the large collection of perfume ornaments held in store, donated by Lady Walden at the beginning of the last century, was not considered to be of much interest and was not on show to the general public. Then, as late as 1989, a <span class=\"highlight\">visiting professor from the Victoria and Albert Museum commented that some of the objects were worth a great deal<\/span>, and so the display was created, much as you see it here today. Now before I say anything more about the perfume containers, I thought I'd briefly touch on the background to the development of perfumes themselves.<br/>\n            In the West, perfumery really began as late as the 11th century. <span class=\"highlight\">Bathing and laundering were considered hazardous undertakings<\/span> because even though there were ample supplies of water, it was often dirty or even infected. As a consequence, as you can imagine, the air was heavy with unpleasant smells, which had to be countered or covered up.<br/>\n            In those early days, perfumes were in solid form and mainly made from spices, leaves, and animal fixatives in paste form, for example, musk and ambergris. Wealthy people, the only people who could afford them, carried small globular vessels known as pomanders. I've brought out one ornament from the collection, the oldest one, in fact, from the 14th century, which I'll pass around for you to sample.<br/>\n            These pomanders are solid paste balls made of ambergris impregnated with fragrance. The name was derived from <span class=\"highlight\">the French for apple of ambergris<\/span>. They must have had a powerful aroma in those days because even now you can smell the fragrance.<br/>\n            Now, during the mediaeval period, basically up until the 16th century, perfumes not only made your surroundings smell sweeter, they were believed to have other special properties. Researchers in the 19th century revealed that in mediaeval times, people thought perfumes could help overcome all kinds of bodily ills. But only recently, researchers at our museum have found that they were also believed to <span class=\"highlight\">significantly raise the spirits of the wearer<\/span>.<br/>\n            Turning now to some more technical details, with the advent of liquid perfume from the mid-18th century, craftsmen had to use precision techniques to ensure there was an airtight seal on the container. It is clear that however beautiful these seemingly fragile objects were, they were essentially utilitarian, designed to stop the extremely valuable substances inside them from <span class=\"highlight\">evaporating<\/span>. Let's turn now to have a look at some of the key developments in perfume containers in the last 200 years or so.<br/>\n            From the late 18th century onwards, the vinaigrette came into vogue. The vinaigrette was a miniature box which opened on a hinge, containing a tiny sponge <span class=\"highlight\">soaked with perfume<\/span>. This was placed under a grill through which you could smell the fragrance.<br/>\n            It was widely used to carry the highly corrosive scent known as vinegar water, hence the name. The outer box could be made of any material, but <span class=\"highlight\">the lining was gold<\/span> because the perfume tended to corrode other substances. From the mid-19th century, vinaigrettes were replaced by more conventional bottles.<br/>\n            They were often made of glass, of course, but metal was another common material used, and very occasionally they were made of more unusual materials like horn. By now these beautiful objects were <span class=\"highlight\">more affordable<\/span>. This was the age of the Industrial Revolution in Western Europe, and the bottles were mass-produced and thus available not just to the very wealthy.<br/>\n            In the last quarter of the 19th century, one company above all became associated with the design and production of perfume bottles, the Tiffany Company. They developed a wide range of designs, most notably based on those of the furniture of the period. Their particular achievement was their <span class=\"highlight\">stylish and clever working of crystal<\/span>.<br/>\n            Although these perfume ornaments were very expensive, Tiffany & Co. were able to use catalogues to reach a wider clientele. Many innovative designs were used in perfume ornaments produced in the 1920s and 30s.<br/>\n            The most notable was probably the vanity. This was an ingeniously designed case used not only for holding perfume, but also makeup, in a whole maze of tiny additional compartments. It was made in the first instance of ivory, but later bakelite was used, the resinous plastic which was so popular with all kinds of designers of the period.<br/>\n            Now, I've brought along a selection of the items in the collection which I've set out here. If you'd like to come and gather...\n        "};

function playWindow(start,end,button){const a=$('#sharedAudio');if(button&&!button.dataset.idleLabel)button.dataset.idleLabel=button.textContent;const same=activeClip&&activeClip.start===start&&activeClip.end===end&&activeClip.button===button;if(same&&!a.paused){a.pause();return}if(!same){stopActiveClip();a.pause();a.currentTime=start;const ctl={start,end,button,onTime:null,onEnd:null,onPause:null};ctl.onTime=()=>{if(a.currentTime>=end){a.pause();a.currentTime=end;stopActiveClip()}};ctl.onEnd=()=>stopActiveClip();ctl.onPause=()=>{if(activeClip===ctl&&button){button.textContent=button.dataset.idleLabel;button.classList.remove('clip-playing')}};activeClip=ctl;a.addEventListener('timeupdate',ctl.onTime);a.addEventListener('ended',ctl.onEnd);a.addEventListener('pause',ctl.onPause)}else if(a.currentTime<start||a.currentTime>=end)a.currentTime=start;if(button){button.textContent='⏸ Pause';button.classList.add('clip-playing')}const p=a.play();if(p&&p.catch)p.catch(()=>{resetClipButton(button);toast('Audio could not start')})}

let scriptPart=1;
function buildScriptTranscript(part){const gaps=DATA.script_completion.filter(x=>x.part===part).sort((a,b)=>a.n-b.n);const source=DATA.transcript[String(part)]||'';let cursor=0,out='';for(const g of gaps){const at=source.indexOf(g.match,cursor);if(at<0)continue;out+=escapeHtml(source.slice(cursor,at));out+=`<span class="script-gap-wrap"><b class="script-gap-number">${g.n}</b><input class="script-gap-input" data-gap="${g.q}" autocomplete="off" aria-label="Part ${part} gap ${g.n}" placeholder=""><span class="script-gap-answer" data-gapresult="${g.q}"></span></span>`;cursor=at+g.match.length}out+=escapeHtml(source.slice(cursor));return out}
function renderScript(){stopAllAudio();const tabs=$('#scriptTabs');tabs.innerHTML=[1,2,3,4].map(p=>`<button class="btn ${p===scriptPart?'active':''}" data-spart="${p}">Part ${p}</button>`).join('');$$('[data-spart]').forEach(b=>b.onclick=()=>{scriptPart=Number(b.dataset.spart);renderScript()});const boundary=DATA.part_audio_boundaries[String(scriptPart)];renderTrainer($('#scriptAudio'),boundary.start,boundary.end);const rows=DATA.script_completion.filter(x=>x.part===scriptPart).sort((a,b)=>a.n-b.n);$('#scriptHost').innerHTML=`<div class="panel"><h2>Part ${scriptPart} · ${escapeHtml(DATA.sections[scriptPart-1])}</h2><p class="script-part-note">Listen to this Part only. Complete the ${rows.length} numbered gaps with the exact high-value expressions you hear. The rest of the source transcript is shown in full.</p><div class="transcript script-transcript">${buildScriptTranscript(scriptPart)}</div><div class="script-actions"><button class="btn primary" id="checkScriptPart">Check</button><button class="btn violet" id="retryGaps">Retry incorrect gaps</button><span class="script-score" id="scriptScore"></span></div></div>`;$('#checkScriptPart').onclick=()=>{let correct=0;for(const g of rows){const inp=$(`[data-gap="${g.q}"]`),res=$(`[data-gapresult="${g.q}"]`);const ok=normalize(inp.value)===normalize(g.answer);inp.dataset.ok=ok?'1':'0';inp.classList.toggle('gap-ok',ok);inp.classList.toggle('gap-bad',!ok);res.textContent=ok?'':`→ ${g.answer}`;res.classList.toggle('show',!ok);if(ok)correct++}$('#scriptScore').textContent=`${correct}/${rows.length} correct`};$('#retryGaps').onclick=()=>{let first=null;for(const g of rows){const inp=$(`[data-gap="${g.q}"]`),res=$(`[data-gapresult="${g.q}"]`);if(inp.dataset.ok==='0'){inp.value='';inp.dataset.ok='';inp.classList.remove('gap-bad');res.textContent='';res.classList.remove('show');if(!first)first=inp}}$('#scriptScore').textContent='';if(first)first.focus()}}
/* MCQ Mastery */
let mcqIndex=0,mcqStage=1,mcqSelected='';
const MCQS=Object.values(DATA.questions).filter(d=>d.options&&d.options.length);
function renderMCQ(){stopActiveClip();const d=MCQS[mcqIndex%MCQS.length];let h=`<div class="practice-card"><div class="muted">MCQ ${mcqIndex+1} / ${MCQS.length}</div><h2>Q${d.q}. ${escapeHtml(d.prompt)}</h2><p><b>Step 1 - Own answer.</b> Listen to the evidence window and write what you think the answer means before seeing options.</p><button class="btn" onclick="playWindow(${d.timeStart},${d.timeEnd},this)">▶ Listen to evidence window</button><textarea id="mcqPrediction" style="width:100%;min-height:80px;margin:10px 0;padding:10px" placeholder="Your prediction / notes"></textarea><button class="btn primary" id="revealMcq">${mcqStage===1?'Save prediction & reveal options':'Options revealed'}</button>`;if(mcqStage>=2)h+=`<h3>Step 2 - Choose the official option</h3><div class="practice-options">${d.options.map(o=>`<button class="practice-option ${mcqSelected===o.code?'selected':''}" data-mcqopt="${o.code}">${escapeHtml(o.text)}</button>`).join('')}</div><button class="btn primary" id="checkMcq" ${mcqSelected?'':'disabled'}>Check option</button>`;if(mcqStage>=3)h+=`<div class="feedback"><b>Correct option: ${d.answer}</b><br><br><b>Evidence:</b> ${escapeHtml(d.evidence)}<br><b>Why correct:</b> ${escapeHtml(d.why)}<br><b>Distractor analysis:</b> ${escapeHtml(d.trap)}</div>`;h+=`<div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn" id="mcqPrev">← Previous</button><button class="btn" id="mcqNext">Next →</button></div></div>`;$('#mcqHost').innerHTML=h;$('#revealMcq').onclick=()=>{if(!$('#mcqPrediction').value.trim())return toast('Write a prediction first');mcqStage=2;renderMCQ()};$$('[data-mcqopt]').forEach(b=>b.onclick=()=>{mcqSelected=b.dataset.mcqopt;renderMCQ()});if($('#checkMcq'))$('#checkMcq').onclick=()=>{mcqStage=3;renderMCQ()};$('#mcqPrev').onclick=()=>{mcqIndex=(mcqIndex-1+MCQS.length)%MCQS.length;mcqStage=1;mcqSelected='';renderMCQ()};$('#mcqNext').onclick=()=>{mcqIndex=(mcqIndex+1)%MCQS.length;mcqStage=1;mcqSelected='';renderMCQ()}}
/* Matching Mastery */
let matchingIndex=0;
function renderMatching(){stopActiveClip();const qs=[17,18,19,20],q=qs[matchingIndex%4],d=DATA.questions[String(q)];const opts=[['A',"It can't be reached by car."],['B','Repairs are now finished.'],['C','Planned work has been cancelled.'],['D','Help is needed to move furniture.'],['E','New equipment will be bought.'],['F','Part of the building is damaged.']];$('#matchingHost').innerHTML=`<div class="practice-card"><div class="muted">Matching ${matchingIndex+1}/4</div><h2>Q${q}. ${escapeHtml(d.prompt)}</h2><button class="btn" onclick="playWindow(${d.timeStart},${d.timeEnd},this)">▶ Short evidence clip</button><div class="practice-options">${opts.map(o=>`<button class="practice-option" data-matchopt="${o[0]}"><b>${o[0]}</b> ${escapeHtml(o[1])}</button>`).join('')}</div><div id="matchFeedback"></div><div style="display:flex;justify-content:space-between"><button class="btn" id="matchPrev">← Previous</button><button class="btn" id="matchNext">Next →</button></div></div>`;$$('[data-matchopt]').forEach(b=>b.onclick=()=>{$$('[data-matchopt]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const ok=b.dataset.matchopt===d.answer;$('#matchFeedback').innerHTML=`<div class="feedback"><b class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</b><br><b>Correct:</b> ${d.answer}<br><b>Evidence:</b> ${escapeHtml(d.evidence)}</div>`});$('#matchPrev').onclick=()=>{matchingIndex=(matchingIndex+3)%4;renderMatching()};$('#matchNext').onclick=()=>{matchingIndex=(matchingIndex+1)%4;renderMatching()}}
/* Completion Mastery */
let completionIndex=0;
const COMPLETION_Q=[...Array.from({length:10},(_,i)=>i+1),...Array.from({length:10},(_,i)=>i+21)];
function expectedType(q){if([2].includes(q))return 'a telephone number';if([6,22,29].includes(q))return 'a date / time reference';if([21,23,24].includes(q))return 'a course or subject name';return 'a word or short phrase'}
function renderCompletion(){stopActiveClip();const q=COMPLETION_Q[completionIndex%COMPLETION_Q.length],d=DATA.questions[String(q)];$('#completionHost').innerHTML=`<div class="practice-card"><div class="muted">Completion ${completionIndex+1}/${COMPLETION_Q.length}</div><h2>Q${q}. ${escapeHtml(d.prompt)}</h2><p><b>1. Predict:</b> This gap needs ${expectedType(q)}.</p><p><b>2. Word limit:</b> ${q<=10?'ONE WORD AND/OR A NUMBER':'NO MORE THAN THREE WORDS AND/OR A NUMBER'}.</p><button class="btn" onclick="playWindow(${d.timeStart},${d.timeEnd},this)">▶ Listen to short clip</button><div style="margin:12px 0"><input id="completionAnswer" style="width:min(420px,100%);padding:10px;border:1px solid #cfd4dd;border-radius:8px" placeholder="Type your answer"><button class="btn primary" id="completionCheck">Check</button></div><div id="completionFeedback"></div><div style="display:flex;justify-content:space-between"><button class="btn" id="compPrev">← Previous</button><button class="btn" id="compNext">Next →</button></div></div>`;$('#completionCheck').onclick=()=>{const v=$('#completionAnswer').value,ok=answerOk(q,v);$('#completionFeedback').innerHTML=`<div class="feedback"><b class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</b><br><b>Correct:</b> ${escapeHtml(d.answer)}<br><b>Evidence:</b> ${escapeHtml(d.evidence)}<br><b>Why:</b> ${escapeHtml(d.why)}</div>`};$('#compPrev').onclick=()=>{completionIndex=(completionIndex-1+COMPLETION_Q.length)%COMPLETION_Q.length;renderCompletion()};$('#compNext').onclick=()=>{completionIndex=(completionIndex+1)%COMPLETION_Q.length;renderCompletion()}}
/* Vocabulary */
function renderVocab(){renderVocabStudy();$('#vStudyBtn').onclick=()=>{$('#vStudyBtn').classList.add('active');$('#vPracticeBtn').classList.remove('active');renderVocabStudy()};$('#vPracticeBtn').onclick=()=>{$('#vPracticeBtn').classList.add('active');$('#vStudyBtn').classList.remove('active');renderVocabPractice()}}
function renderVocabStudy(){const saved=new Set((getStored().vocab||[]));$('#vocabHost').innerHTML=`<div class="vocab-grid">${DATA.vocabulary.map(v=>`<article class="vocab-card"><div class="vocab-word">${escapeHtml(v.headword)}</div><div class="vocab-meta">${escapeHtml(v.type)}</div><p>${escapeHtml(v.definition)}</p><p><b>UZ:</b> ${escapeHtml(v.uzbek)}</p><div class="vocab-context"><b>Listening context:</b> ${escapeHtml(v.context)}</div><p><b>Collocations:</b> ${v.collocations.map(escapeHtml).join(', ')}</p><p><b>Paraphrases:</b> ${v.paraphrases.map(escapeHtml).join(', ')}</p><button class="btn" onclick="pronounce('${v.headword.replaceAll("'","\\'")}')">🔊 Pronounce</button> <button class="btn" onclick="saveWord('${v.headword.replaceAll("'","\\'")}')">${saved.has(v.headword)?'Saved':'＋ Vocabulary'}</button></article>`).join('')}</div>`}
function pronounce(w){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-GB';speechSynthesis.speak(u)}}
function saveWord(w){const o=getStored();o.vocab=o.vocab||[];if(!o.vocab.includes(w))o.vocab.push(w);try{localStorage.setItem(STORAGE_KEY,JSON.stringify(o))}catch(e){}toast('Saved to Vocabulary');renderVocabStudy()}
function renderVocabPractice(){let score=0,idx=0;const items=[...DATA.vocabulary].sort(()=>.5-Math.random()).slice(0,10);function one(){if(idx>=items.length){$('#vocabHost').innerHTML=`<div class="panel"><h2>Vocabulary Practice</h2><p>Score: <b>${score}/${items.length}</b></p><button class="btn primary" id="againV">Practice again</button></div>`;$('#againV').onclick=renderVocabPractice;return}const v=items[idx],wrong=DATA.vocabulary.filter(x=>x.headword!==v.headword).sort(()=>.5-Math.random()).slice(0,3),opts=[v,...wrong].sort(()=>.5-Math.random());$('#vocabHost').innerHTML=`<div class="practice-card"><div class="muted">${idx+1}/${items.length}</div><h2>${escapeHtml(v.definition)}</h2><p>Which word matches this definition?</p><div class="practice-options">${opts.map(o=>`<button class="practice-option" data-vopt="${escapeHtml(o.headword)}">${escapeHtml(o.headword)}</button>`).join('')}</div></div>`;$$('[data-vopt]').forEach(b=>b.onclick=()=>{if(b.dataset.vopt===v.headword)score++;idx++;one()})}one()}
function getNotes(){try{return JSON.parse(sessionStorage.getItem(NOTES_KEY)||'{}')}catch{return {}}}
function setNotes(notes){try{sessionStorage.setItem(NOTES_KEY,JSON.stringify(notes))}catch(e){}}
function syncNotePanel(){const notes=getNotes(),q=String(state.currentQ);$('#noteQuestionLabel').textContent=`Question ${q}`;$('#noteTextarea').value=notes[q]||'';$('#noteSaved').textContent=notes[q]?'Saved for this session':''}
function openNotes(){syncNotePanel();$('#noteModal').classList.remove('hidden');setTimeout(()=>$('#noteTextarea').focus(),20)}
function saveCurrentNote(){const notes=getNotes(),q=String(state.currentQ),v=$('#noteTextarea').value.trim();if(v)notes[q]=v;else delete notes[q];setNotes(notes);$('#noteSaved').textContent=v?'Saved for this session':'Note cleared';updateNav()}
function closeNotes(){const m=$('#noteModal');if(!m||m.classList.contains('hidden'))return;saveCurrentNote();m.classList.add('hidden')}
function clearCurrentNote(){$('#noteTextarea').value='';saveCurrentNote()}

/* Retry */
function renderRetry(){if(!state.results.length){const o=getStored();state.results=o.lastResults||[];state.attemptStatus=o.attemptStatus||'none'}if(!state.results.length){$('#retryHost').innerHTML='<div class="panel"><b>No attempt data yet.</b><p>Start the Full IELTS Test. If you submit it or leave it early, unanswered and incorrect questions will appear here.</p></div>';return}const wrong=state.results.filter(r=>!r.ok);if(!wrong.length){$('#retryHost').innerHTML='<div class="panel"><b>No weak questions in the latest attempt.</b><p>Your latest attempt was 40/40.</p></div>';return}const status=state.attemptStatus==='exited'?'Latest attempt was exited early. Unanswered and incorrect questions are included.':'Missed and unanswered questions from your latest submitted attempt.';$('#retryHost').innerHTML=`<div class="panel"><b>${wrong.length} question(s) to retry</b><p class="muted">${status}</p>${wrong.map(r=>{const d=DATA.questions[String(r.q)];return `<div class="retry-item"><span><b>Q${r.q}</b> ${escapeHtml(d.prompt)}</span><button class="btn" data-retryq="${r.q}">Retry</button></div>`}).join('')}</div><div id="retryPractice"></div>`;$$('[data-retryq]').forEach(b=>b.onclick=()=>retryQuestion(Number(b.dataset.retryq)))}
function retryQuestion(q){stopActiveClip();const d=DATA.questions[String(q)],opts=d.options||[];let body=`<div class="practice-card"><h2>Q${q}. ${escapeHtml(d.prompt)}</h2><button class="btn" onclick="playWindow(${d.timeStart},${d.timeEnd},this)">▶ Listen</button>`;if(opts.length)body+=`<div class="practice-options">${opts.map(o=>`<button class="practice-option" data-rchoice="${o.code}">${escapeHtml(o.text)}</button>`).join('')}</div>`;else body+=`<div style="margin:12px 0"><input id="retryInput" style="padding:10px;border:1px solid #ccc;border-radius:8px"><button class="btn primary" id="retryCheck">Check</button></div>`;body+='<div id="retryFeedback"></div></div>';$('#retryPractice').innerHTML=body;if(opts.length)$$('[data-rchoice]').forEach(b=>b.onclick=()=>showRetryFeedback(q,b.dataset.rchoice));else $('#retryCheck').onclick=()=>showRetryFeedback(q,$('#retryInput').value)}
function showRetryFeedback(q,v){const d=DATA.questions[String(q)],ok=answerOk(q,v);$('#retryFeedback').innerHTML=`<div class="feedback"><b class="${ok?'ok':'bad'}">${ok?'Correct':'Incorrect'}</b><br><b>Correct:</b> ${escapeHtml(d.answer)}<br><b>Evidence:</b> ${escapeHtml(d.evidence)}</div>`}
/* Event wiring */
loadStored();buildActivities();renderHub();
$('#startTestBtn').onclick=startExam;$('#volumeSlider').oninput=e=>$('#sharedAudio').volume=Number(e.target.value);$('#flagBtn').onclick=toggleFlag;$('#notesBtn').onclick=openNotes;$('#closeNotesBtn').onclick=closeNotes;$('#doneNotesBtn').onclick=closeNotes;$('#clearNoteBtn').onclick=clearCurrentNote;$('#noteTextarea').oninput=saveCurrentNote;$('#noteModal').addEventListener('click',e=>{if(e.target.id==='noteModal')closeNotes()});$('#fullscreenBtn').onclick=()=>{const p=document.fullscreenElement?document.exitFullscreen():$('#examRoot').requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Fullscreen is not available'))};$('#optionsBtn').onclick=openOptions;$('#submitTest').onclick=()=>submitExam(false);$('#highlightBtn').onclick=highlightSelection;$('#removeHighlightBtn').onclick=removeHighlights;window.addEventListener('pagehide',()=>{stopAllAudio();try{sessionStorage.removeItem(NOTES_KEY)}catch(e){}});
// Support direct activity links in ZIP wrappers/hash
const hash=location.hash.replace('#','');if(ACTIVITIES.some(a=>a[0]===hash))setTimeout(()=>openActivity(hash),50);
</script></body></html>
