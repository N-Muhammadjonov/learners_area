<h1>Listening Test 1</h1><script>const D = {"questions": [{"number": 1, "section": 1, "text": "Jim’s weekly rent will be $  [Q1]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "80", "alternatives": ["eighty"], "pair": [], "evidence": {"at": 150.0, "why": "Peter explains the price depends on the room: “I have the large bedroom, so I pay $110 a week. Yours is $80 , because it’s a bit smaller.” 110 is what Peter pays for the big room, and 100 was the rent at Jim’s last place, so neither is the answer."}}, {"number": 2, "section": 1, "text": "Jim can park his car in the  [Q2]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "garage", "alternatives": [], "pair": [], "evidence": {"at": 174.0, "why": "When Jim asks where he can leave the car, Peter says “you’re lucky, because this house has a garage .” The street is “zoned no parking” and the back lane is too narrow, so those two are ruled out on purpose."}}, {"number": 3, "section": 1, "text": "The telephone is in the  [Q3]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "kitchen", "alternatives": [], "pair": [], "evidence": {"at": 199.0, "why": "Peter answers “Yeah, it’s in the kitchen . It was in the living room, but it was hard to hear over the television.” The living room is where the phone used to be, and Jim only says he did not see one in the hall."}}, {"number": 4, "section": 1, "text": "Jim will bring a  [Q4]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "heater", "alternatives": [], "pair": [], "evidence": {"at": 218.0, "why": "Peter warns that the room gets cold “and it doesn’t have a heater ,” and Jim replies “My friend has just given me one, so I’ll bring that,” where “one” means a heater. The cupboard and desk are already in the room, so Jim does not need to bring those."}}, {"number": 5, "section": 1, "text": "for his bedroom. Peter would like Jim to bring a  [Q5]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "toaster", "alternatives": [], "pair": [], "evidence": {"at": 237.0, "why": "Peter lists what they already own and then asks: “it would be great if you had a toaster . Mine’s just broken.” The microwave and the rice cooker are things the house already has, so they are not what Peter wants."}}, {"number": 6, "section": 1, "text": "Peter and Jim will probably watch TV on  [Q6]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "Friday evening", "alternatives": [], "pair": [], "evidence": {"at": 279.0, "why": "Jim says “I usually watch the game on TV on Friday evening ,” and Peter answers “Me too, so that’s good.” Tuesday and Thursday come up a moment later, but those are Jim’s work nights, not TV nights."}}, {"number": 7, "section": 1, "text": "Jim works in a  [Q7]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "supermarket", "alternatives": [], "pair": [], "evidence": {"at": 288.0, "why": "Jim says “I work at the supermarket on Tuesday and Thursday nights,” which is the “twice a week” on the question paper. Do not write the days here, because the gap needs the place."}}, {"number": 8, "section": 1, "text": "twice a week. Peter will share the cost of  [Q8]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "petrol", "alternatives": [], "pair": [], "evidence": {"at": 299.0, "why": "Because both men have afternoon lectures, Peter suggests “You could give me a lift. We can share the petrol .” Shopping is mentioned just before, but that is Jim doing the shopping, not a shared cost."}}, {"number": 9, "section": 1, "text": "with Jim. Peter wants Jim to move in by  [Q9]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "1 June", "alternatives": ["1st June", "1st of June", "1st of june", "June 1", "June 1st", "the 1st of June"], "pair": [], "evidence": {"at": 307.0, "why": "Peter sets the deadline himself: “I need someone by the 1st of June when the new rent period starts.” “Next week” belongs to Jim’s exam, not to the move-in date Peter wants."}}, {"number": 10, "section": 1, "text": "Jim agrees to move in after his  [Q10]", "instruction": "Questions 1–10 Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "exam", "alternatives": [], "pair": [], "evidence": {"at": 319.0, "why": "Jim finishes with “I’ve got an exam next week, so I’ll move in after that if that’s OK.” “After that” points back to the exam, which is what the gap is asking for."}}, {"number": 11, "section": 2, "text": "11. The school day starts at  [Q11]  with registration, and finishes at 4 p.m.", "instruction": "Questions 11–17 Complete the sentences. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "8:55", "alternatives": ["8.55", "8.55 a.m.", "8.55am", "8:55 a.m.", "8:55am"], "pair": [], "evidence": {"at": 457.0, "why": "The speaker says “the bell is rung for everybody to go to their classrooms at 8.55 so that we can take the register”, so registration starts then. The earlier times, “between 8.45 and 8.50”, are only when children arrive at school, not when the day starts."}}, {"number": 12, "section": 2, "text": "12. The school canteen offers a  [Q12]  for lunch.", "instruction": "Questions 11–17 Complete the sentences. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "hot meal", "alternatives": [], "pair": [], "evidence": {"at": 487.0, "why": "About the canteen she says children can “bring their own packed lunch or a hot meal is available”, so the canteen is the one offering the hot meal. “Packed lunch” is the option families bring themselves, so it is not what the canteen offers."}}, {"number": 13, "section": 2, "text": "13. The morning and afternoon breaks each last for  [Q13]", "instruction": "Questions 11–17 Complete the sentences. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "15 minutes", "alternatives": ["15 min", "fifteen min", "fifteen minutes"], "pair": [], "evidence": {"at": 500.0, "why": "She says “in the middle of the morning and the middle of the afternoon there are two breaks of 15 minutes ”, so each break is that long. The “two” is the number of breaks, and the “hour for lunch” mentioned just before belongs to lunchtime."}}, {"number": 14, "section": 2, "text": "14. On Thursday afternoons all children must take part in  [Q14]", "instruction": "Questions 11–17 Complete the sentences. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "sports", "alternatives": ["sport"], "pair": [], "evidence": {"at": 520.0, "why": "For Thursdays she says “rather than continuing with lessons we expect the whole school to do sports ”, and “the whole school” tells you it is compulsory for all children. “Lessons” is what does not happen on that afternoon, so it is the wrong word to write."}}, {"number": 15, "section": 2, "text": "15. Every term the children do a special  [Q15]", "instruction": "Questions 11–17 Complete the sentences. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "poster", "alternatives": [], "pair": [], "evidence": {"at": 543.0, "why": "She explains that “for each of the three terms they are expected to produce a poster ”, which is the special piece of work done every term. “The environment” is only an example of a topic a poster might be about, not the thing they produce."}}, {"number": 16, "section": 2, "text": "16. The children are given tests each  [Q16]", "instruction": "Questions 11–17 Complete the sentences. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "month", "alternatives": [], "pair": [], "evidence": {"at": 562.0, "why": "She says “every month rather than the teacher giving the children a report … they have to do tests”, so the tests happen monthly. “Over the year” refers to how long performance is recorded, and “report” is what this school does not do."}}, {"number": 17, "section": 2, "text": "17. The children can go to  [Q17]  after school to learn new skills such as music.", "instruction": "Questions 11–17 Complete the sentences. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.", "options": [], "key": "clubs", "alternatives": [], "pair": [], "evidence": {"at": 582.0, "why": "At the end of the school day “many of them have set up clubs that the children go to for an extra hour to learn a new skill such as music”, which matches learning new skills after school. “Lessons” is wrong here because these are voluntary after-school groups."}}, {"number": 18, "section": 2, "text": "Label 18 on the supplied map (A–G)", "instruction": "Questions 18–20 Label the map. Choose the correct letter, A–G , for each label. Spring Down Junior School — Floor Plan", "options": ["A Music room", "B Assembly hall", "C Computer room", "D Cloakroom", "E Head’s office", "F Gym", "G Reception"], "key": "E", "alternatives": [], "pair": [], "evidence": {"at": 642.0, "why": "Start at the main entrance and look to your right: she says “on the right where you would normally expect to find reception you’ll see the head’s office”, so that position is the Head’s office . Reception is the trap, because she names it only to say it is what you would expect there but is not."}}, {"number": 19, "section": 2, "text": "Label 19 on the supplied map (A–G)", "instruction": "Questions 18–20 Label the map. Choose the correct letter, A–G , for each label. Spring Down Junior School — Floor Plan", "options": ["A Music room", "B Assembly hall", "C Computer room", "D Cloakroom", "E Head’s office", "F Gym", "G Reception"], "key": "A", "alternatives": [], "pair": [], "evidence": {"at": 680.0, "why": "Move past the entrance to the classrooms and look to their left: “On the left of the classrooms we have converted one of the old cloak rooms to create a music room .” Cloakroom is wrong because it is what the room used to be, and the computer room is only a plan for inside the library."}}, {"number": 20, "section": 2, "text": "Label 20 on the supplied map (A–G)", "instruction": "Questions 18–20 Label the map. Choose the correct letter, A–G , for each label. Spring Down Junior School — Floor Plan", "options": ["A Music room", "B Assembly hall", "C Computer room", "D Cloakroom", "E Head’s office", "F Gym", "G Reception"], "key": "F", "alternatives": [], "pair": [], "evidence": {"at": 714.0, "why": "Walk through the new main hall and look at the room next door: the old assembly hall, “which as you can see has now been turned into a gym for the children”. Assembly hall is wrong because that is the room’s old name, and the new hall you are standing in is the main hall."}}, {"number": 21, "section": 3, "text": "What do the students agree about defining forensic linguistics?", "instruction": "Questions 21–24 Choose the correct answer Forensic Linguistics", "options": ["A The dictionary definition was not very useful", "B They could provide an example of the kind of work involved.", "C They should read about the subject to see how it is described."], "key": "B", "alternatives": [], "pair": [], "evidence": {"at": 870.0, "why": "After the definition is agreed, one of them says they can add what forensic linguists really do to back it up, “ like analysing documents to find out who wrote them ”, and the other replies “Good point. Let’s do that.” Option A tempts you because a dictionary is mentioned, but the dictionary gave “something similar”, so neither student says it was unhelpful ( B )."}}, {"number": 22, "section": 3, "text": "Jen thinks it will be difficult to analyse the voice recording because", "instruction": "Questions 21–24 Choose the correct answer Forensic Linguistics", "options": ["A it is not of good quality.", "B the accent is difficult to understand.", "C she doesn’t know if the speaker is male or female."], "key": "A", "alternatives": [], "pair": [], "evidence": {"at": 906.0, "why": "Jen says “Where we’re really going to get in trouble is that the recording is very unclear .” C looks right because she does say she cannot tell if it is a man or a woman, but she immediately adds “I guess that doesn’t matter”, and about the local accent she says “I’m not sure how that will affect anything” ( A )."}}, {"number": 23, "section": 3, "text": "Why does Jen think that the ‘suspect’ might vary their voice patterns?", "instruction": "Questions 21–24 Choose the correct answer Forensic Linguistics", "options": ["A because they’re being recorded.", "B because they’ve been told to.", "C because they feel uncomfortable about their accent."], "key": "B", "alternatives": [], "pair": [], "evidence": {"at": 948.0, "why": "Jen says the suspect might speak with another accent “ because the tutor suggests they do that just to test us”. A is tempting because the word recording is everywhere and she earlier says the poor sound was done “to test us”, but that was about the sample they were given, not about why the person would change their voice ( B )."}}, {"number": 24, "section": 3, "text": "What does Rob think about Jen’s approach to study?", "instruction": "Questions 21–24 Choose the correct answer Forensic Linguistics", "options": ["A She worries too much about her ability.", "B She often ignores the most important issues.", "C She has trouble getting started."], "key": "A", "alternatives": [], "pair": [], "evidence": {"at": 953.0, "why": "Rob tells her “don’t start your usual self-doubt about whether you can do the work or not. You usually do okay in the end.” C is the trap, since Jen admits she creates things to worry about “before I’ve even started”, but that is Jen describing her worrying, not Rob saying she cannot begin, and B is killed by her plan to “focus on the main points” ( A )."}}, {"number": 25, "section": 3, "text": "Choose TWO correct answers.", "instruction": "Questions 25–26", "options": ["A Voice Identification", "B Modern Forensic Techniques", "C Language and Crime", "D Forensics Today", "E Research Methods in Forensic Linguistics"], "key": "B", "alternatives": [], "pair": [26], "evidence": {"at": 1042.0, "why": "About Research methods in forensic linguistics they say “ I guess we ought to borrow that ”. Language and crime sounds promising, but that one is already out of the library, so it is not on the list of books still to get ( E )."}}, {"number": 26, "section": 3, "text": "Choose TWO correct answers.", "instruction": "Questions 25–26", "options": ["A Voice Identification", "B Modern Forensic Techniques", "C Language and Crime", "D Forensics Today", "E Research Methods in Forensic Linguistics"], "key": "E", "alternatives": [], "pair": [25], "evidence": {"at": 1052.0, "why": "“But we should get out modern forensic techniques. We need all the help we can get on that subject.” Voice identification is called useful, but it comes from their classmate George rather than the library, and Forensics today they “needn’t bother with” ( B )."}}, {"number": 27, "section": 3, "text": "Choose TWO correct answers.", "instruction": "Questions 27–28", "options": ["A how much time they have for writing up the project", "B being able to do enough research", "C only speaking to the ‘suspect’ once", "D using recording equipment", "E how easy it will be to contact the ‘suspect’"], "key": "A", "alternatives": [], "pair": [28], "evidence": {"at": 1065.0, "why": "“I’m not sure about how we’re going to record the voices. I’m not too good on the technical side of things ,” and the other agrees “Me neither.” C tempts people who hear the word once, but they actually say “At least we get more than one opportunity to speak to the person playing the suspect”, so that is good news, not a worry ( D )."}}, {"number": 28, "section": 3, "text": "Choose TWO correct answers.", "instruction": "Questions 27–28", "options": ["A how much time they have for writing up the project", "B being able to do enough research", "C only speaking to the ‘suspect’ once", "D using recording equipment", "E how easy it will be to contact the ‘suspect’"], "key": "D", "alternatives": [], "pair": [27], "evidence": {"at": 1086.0, "why": "“ I’m more worried about fitting in the writing up . We’ve got loads of other assignments to finish as well.” B is the trap because research is mentioned right before, but there it is “as long as we do our research properly, it shouldn’t be too hard”, which is confidence and not concern ( A )."}}, {"number": 29, "section": 3, "text": "Choose TWO correct answers.", "instruction": "Questions 29–30", "options": ["A Methodology", "B Literature review", "C Introduction", "D Analysis", "E Discussion and conclusions"], "key": "C", "alternatives": [], "pair": [30], "evidence": {"at": 1098.0, "why": "Jen asks Rob “Are you any good at introductions? They always seem to let me down,” and he answers “ Okay, leave that to me .” Watch the trap with the literature review: Jen says “ Maybe we should split that part ”, so that one is shared, not Rob’s alone ( C )."}}, {"number": 30, "section": 3, "text": "Choose TWO correct answers.", "instruction": "Questions 29–30", "options": ["A Methodology", "B Literature review", "C Introduction", "D Analysis", "E Discussion and conclusions"], "key": "E", "alternatives": [], "pair": [29], "evidence": {"at": 1110.0, "why": "Jen says “I don’t mind writing the methodology section if you feel comfortable doing the discussion and conclusions ”, so methodology is hers and this part is Rob’s. The analysis is not an answer either, because “we can do the analysis between us ” ( E )."}}, {"number": 31, "section": 4, "text": "• save available  [Q31]", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "resources", "alternatives": [], "pair": [], "evidence": {"at": 1256.0, "why": "The definition sentence says organisms become dormant when “they need to conserve the resources available to them”, so “save available” on your paper is a simpler way of saying conserve the available resources. The words right after, “reduce their demands on their environment”, are already printed as the second bullet."}}, {"number": 32, "section": 4, "text": "can live in conditions which are environmentally  [Q32]", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "stressful", "alternatives": [], "pair": [], "evidence": {"at": 1280.0, "why": "Animals that can go dormant “can survive conditions which are stressful in environmental terms”, and the note flips that phrase into “environmentally stressful”. Do not jump at “inhospitable” a few lines later, because that word belongs to the next point about living in a larger range of places."}}, {"number": 33, "section": 4, "text": "have less  [Q33]  from other animals", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "competition", "alternatives": [], "pair": [], "evidence": {"at": 1322.0, "why": "The lecturer says that when these creatures are active and hunting, “the amount of competition they have to deal with from other creatures is greatly reduced”, so “less” matches greatly reduced and “other animals” matches other creatures. The word “food” comes immediately before in “looking for food”, but that is what they are searching for, not what there is less of."}}, {"number": 34, "section": 4, "text": "changes in temperature and  [Q34]", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "light", "alternatives": [], "pair": [], "evidence": {"at": 1337.0, "why": "The most significant variables are “changes in temperature and the amount of light organisms get”, so with ONE WORD ONLY you write light and drop “the amount of”. “Food, water and oxygen” follows straight after, but that is the next bullet, already printed for you."}}, {"number": 35, "section": 4, "text": "There may be a  [Q35]  in their metabolism (diapause)", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "reduction", "alternatives": [], "pair": [], "evidence": {"at": 1366.0, "why": "You hear “Insects can experience a reduction in their metabolism, which is a form of dormancy called diapause”, so the gap before “in their metabolism” takes reduction. “Diapause” is said in the same sentence, but the note already gives it in brackets."}}, {"number": 36, "section": 4, "text": "It buries itself in the  [Q36]  and creates a slimy cocoon", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "mud", "alternatives": [], "pair": [], "evidence": {"at": 1417.0, "why": "When water runs low “the African lungfish burrows deep into the mud ”, and “buries itself in” on the paper is another way of saying burrows deep into. The next sentence mentions slime and a cocoon, but the note already prints “creates a slimy cocoon”."}}, {"number": 37, "section": 4, "text": "Two dangers:  [Q37]  and desiccation", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "starvation", "alternatives": [], "pair": [], "evidence": {"at": 1433.0, "why": "The two dangers are introduced clearly: “One is the possibility of starvation ”, and the other one, desiccation, is already printed on the paper. Be careful with “fat”, which comes right after, since stored fat is how the fish solves the problem, not the danger itself."}}, {"number": 38, "section": 4, "text": "Light-coloured shells reflect sunlight and limit  [Q38]  Hibernation", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "evaporation", "alternatives": [], "pair": [], "evidence": {"at": 1468.0, "why": "The snails outside are recognised by “a rather brightly colored shell reflecting the sunlight and so minimizing evaporation ”, where the note’s “light-coloured” matches brightly colored and “limit” matches minimizing. “Sunlight” is said in the very same phrase, but that word is already in the note before the gap."}}, {"number": 39, "section": 4, "text": "It hibernates in an insulated, underground  [Q39]", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "nest", "alternatives": [], "pair": [], "evidence": {"at": 1529.0, "why": "The recording says “This squirrel digs underground and builds a nest that is insulated”, and the note simply puts both describing words in front of the noun. “Ball” appears in the next sentence about curling up, but that is the squirrel’s body position, not the place it hibernates in."}}, {"number": 40, "section": 4, "text": "When it wakes up, the first part of the body to heat up is the  [Q40]", "instruction": "Questions 31–40 Complete the notes below. Write ONE WORD ONLY for each answer.", "options": [], "key": "heart", "alternatives": [], "pair": [], "evidence": {"at": 1573.0, "why": "During waking up, “The area around the heart warms more quickly than the rest of the animal”, and warming more quickly than the rest is exactly what the note calls the first part of the body to heat up. “Heartbeat” and “circulation” are mentioned one sentence earlier, but only one word is allowed."}}], "sections": [{"number": 1, "title": "Jim — shared house conversation", "transcript": "", "reviewRequired": true}, {"number": 2, "title": "Spring Down Junior School", "transcript": "", "reviewRequired": true}, {"number": 3, "title": "Forensic Linguistics", "transcript": "", "reviewRequired": true}, {"number": 4, "title": "Dormancy", "transcript": "", "reviewRequired": true}], "vocab": [{"part": 1, "word": "reasonable", "type": "adjective", "uz": "maqbul; o‘rinli", "def": "fair or acceptable, especially in price or judgement", "source": "The rent’s reasonable.", "also": ["a reasonable price", "fair", "acceptable"]}, {"part": 1, "word": "give someone a lift", "type": "collocation", "uz": "kimnidir mashinada olib borib qo‘ymoq", "def": "to take someone somewhere in your car", "source": "You could give me a lift.", "also": ["give someone a ride", "drive someone somewhere"]}, {"part": 1, "word": "a bit", "type": "adverb phrase", "uz": "biroz", "def": "slightly; to a small degree", "source": "Yours is $80, because it’s a bit smaller.", "also": ["slightly", "a little"]}, {"part": 1, "word": "move in", "type": "phrasal verb", "uz": "yangi joyga ko‘chib kirmoq", "def": "to begin living in a new home", "source": "I’ll move in after that if that’s OK.", "also": ["move into a flat", "move into a house"]}, {"part": 2, "word": "take the register", "type": "collocation", "uz": "davomatni qayd etmoq", "def": "to record which students are present", "source": "…so that we can take the register.", "also": ["mark attendance", "check attendance"]}, {"part": 2, "word": "packed lunch", "type": "noun phrase", "uz": "uydan olib kelingan tushlik", "def": "a meal prepared at home and carried with you", "source": "Children can bring their own packed lunch.", "also": ["bring a packed lunch", "lunch box"]}, {"part": 2, "word": "do sports", "type": "collocation", "uz": "sport bilan shug‘ullanmoq", "def": "to participate in sporting activity", "source": "We expect the whole school to do sports.", "also": ["play sports", "take part in sports"]}, {"part": 2, "word": "set up a club", "type": "collocation", "uz": "to‘garak tashkil qilmoq", "def": "to create and organise a club", "source": "Many of them have set up clubs.", "also": ["start a club", "establish a club"]}, {"part": 2, "word": "turn into", "type": "phrasal verb", "uz": "…ga aylantirmoq", "def": "to change something into a different form or use", "source": "The old assembly hall has now been turned into a gym.", "also": ["convert into", "transform into"]}, {"part": 3, "word": "self-doubt", "type": "noun", "uz": "o‘ziga ishonchsizlik", "def": "a feeling that you may not be capable enough", "source": "Don’t start your usual self-doubt.", "also": ["lack of confidence", "doubt yourself"]}, {"part": 3, "word": "focus on the main points", "type": "collocation", "uz": "asosiy nuqtalarga e’tibor qaratmoq", "def": "to concentrate on the most important ideas", "source": "She plans to focus on the main points.", "also": ["concentrate on key points", "prioritise the main ideas"]}, {"part": 3, "word": "fit something in", "type": "phrasal verb", "uz": "band jadvalda bir ishga vaqt topmoq", "def": "to find time for something in a busy schedule", "source": "I’m more worried about fitting in the writing up.", "also": ["make time for", "squeeze something in"]}, {"part": 3, "word": "split the work", "type": "collocation", "uz": "ishni bo‘lib olish", "def": "to divide work between two or more people", "source": "Maybe we should split that part.", "also": ["divide the work", "share the task"]}, {"part": 3, "word": "feel comfortable doing something", "type": "pattern / collocation", "uz": "bir ishni qilishga o‘zini ishonchli his qilmoq", "def": "to feel confident and at ease doing something", "source": "If you feel comfortable doing the discussion and conclusions…", "also": ["feel confident doing", "be happy to do"]}, {"part": 4, "word": "conserve resources", "type": "collocation", "uz": "resurslarni tejamoq; asramoq", "def": "to use resources carefully so they are not wasted", "source": "…conserve the resources available to them.", "also": ["save resources", "preserve resources"]}, {"part": 4, "word": "reduce demands on", "type": "collocation", "uz": "…ga tushadigan talab yoki bosimni kamaytirmoq", "def": "to lower the pressure or resources required from something", "source": "…reduce their demands on their environment.", "also": ["put less pressure on", "lower demand on"]}, {"part": 4, "word": "deal with competition", "type": "collocation", "uz": "raqobat bilan kurashmoq / unga duch kelmoq", "def": "to manage or face competition", "source": "…the amount of competition they have to deal with…", "also": ["face competition", "cope with competition"]}, {"part": 4, "word": "a reduction in", "type": "collocation", "uz": "…ning kamayishi", "def": "a decrease in the amount, size or level of something", "source": "Insects can experience a reduction in their metabolism.", "also": ["a decrease in", "a fall in"]}, {"part": 3, "word": "back something up", "type": "phrasal verb", "uz": "fikrni dalil yoki misol bilan mustahkamlamoq", "def": "to support an idea or claim with evidence or an example", "source": "They can add an example to back it up.", "also": ["support with evidence", "substantiate"]}, {"part": 4, "word": "burrow into", "type": "verb phrase", "uz": "kovlab ichiga kirib bormoq", "def": "to dig into something and move or hide inside it", "source": "The African lungfish burrows deep into the mud.", "also": ["dig into", "burrow deep into"]}], "mcq": [{"id": "21", "n": "21", "question": "What do the students agree about defining forensic linguistics?", "options": ["A The dictionary definition was not very useful", "B They could provide an example of the kind of work involved.", "C They should read about the subject to see how it is described."], "correct": ["B"], "start": 865, "end": 883, "why": "After the definition is agreed, one of them says they can add what forensic linguists really do to back it up, “ like analysing documents to find out who wrote them ”, and the other replies “Good point. Let’s do that.” Option A tempts you because a dictionary is mentioned, but the dictionary gave “something similar”, so neither student says it was unhelpful ( B )."}, {"id": "22", "n": "22", "question": "Jen thinks it will be difficult to analyse the voice recording because", "options": ["A it is not of good quality.", "B the accent is difficult to understand.", "C she doesn’t know if the speaker is male or female."], "correct": ["A"], "start": 900, "end": 919, "why": "Jen says “Where we’re really going to get in trouble is that the recording is very unclear .” C looks right because she does say she cannot tell if it is a man or a woman, but she immediately adds “I guess that doesn’t matter”, and about the local accent she says “I’m not sure how that will affect anything” ( A )."}, {"id": "23", "n": "23", "question": "Why does Jen think that the ‘suspect’ might vary their voice patterns?", "options": ["A because they’re being recorded.", "B because they’ve been told to.", "C because they feel uncomfortable about their accent."], "correct": ["B"], "start": 942, "end": 960, "why": "Jen says the suspect might speak with another accent “ because the tutor suggests they do that just to test us”. A is tempting because the word recording is everywhere and she earlier says the poor sound was done “to test us”, but that was about the sample they were given, not about why the person would change their voice ( B )."}, {"id": "24", "n": "24", "question": "What does Rob think about Jen’s approach to study?", "options": ["A She worries too much about her ability.", "B She often ignores the most important issues.", "C She has trouble getting started."], "correct": ["A"], "start": 950, "end": 969, "why": "Rob tells her “don’t start your usual self-doubt about whether you can do the work or not. You usually do okay in the end.” C is the trap, since Jen admits she creates things to worry about “before I’ve even started”, but that is Jen describing her worrying, not Rob saying she cannot begin, and B is killed by her plan to “focus on the main points” ( A )."}, {"id": "25–26", "n": "25–26", "question": "Which TWO books do the students decide they should get?", "options": ["A Voice Identification", "B Modern Forensic Techniques", "C Language and Crime", "D Forensics Today", "E Research Methods in Forensic Linguistics"], "correct": ["B", "E"], "start": 1037, "end": 1059, "why": "About Research methods in forensic linguistics they say “ I guess we ought to borrow that ”. Language and crime sounds promising, but that one is already out of the library, so it is not on the list of books still to get ( E ). “But we should get out modern forensic techniques. We need all the help we can get on that subject.” Voice identification is called useful, but it comes from their classmate George rather than the library, and Forensics today they “needn’t bother with” ( B )."}, {"id": "27–28", "n": "27–28", "question": "Which TWO aspects of the project are the students worried about?", "options": ["A how much time they have for writing up the project", "B being able to do enough research", "C only speaking to the ‘suspect’ once", "D using recording equipment", "E how easy it will be to contact the ‘suspect’"], "correct": ["A", "D"], "start": 1060, "end": 1095, "why": "“I’m not sure about how we’re going to record the voices. I’m not too good on the technical side of things ,” and the other agrees “Me neither.” C tempts people who hear the word once, but they actually say “At least we get more than one opportunity to speak to the person playing the suspect”, so that is good news, not a worry ( D ). “ I’m more worried about fitting in the writing up . We’ve got loads of other assignments to finish as well.” B is the trap because research is mentioned right before, but there it is “as long as we do our research properly, it shouldn’t be too hard”, which is confidence and not concern ( A )."}, {"id": "29–30", "n": "29–30", "question": "Which TWO sections of the assignment does Rob agree to write?", "options": ["A Methodology", "B Literature review", "C Introduction", "D Analysis", "E Discussion and conclusions"], "correct": ["C", "E"], "start": 1094, "end": 1117, "why": "Jen asks Rob “Are you any good at introductions? They always seem to let me down,” and he answers “ Okay, leave that to me .” Watch the trap with the literature review: Jen says “ Maybe we should split that part ”, so that one is shared, not Rob’s alone ( C ). Jen says “I don’t mind writing the methodology section if you feel comfortable doing the discussion and conclusions ”, so methodology is hers and this part is Rob’s. The analysis is not an answer either, because “we can do the analysis between us ” ( E )."}], "partRanges": {"1": [0.0, 365.64], "2": [365.64, 792.12], "3": [792.12, 1187.05], "4": [1187.05, 1645.05]}, "focus": [{"part": 1, "title": "Shared house conversation", "points": ["rent and room details", "house facilities and what Jim should bring", "weekly routines, shared travel costs and move-in timing"]}, {"part": 2, "title": "Spring Down Junior School", "points": ["school timetable and lunch/break routines", "weekly activities and assessment", "school map / room locations"]}, {"part": 3, "title": "Forensic Linguistics", "points": ["definition and voice-recording analysis", "books/resources for the project", "project worries and division of writing tasks"]}, {"part": 4, "title": "Dormancy", "points": ["why organisms become dormant", "environmental triggers and survival strategies", "examples of dormancy and hibernation"]}], "scriptCompletion": [{"part": 1, "q": 2, "at": 171, "end": 182, "before": "Peter: “You’re lucky, because this house has a ", "answer": "garage", "after": ".”", "vocab": []}, {"part": 1, "q": 5, "at": 233, "end": 247, "before": "Peter: “It would be great if you had a ", "answer": "toaster", "after": ". Mine’s just broken.”", "vocab": []}, {"part": 1, "q": 6, "at": 274, "end": 286, "before": "Jim: “I usually watch the game on TV on ", "answer": "Friday e
