name: Telegram handoff regression checks

on:
  push:
    branches:
      - main
      - feature/telegram-access-bot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot test dependencies
        run: python -m pip install -r services/telegram-bot/requirements.txt
      - name: Compile bot
        run: python -m compileall -q services/telegram-bot
      - name: Run complete bot test suite
        working-directory: services/telegram-bot
        env:
          TELEGRAM_BOT_TOKEN: "123456:TestOnlyBotToken"
          BOT_SERVICE_SECRET: "test-only-bot-secret"
          INTERNAL_API_URL: "http://localhost:3000/api/internal/telegram"
          PUBLIC_SITE_URL: "https://learnersarea.uz"
        run: python -m pytest -q tests

  backend-handoff-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install backend dependencies and pytest
        run: python -m pip install -r services/backend/requirements.txt pytest pytest-asyncio
      - name: Compile backend
        run: python -m compileall -q services/backend/app
      - name: Run handoff and Telegram auth regression tests
        working-directory: services/backend
        run: python -m pytest -q tests/test_telegram_handoff.py tests/test_telegram_subscription_flow.py

  browser-catalog-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify source catalogue is current
        run: |
          node scripts/riwi-site-catalog.mjs
          git diff --exit-code -- services/backend/app/data/riwi_site_catalog.json
