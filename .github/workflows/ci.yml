name: Full stability regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coin_qa
          POSTGRES_PASSWORD: coin_qa_local
          POSTGRES_DB: coin_qa
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U coin_qa -d coin_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r services/backend/requirements-dev.txt pytest-timeout
      - name: Native recovery rehearsal tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
      - name: TypeScript and bounded validation contracts
        run: |
          npm run typecheck
          npm run test:validation
      - name: Dependency security gates
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r services/backend/requirements.txt
          npm audit --audit-level=high
      - run: python3 scripts/build_native_assets.py
      # FIN-13: the migration chain was never exercised by CI, which is how a content-repair
      # migration could abort it at 0094 without anyone noticing. Both paths run here:
      # the contract distinguishes a fresh install from an upgrade, and the runner applies
      # the real migrations against a real engine before any test does.
      - name: Migration contract (fresh install vs upgrade)
        run: npm run test:migrations
      - name: Migration runner + ASGI probes (embedded PostgreSQL)
        run: npm run backend:test:postgres
      - name: Rescue Queue browser journey with PostgreSQL
        run: |
          npm ci --prefix frontend/vanilla --no-audit --no-fund
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM_EXECUTABLE"
          cd services/backend
          python -m pytest -q -s --timeout=100 tests/rescue_browser_journey.py
      - name: Full backend suite
        working-directory: services/backend
        run: python -m pytest -q --timeout=90 -ra
      - name: Academy role screenshots with PostgreSQL
        env:
          ACADEMY_UX_STAGE: after
          ACADEMY_UX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM_EXECUTABLE"
          cd services/backend
          python -m pytest -q -s --timeout=220 tests/academy_ux_browser.py
      - name: Academy browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-ux-personas
          path: docs/verification/academy-ux/
          if-no-files-found: error
          retention-days: 30
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/vanilla/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend/vanilla
      - run: npm test
        working-directory: frontend/vanilla
      - name: Browser dependency security gate
        run: npm audit --audit-level=high
        working-directory: frontend/vanilla
      - name: Desktop and mobile motion parity in Chromium
        working-directory: frontend/vanilla
        run: |
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM_EXECUTABLE"
          node tests/browser-motion-parity.mjs
      - name: General Reading Check visibility and shared header in Chromium
        working-directory: frontend/vanilla
        run: |
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM_EXECUTABLE"
          node tests/phase1/preview-server.mjs --port 4173 > /tmp/reading-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:4173/ >/dev/null
          TEST_FILTER="Completion refresh" node tests/browser-reading-v45.mjs
