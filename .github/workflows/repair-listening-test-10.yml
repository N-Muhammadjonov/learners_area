name: Repair Listening Test 10 canonical source
on:
  push:
    branches:
      - fix/listening-retention-lexical-20261113
    paths:
      - scripts/repair-listening-test-10.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/listening-retention-lexical-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/listening-retention-lexical-20261113
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch original and packaged Test 10 source
        run: node scripts/repair-listening-test-10.mjs
      - name: Verify exact synchronized runtime checksums
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'services/backend/assets/listening/manifest.json').read_text())['entries']['test-10']
          source=(root/'content/listening/academic/test-10/source.html').read_bytes()
          runtime=(root/'services/backend/assets/listening/test-10.json').read_bytes()
          obj=json.loads(runtime)
          assert hashlib.sha256(source).hexdigest()==manifest['sourceSha256']
          assert hashlib.sha256(runtime).hexdigest()==manifest['runtimeSha256']
          assert len(runtime)==manifest['bytes']
          assert obj['files']['source.html'].encode()==source
          data=json.loads(source.decode().split('const DATA=',1)[1].split(';\n',1)[0])
          assert len(data['transcript']['1'])>1000
          assert len(data['transcript']['2'])>1000
          assert len(data['transcript']['4'])>1000
          assert len(data['transcript']['3'])>1000 and 'Professor North' in data['transcript']['3']
          assert len(data['script_completion'])==32
          print('source, runtime and checksums verified')
          PY
      - name: Commit only modified Test 10 source and checksums
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/listening/academic/test-10/source.html services/backend/assets/listening/test-10.json services/backend/assets/listening/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore Test 10 sourced transcript and audio controls"
            git push origin HEAD:fix/listening-retention-lexical-20261113
          fi
