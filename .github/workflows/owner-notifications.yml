name: Owner notifications regression

on:
  push:
    branches:
      - fix/owner-notifications-20261113
      - main
    paths:
      - services/backend/app/main.py
      - services/backend/app/notification_events.py
      - services/backend/app/support_reports_port.py
      - services/backend/tests/test_staff_notification_reconciliation.py
      - frontend/vanilla/modules/shell/notifications.js
      - frontend/vanilla/modules/notifications/page.js
      - frontend/vanilla/tests/notification-bell.test.mjs
      - .github/workflows/owner-notifications.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Staff notification reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r services/backend/requirements.txt pytest pytest-asyncio
      - name: Verify Python syntax
        run: python -m py_compile services/backend/app/main.py services/backend/app/notification_events.py services/backend/app/support_reports_port.py services/backend/tests/test_staff_notification_reconciliation.py
      - name: Test staff notifications and report submission
        working-directory: services/backend
        run: python -m pytest -q tests/test_staff_notification_reconciliation.py

  frontend:
    name: Bell refresh and inbox
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/vanilla/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend/vanilla --no-audit --no-fund
      - name: Verify JavaScript syntax
        run: |
          node --check frontend/vanilla/modules/shell/notifications.js
          node --check frontend/vanilla/modules/notifications/page.js
          node --check frontend/vanilla/tests/notification-bell.test.mjs
      - name: Run bell, inbox and routing regression tests
        working-directory: frontend/vanilla
        run: node --test tests/notification-bell.test.mjs tests/landing-plan-bridge.test.mjs
