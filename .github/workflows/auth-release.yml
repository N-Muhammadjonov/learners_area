name: Authentication release regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: auth-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-regression:
    name: unit-regression (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: learners_telegram_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full unit, authentication and security regression (shard ${{ matrix.shard }}/6)
        run: node --no-wasm-tier-up --conditions=react-server --import tsx --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/6 --test-timeout=300000 tests/*.test.ts
  auth-release:
    needs: unit-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: learners_telegram_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Authentication UI regression
        run: TSX_TSCONFIG_PATH=tests/ui/tsconfig.json node --import tsx --test tests/ui/auth-release.test.tsx tests/ui/part1-hotfix.test.tsx
      - run: npm run build
      - name: Production-build HTTP policy regression (no production database)
        run: node scripts/verify-auth-release-http.mjs
      - name: Native PostgreSQL Telegram authentication integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/learners_telegram_ci
        run: node scripts/verify-telegram-integration-http.mjs
  telegram-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/telegram-bot/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q
