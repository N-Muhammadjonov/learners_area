name: Reading and Listening lexical regression
on:
  push:
    branches:
      - fix/listening-retention-lexical-20261113
    paths:
      - '.github/workflows/reading-listening-lexical-qa.yml'
      - 'frontend/vanilla/**'
      - 'services/backend/app/**'
      - 'services/backend/tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r services/backend/requirements.txt pytest pytest-asyncio
      - name: Compile modified backend
        run: |
          python -m py_compile services/backend/app/retention_meaning.py services/backend/app/step21_meaning_access.py services/backend/app/step20_retention_transitions_port.py services/backend/app/listening_review_access.py services/backend/app/step21_listening_authored_reads.py
      - name: Run existing targeted regressions
        working-directory: services/backend
        run: python -m pytest -q tests/test_phase3_listening_gate.py tests/test_phase3_listening_visuals.py tests/test_reading_source_cd.py tests/test_retention_reference_recovery.py tests/test_public_seo.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/vanilla/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend/vanilla --no-audit --no-fund
      - name: Parse all modified JS
        run: |
          node --check frontend/vanilla/modules/reading/retention.js
          node --check frontend/vanilla/modules/reading/general-session.js
          node --check frontend/vanilla/modules/reading/source-layout.js
          node --check frontend/vanilla/modules/vocabulary/clickable-text.js
          node --check frontend/vanilla/modules/vocabulary/contextual-popover.js
          node --check frontend/vanilla/modules/listening/authored.js
      - name: Run lexical and source layout regressions
        working-directory: frontend/vanilla
        run: node --test tests/reading-source-cd.test.mjs tests/reading-interactions-v70.test.mjs tests/listening-script-occurrence-v44.test.mjs tests/listening-original-entry.test.mjs tests/listening-all-source-layouts.test.mjs tests/dictionary-interactions-v70.test.mjs
