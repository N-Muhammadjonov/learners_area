name: Telegram onboarding review QA
on:
  push:
    branches:
      - codex/telegram-onboarding-channels-20261011
  pull_request:
    branches:
      - feature/telegram-access-bot

jobs:
  python-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot requirements
        run: python -m pip install -r services/telegram-bot/requirements.txt
      - name: Compile Python handlers
        run: python -m compileall -q services/telegram-bot
      - name: Bot unit and security tests
        working-directory: services/telegram-bot
        env:
          TELEGRAM_BOT_TOKEN: test-only-token
          BOT_SERVICE_SECRET: test-only-secret
          INTERNAL_API_URL: http://localhost:3000/api/internal/telegram
        run: pytest -q tests/

  web-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install package dependencies
        run: npm ci
      - name: Typecheck Next.js and Telegram API
        run: npx tsc --noEmit
      - name: Verify staged admission flag semantics
        run: node --conditions=react-server --import tsx --test tests/telegram-access-gates.test.ts
      - name: Lint changed Telegram backend and auth code
        run: npx eslint src/lib/telegram/access-gates.ts src/lib/telegram/required-channels.ts src/lib/telegram/admission-bridge.ts src/lib/auth/telegram-exchange.ts src/lib/auth/telegram-only.ts src/lib/telegram/contacts.ts src/lib/telegram/directory.ts src/app/api/internal/telegram/contacts/phone/route.ts 'src/app/api/internal/telegram/contacts/[telegramUserId]/route.ts' src/app/api/internal/telegram/required-channels/route.ts src/app/api/auth/login/route.ts src/app/api/auth/register/route.ts src/app/api/auth/reset/request/route.ts src/app/api/auth/reset/confirm/route.ts src/app/api/auth/telegram/intent/exchange/route.ts src/components/auth/LoginForm.tsx src/app/login/page.tsx src/app/register/page.tsx tests/telegram-access-gates.test.ts --max-warnings=0
