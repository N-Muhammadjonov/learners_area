name: Repair Listening 08 transcript source
on:
  push:
    branches: [fix/listening-tests-7-11-lexical-20261114]
    paths: [scripts/repair-listening-test-08.mjs, .github/workflows/repair-listening-test-08.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/listening-tests-7-11-lexical-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore four full Test 8 transcripts and original audio trainer
        run: node scripts/repair-listening-test-08.mjs
      - name: Check source/runtime consistency and four parts
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          entry=json.loads((root/'services/backend/assets/listening/manifest.json').read_text())['entries']['test-08']
          source=(root/'content/listening/academic/test-08/source.html').read_bytes()
          runtime=(root/'services/backend/assets/listening/test-08.json').read_bytes()
          obj=json.loads(runtime)
          assert obj['files']['source.html'].encode()==source
          assert hashlib.sha256(source).hexdigest()==entry['sourceSha256']
          assert hashlib.sha256(runtime).hexdigest()==entry['runtimeSha256']
          assert len(runtime)==entry['bytes']
          data=json.loads(source.decode().split('const DATA=',1)[1].split(';\n',1)[0])
          assert len(data['script_completion'])==34
          assert all(len(data['transcript'][str(n)])>=2500 for n in range(1,5))
          assert "activityShell('script'" in source.decode()
          print('Test 8 restored: four audio-derived transcripts, 34 contextual exercises')
          PY
      - name: Commit source and packaged runtime only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/listening/academic/test-08/source.html services/backend/assets/listening/test-08.json services/backend/assets/listening/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore Test 8 source transcript and Script Completion"
            git push origin HEAD:fix/listening-tests-7-11-lexical-20261114
          fi
