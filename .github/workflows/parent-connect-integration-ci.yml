name: Parent Connect integration review
on:
  push:
    branches: ['feature/parent-connect-integration-20261112', 'fix/guardian-staff-messaging-20261112', 'fix/guardian-return-handoff-20261112', 'fix/guardian-session-people-retry-20261112', 'fix/guardian-null-dom-render-20261112', 'fix/parent-conversation-bot-20261112', 'fix/guardian-production-audit-20261112', 'main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r services/backend/requirements.txt pytest pytest-asyncio
      - run: python -m compileall -q services/backend/app
      - working-directory: services/backend
        run: python -m pytest -q tests/test_guardian_reply_routing.py tests/test_guardian_session_people_regression.py tests/test_guardian_connect.py tests/test_guardian_handoff_return.py tests/test_guardian_staff_access.py tests/test_telegram_handoff.py tests/test_study_plan_staff.py tests/test_telegram_subscription_flow.py tests/test_pool_discipline.py
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/telegram-bot/requirements.txt
      - run: python -m compileall -q services/telegram-bot
      - working-directory: services/telegram-bot
        env:
          TELEGRAM_BOT_TOKEN: '123456:TestOnlyBotToken'
          BOT_SERVICE_SECRET: 'test-only-secret'
          INTERNAL_API_URL: 'http://localhost:3000/api/internal/telegram'
          PUBLIC_SITE_URL: 'https://learnersarea.uz'
        run: python -m pytest -q tests
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test frontend/vanilla/tests/guardian-production-regressions.test.mjs frontend/vanilla/tests/guardian-connect.test.mjs frontend/vanilla/tests/guardian-return-handoff.test.mjs frontend/vanilla/tests/progress-v54.test.mjs
      - run: node scripts/bundle_browser.mjs
  backend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r services/backend/requirements.txt pytest pytest-asyncio
      - working-directory: services/backend
        run: python -m pytest -q tests
  browser-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test frontend/vanilla/tests/*.test.mjs
