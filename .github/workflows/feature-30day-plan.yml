name: 30-day learning plan feature tests

on:
  push:
    branches:
      - feature/30day-learning-plan-20261112
      - feature/study-plan-7-or-30-role-fix
      - fix/grammar-focus-plan-label-skill-dots
      - fix/grammar-group-check-vocab-ui
      - fix/plan-asgi-dashboard-leaderboard-top20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-plan-tests:
    name: Backend plan tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r services/backend/requirements.txt pytest pytest-asyncio
      - name: Verify Python source compiles
        run: python -m compileall -q services/backend/app
      - name: Run targeted plan and regression tests
        working-directory: services/backend
        run: python -m pytest -q tests/test_study_plan_thirty.py tests/test_study_plan_level.py tests/test_study_plan_month.py tests/test_study_plan_rules.py tests/test_study_plan_staff.py

  frontend-plan-tests:
    name: Frontend plan tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/vanilla/package-lock.json
      - name: Install frontend test dependencies
        run: npm ci --prefix frontend/vanilla --no-audit --no-fund
      - name: Validate modified JS syntax
        run: |
          node --check frontend/vanilla/modules/study-plan/level-check.js
          node --check frontend/vanilla/modules/study-plan/sequence-view.js
          node --check frontend/vanilla/modules/grammar/focus-book.js
          node --check frontend/vanilla/modules/grammar/practice-route.js
          node --check frontend/vanilla/modules/staff-final30/study-plans.js
          node --check frontend/vanilla/js/plan-entry-intent.js
          node --check frontend/vanilla/modules/premium-landing.js
          node --check frontend/vanilla/modules/grammar/book.js
          node --check frontend/vanilla/modules/grammar/book-skill.js
          node --check frontend/vanilla/modules/profile/level-select.js
          node --check frontend/vanilla/modules/grammar/book-runtime.js
          node --check frontend/vanilla/modules/grammar/quiz.js
          node --check frontend/vanilla/modules/vocabulary/words.js
          node --check frontend/vanilla/modules/vocabulary/dictionary.js
          node --check frontend/vanilla/modules/grammar/book-skill.js
          node --check frontend/vanilla/modules/study-plan/sequence-view.js
          node --check frontend/vanilla/modules/dashboard.js
          node --check frontend/vanilla/modules/assignments/index.js
          node --check frontend/vanilla/modules/study-plan/motivation.js
          node --check frontend/vanilla/modules/shell/dock.js
          node --check frontend/vanilla/modules/campus/chrome.js
          node --check frontend/vanilla/modules/campus/return-policy.js
      - name: Run plan and existing page regression tests
        working-directory: frontend/vanilla
        run: node --test tests/study-plan-sequence-ui.test.mjs tests/study-plan-level-check.test.mjs tests/grammar-plan-proof.test.mjs tests/dashboard-v3.test.mjs tests/student-profile-consolidation.test.mjs tests/study-plan.test.mjs tests/grammar-book.test.mjs tests/grammar-book-ui.test.mjs tests/assignments-dom-v59.test.mjs tests/dock-navigation.test.mjs tests/study-navigation-v69.test.mjs tests/navigation-v3.test.mjs tests/riwi-chat-experience.test.mjs tests/riwi-composer-shortcuts.test.mjs tests/riwi-dictation.test.mjs tests/riwi-integration.test.mjs tests/grammar-v48.test.mjs tests/instant-navigation.test.mjs tests/grammar-book-ui.test.mjs tests/grammar-focus-navigation.test.mjs tests/grammar-group-check.test.mjs tests/grammar-topic-quiz-retry.test.mjs tests/dictionary-interactions-v70.test.mjs tests/vocabulary-parity-v71.test.mjs tests/staff-study-plans.test.mjs tests/landing-plan-bridge.test.mjs tests/leaderboard-podium.test.mjs tests/leaderboard-podium.test.mjs

  asset-build:
    name: Production asset packaging (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bundle and asset build tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install rjsmin==1.2.5 rcssmin==1.2.2
      - name: Verify RIWI source catalogue matches the current code
        run: |
          node scripts/riwi-site-catalog.mjs
          git diff --exit-code -- services/backend/app/data/riwi_site_catalog.json
      - name: Bundle site imports (no deploy)
        run: node scripts/bundle_browser.mjs
      - name: Package versioned browser assets (no deploy)
        env:
          LA_BROWSER_BUNDLES: bundle-output
        run: python scripts/build_native_assets.py

# No deploy, PR, merge, production credentials, migrations or browser automation here.

  catalogue-refresh:
    name: Synchronize RIWI catalogue after source edits
    if: github.ref_name == 'fix/grammar-group-check-vocab-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/riwi-site-catalog.mjs
      - name: Commit catalogue on the feature branch only
        run: |
          if ! git diff --quiet -- services/backend/app/data/riwi_site_catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/backend/app/data/riwi_site_catalog.json
            git commit -m "chore(riwi): synchronize grammar and dictionary source fingerprint"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
