name: 30-day learning plan feature tests

on:
  push:
    branches:
      - feature/30day-learning-plan-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-plan-tests:
    name: Backend plan tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r services/backend/requirements.txt pytest pytest-asyncio
      - name: Verify Python source compiles
        run: python -m compileall -q services/backend/app
      - name: Run targeted plan and regression tests
        working-directory: services/backend
        run: python -m pytest -q tests/test_study_plan_thirty.py tests/test_study_plan_level.py tests/test_study_plan_month.py tests/test_study_plan_rules.py

  frontend-plan-tests:
    name: Frontend plan tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/vanilla/package-lock.json
      - name: Install frontend test dependencies
        run: npm ci --prefix frontend/vanilla --no-audit --no-fund
      - name: Validate modified JS syntax
        run: |
          node --check frontend/vanilla/modules/study-plan/level-check.js
          node --check frontend/vanilla/modules/study-plan/sequence-view.js
          node --check frontend/vanilla/modules/profile/level-select.js
          node --check frontend/vanilla/modules/grammar/book-runtime.js
          node --check frontend/vanilla/modules/grammar/book-skill.js
      - name: Run plan and existing page regression tests
        working-directory: frontend/vanilla
        run: node --test tests/study-plan-sequence-ui.test.mjs tests/study-plan-level-check.test.mjs tests/grammar-plan-proof.test.mjs tests/dashboard-v3.test.mjs tests/student-profile-consolidation.test.mjs tests/study-plan.test.mjs tests/grammar-book.test.mjs tests/grammar-book-ui.test.mjs tests/assignments-dom-v59.test.mjs

# No deploy, PR, merge, production credentials, migrations or browser automation here.
