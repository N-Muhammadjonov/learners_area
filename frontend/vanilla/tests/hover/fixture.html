<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learners Area isolated hover QA</title>
<link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/campus.css"><link rel="stylesheet" href="/css/riwi.css"><link rel="stylesheet" href="/css/dock.css">
<link rel="stylesheet" href="/modules/shared/design-system.css">
<style>
 body{margin:0;font-family:system-ui,sans-serif}main{padding:24px;min-height:100dvh}
 header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
 h1{font-size:22px;font-weight:650}p{font-size:14px}h2{font-weight:600}
 #sweep{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding-block:12px}
 #sweep a{display:block;min-height:96px;padding:14px 22px 32px 12px;font-size:12px;user-select:none}
 .samples{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-block:24px}
 .samples .card{padding:20px;min-height:154px;display:flex;flex-direction:column;gap:12px}
 .controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-block:24px}
 .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
 .fields label{display:grid;gap:8px}.fields :is(input,select,textarea){min-height:44px}
 #metrics{display:block;height:64px;overflow:auto;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px;color:rgb(var(--workspace-muted))}
 @media(max-width:639px){#sweep{grid-template-columns:repeat(3,minmax(0,1fr))}.samples,.fields{grid-template-columns:1fr}}
</style>
</head>
<body><div id="root"><div data-ui-system data-shell data-campus-shell><main data-shell-main>
<header><div><h1>Learners Area · isolated interaction QA</h1><p>Synthetic component examples. No learner data or backend writes.</p></div><div id="themes" class="controls"></div></header>
<h2>Rapid sweep · 12 independent navigation cards</h2><div id="sweep"></div>
<div class="samples" id="samples"></div><div class="controls" id="actions"></div>
<div class="fields" id="fields"></div><div class="controls" id="tabs"></div>
<div class="card p-5" data-ui-card="statistics" id="readonly">Read-only statistics panel · stays still <button class="btn-secondary" type="button">Retry</button></div>
<output id="metrics">No pointer sample yet.</output>
</main></div></div><script type="module" src="./fixture.mjs"></script></body></html>
